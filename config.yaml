# ==========================================================================
# SEO Signal Radar — configuration
#
# This is not a news aggregator. It's a signal radar:
#   X discovers anomalies -> official data confirms -> cases/data decide action.
#
# Everything is driven from this file. Edit here, not code.
# ==========================================================================

brand:
  daily_title: "Daily SEO/GEO Signal Radar"
  weekly_title: "Search Intelligence Weekly"
  monthly_title: "State of Search Monthly"
  special_title: "Search Intelligence Special Brief"
  language: "bilingual"        # bilingual | en | zh
  timezone: "Asia/Shanghai"

# --------------------------------------------------------------------------
# DAILY digest — "today, do I touch the site or not?"
# Keep it tight: 5-8 signals. Fast to read (< 5 min).
# --------------------------------------------------------------------------
daily:
  max_signals: 10
  min_signals: 6
  lookback_hours: 24
  # How many raw candidates the LLM is allowed to SEE before curating.
  # This is NOT max_signals. Curation can only be as good as the pool it
  # judges: if the model sees 8 candidates and is asked to keep 5-8, it keeps
  # almost everything and the whole trust ladder never gets exercised. Show it
  # a wide pool, let it throw most of it away.
  max_candidates: 70
  # Slow-moving, high-trust sources (controlled experiments, official docs,
  # deep analysis) don't publish daily. Judging them on a 24h window means a
  # quiet news day produces a thin digest. These categories get a longer
  # window, so an evergreen testable tactic can still surface today.
  evergreen_lookback_hours: 168        # 7 days
  evergreen_categories:
    - reproducible_experiment
    - data_research
    - official_documentation
    - official_person
  # CROSS-DAY STORY DEDUP. Item-level dedup (data/seen.json) keys on item id,
  # so one story discussed by five accounts over three days produces brand-new
  # items every day and quietly occupies a signal slot all week. The reader
  # experiences that as "this digest keeps telling me the same thing".
  # Two layers, deliberately: the model is TOLD what already ran (so it can
  # spend the slot on something else), and repeats are also filtered after the
  # fact (because the model will sometimes ignore the instruction).
  # An ESCALATION always survives: rumour -> officially confirmed is the single
  # most valuable thing this product delivers, not a repeat.
  dedupe_lookback_days: 4
  # Token-overlap (Jaccard) threshold for "same story". Works across EN/ZH
  # because CJK is compared per-character. Raise it if distinct stories get
  # merged; lower it if the same story keeps reappearing.
  dedupe_similarity: 0.65
  # Fixed sections, in display order. The LLM sorts signals into these.
  # Sections may be EMPTY — research and official explanations are slower-moving
  # than news, and padding them would defeat the point. Empty sections are
  # simply not rendered.
  sections:
    - "Confirmed Search Updates"
    - "Official Explanations"          # Google staff explaining mechanics
    - "SERP & Algorithm Signals"
    - "Technical SEO Experiments"
    - "AI Search / GEO"
    - "Research & Retrieval"           # IR / entity / knowledge-graph / papers
    - "Playbook: Worth Testing"        # evergreen, testable tactics (see below)
    - "Tools, Papers & Open Source"
    - "Unconfirmed Watchlist"
    - "Today's Action Items"
  # The one section that is NOT news. Most days Google confirms nothing, and a
  # digest that only carries breaking algorithm updates is empty on those days
  # while the reader still has hours to spend improving something. This section
  # carries tactics an SEO can go TEST — mechanism explained, effort and metric
  # named — in the spirit of a good Ahrefs/SearchPilot post. It does not need to
  # be new; it needs to be true, specific, and worth someone's afternoon.
  playbook:
    section: "Playbook: Worth Testing"
    # Unlike the news sections, this one should rarely be empty. If nothing
    # published today qualifies, reach into the longer evergreen window.
    min_items: 1
    max_items: 3
    # A playbook item is only worth printing if it answers all of these.
    requirements:
      - mechanism        # WHY it should work — not just that it did once
      - how_to_test      # the concrete check/experiment the reader runs
      - effort_and_risk  # rough cost, and what could go wrong
      - success_metric   # what number moves if it worked
  # Per-signal schema each item must fill.
  signal_fields:
    - "what_happened"     # 发生了什么 (<=120 chars, headline-style)
    - "why_it_matters"    # 为什么重要
    - "evidence"          # 证据：official doc / dataset / case / observation
    - "who_it_affects"    # 影响谁：ecommerce / publisher / SaaS / UGC / local / intl / all
    - "what_to_do"        # 值得做什么：check / test / monitor / no action
    - "confidence"        # Confirmed | Data-backed | Observed | Speculative
    - "impact"            # P0 | P1 | P2 | P3
  # Cap per-field length so the UI never becomes a wall of text.
  max_field_chars: 120
  # Generic audience verticals (this is a universal product — NOT tied to any
  # one site's own GSC data). "who_it_affects" must use these labels.
  verticals: ["ecommerce", "publisher", "SaaS", "UGC", "local", "international", "all"]


# --------------------------------------------------------------------------
# SCORING — how each candidate signal is ranked before curation.
# Weights sum to 100. A promo/duplicate penalty is subtracted after.
# --------------------------------------------------------------------------
scoring:
  # Rebalanced 2026-07-30. Was novelty 20 / actionability 10, which quietly
  # made this a news feed: a brand-new rumour outscored a well-evidenced
  # tactic the reader could actually go test. Novelty is now worth LESS than
  # actionability — being new is not a reason to act, and an evergreen finding
  # doesn't lose value because it was published last week.
  weights:
    source_authority: 25      # 来源权威性
    data_and_evidence: 25     # 数据与证据
    actionability: 20         # 可执行性 — can the reader do something with it
    potential_impact: 20      # 潜在影响
    novelty: 10               # 新颖度 — a tiebreaker, not a driver
  penalty:
    marketing_promo: 20       # subtract for course/lead-magnet/self-promo
    duplicate: 15             # subtract for rehash of already-covered items
  # Confidence tiers, highest-trust first. Used in output labels.
  confidence_tiers: ["Confirmed", "Data-backed", "Observed", "Speculative"]
  # Impact / priority levels. P0 loudest.
  impact_levels:
    P0: "立即检查 / check now"
    P1: "本周行动 / act this week"
    P2: "值得测试 / worth testing"
    P3: "仅了解 / awareness only"

  # TRUST LADDER. Every source carries a source_type; this is what it's worth.
  # The gap that matters: an official person explaining mechanics (0.90) beats
  # a vendor with a product to sell (0.45), even when the vendor is louder.
  source_weights:
    official_api: 1.00              # Google Search Status, platform accounts
    official_documentation: 1.00    # Search Central docs + changelog
    official_person: 0.90           # @JohnMu, @methode
    reproducible_experiment: 0.90   # SearchPilot, documented A/B tests
    data_research: 0.85             # studies with samples and method
    expert_analysis: 0.70           # independent practitioner analysis
    expert_vendor: 0.65             # expert who also sells a tool/consultancy
    practitioner_observation: 0.60  # credible first-hand report
    trade_news: 0.55                # SEL / SEJ / SER reporting
    vendor_opinion: 0.45            # opinion from someone selling a tool
    unverified_claim: 0.20          # rumour, screenshot, no method

  # An "experiment" only earns its 0.90 if it actually shows its work.
  # Missing any of these -> treat as practitioner_observation instead.
  experiment_requirements:
    - methodology
    - sample_or_scope
    - measured_outcome

# --------------------------------------------------------------------------
# CURATION RUBRIC — the main quality dial. Passed verbatim to the LLM.
# --------------------------------------------------------------------------
curation:
  keep:
    - "Data-driven findings (CTR studies, ranking correlation, traffic data, sample sizes)"
    - "Novel experiments with results (esp. AI search / AEO / GEO tests with methodology)"
    - "Officially confirmed algorithm / ranking / SERP-feature changes"
    - "Google / Bing / OpenAI / Perplexity / Cloudflare product or policy changes affecting search"
    - "Technical SEO depth: crawling, rendering, indexing, structured data, log analysis, edge SEO"
    - "Primary-source statements from platform reps (@searchliaison, @googlesearchc, @BingWMC)"
    - "Query fan-out, entity/knowledge-graph, agentic-traffic research with evidence"
    # Evergreen actionability: the reason this isn't just a news feed.
    - "Repeatable tactics with a stated MECHANISM the reader can test on their own site — even if not new"
    - "Controlled experiments including NEGATIVE and inconclusive results (they stop wasted work)"
    - "Concrete diagnostic workflows: how to check, measure or debug a specific problem"
  drop:
    - "'SEO is dead' takes, hot takes with no data"
    - "Course / cohort / lead-magnet promotion, pure self-promo"
    - "Rehashed SEO basics aimed at beginners"
    - "Single-site ranking screenshots presented as trends"
    - "GEO experiments that dress correlation as causation, or lack sample sizes"
    - "AI-citation 'wins' with no methodology"
    # A tactic without a mechanism is superstition, however confidently stated.
    - "Tactics with no explanation of WHY they work, or no way to verify them"

# --------------------------------------------------------------------------
# X / TWITTER — four separate Lists, not one info hot-pot.
# Fetched via Nitter RSS (no twikit, no cookies). Public Nitter instances are
# tried in order; the first that returns a valid feed for a handle wins.
# Update the instance list when one goes stale.
# --------------------------------------------------------------------------
x:
  enabled: true
  tweets_per_handle: 15
  nitter_instances:
    - nitter.net
    - nitter.privacyredirect.com

  # ONE ACCOUNT, MANY TAGS.
  # Previously handles were nested under lists, so lilyraynyc / VeryWellVersed /
  # brodieseo appeared in two groups each and got fetched + stored twice. Now
  # every account is listed exactly once and carries tags; the classifier
  # decides which section a post lands in.
  #
  #   source_type      -> maps into scoring.source_weights (the trust ladder)
  #   commercial_interest: true -> has a tool/consultancy to sell. Opinion stays
  #                        "Observed"; only data/code/papers lift it higher.
  accounts:
    # ---- Official platform accounts ------------------------------------
    searchliaison:  {source_type: official_api,   tags: [official, algorithm, ranking]}
    googlesearchc:  {source_type: official_api,   tags: [official, documentation, technical_seo]}
    BingWMC:        {source_type: official_api,   tags: [official, bing, ai_search]}
    Cloudflare:     {source_type: official_api,   tags: [official, infrastructure, ai_crawler]}

    # ---- Official people: Google staff explaining mechanics -------------
    # Not daily news, but when they explain a boundary it outranks any pundit.
    JohnMu:         {source_type: official_person, tags: [official_explainer, indexing, crawling, content_quality]}
    methode:        {source_type: official_person, tags: [official_explainer, crawling, indexing, serving, search_architecture]}

    # ---- Algorithm & SERP observation ----------------------------------
    rustybrick:     {source_type: trade_news,      tags: [algorithm, serp_features, news]}
    glenngabe:      {source_type: data_research,   tags: [algorithm, volatility, content_quality]}
    Marie_Haynes:   {source_type: expert_analysis, tags: [algorithm, content_quality, e_e_a_t]}
    lilyraynyc:     {source_type: expert_analysis, tags: [algorithm, content_quality, ai_search, publishers]}
    brodieseo:      {source_type: expert_analysis, tags: [serp_features, ecommerce, ai_search]}

    # ---- Technical SEO & reproducible experiments -----------------------
    patrickstox:    {source_type: expert_analysis, tags: [technical_seo, indexing]}
    thetafferboy:   {source_type: expert_analysis, tags: [technical_seo, performance]}
    VeryWellVersed: {source_type: expert_analysis, tags: [technical_seo, information_retrieval, ai_search, experiments]}
    jroakes:        {source_type: expert_analysis, tags: [technical_seo, python, information_retrieval]}
    Jammer_Volts:   {source_type: expert_analysis, tags: [technical_seo, crawling, rendering, indexing, javascript, ai_crawler]}
    jonoalderson:   {source_type: expert_analysis, tags: [technical_seo, web_standards, performance, structured_data]}
    willcritchlow:  {source_type: reproducible_experiment, tags: [experiments, ab_testing, causal_inference]}
    screamingfrog:  {source_type: expert_vendor,   tags: [technical_seo, tools, crawling], commercial_interest: true}
    sitebulb:       {source_type: expert_vendor,   tags: [technical_seo, tools, auditing], commercial_interest: true}

    # ---- Retrieval, entities, knowledge graph, AI search ----------------
    dawnieando:     {source_type: expert_analysis, tags: [information_retrieval, entity, technical_seo, ai_search]}
    Olaf_Kopp:      {source_type: expert_analysis, tags: [semantic_seo, entity, e_e_a_t, patents, ai_search]}
    cyberandy:      {source_type: expert_vendor,   tags: [knowledge_graph, structured_data, linked_data, ai_agent], commercial_interest: true}
    Dixon_Jones:    {source_type: expert_vendor,   tags: [entity, knowledge_graph, internal_linking, ai_visibility], commercial_interest: true}
    aleyda:         {source_type: expert_analysis, tags: [ai_search, geo, international]}
    Kevin_Indig:    {source_type: data_research,   tags: [ai_search, geo, data_research, growth]}
    randfish:       {source_type: expert_analysis, tags: [ai_search, zero_click, industry]}
    jasonmbarnard:  {source_type: expert_vendor,   tags: [entity, knowledge_graph, brand_serp], commercial_interest: true}

    # ---- Publisher / News / Discover ------------------------------------
    NewsSEO_:       {source_type: expert_analysis, tags: [publishers, google_news, discover]}

  # Deliberately NOT fetched. Kept here so nobody re-adds them by accident.
  excluded_or_manual_review:
    badams:    "Old handle — X account no longer belongs to Barry Adams. Track Polemic Digital / NewsSEO instead."
    facan:     "Fabrice Canel retired from Microsoft 2026-07-01 — no longer a current Bing source. Use @BingWMC."
    g33konaut: "Martin Splitt — current X status unverified. Track via Search Central + Search Off the Record instead."

  # Keyword search is disabled — Nitter RSS has no reliable search endpoint.
  # The curated accounts above are the primary signal source.
  keyword_search:
    enabled: false

  # What survives the fetch, before the LLM ever sees it.
  filters:
    keep:
      - "Original posts"
      - "Quote-tweets that add independent analysis"
      - "Posts containing an external link, chart, dataset, code or case study"
      - "The same phenomenon independently reported by multiple trusted accounts"
    drop:
      - "Plain retweets with no added comment"
      - "Replies that carry no new information"
      - "Course, conference and tool promotion"
      - "'SEO is dead' / 'GEO fully replaces SEO' opinion fireworks"
      - "Traffic screenshots with no date range or methodology"

# --------------------------------------------------------------------------
# RSS — reliable, no auth.
# --------------------------------------------------------------------------
rss:
  enabled: true
  max_items_per_feed: 10
  # category feeds the source_weights ladder below; weight is a local nudge.
  feeds:
    # ---- Official fact sources -----------------------------------------
    - {name: "Google Search Central Blog", url: "https://developers.google.com/search/blog/feed.xml",
       category: official_documentation, weight: 1.0}
    # Finer-grained than the blog: robots, structured data, Search Console and
    # feature-rule changes often appear ONLY in the docs-changelog feed.
    - {name: "Google Search Docs Updates", url: "https://developers.google.com/static/search/blog/release-notes.xml",
       category: official_documentation, weight: 1.0, always_include_if_material: true}
    - {name: "Bing Webmaster Blog", url: "https://blogs.bing.com/webmaster/feed",
       category: official_documentation, weight: 0.95}

    # ---- Controlled experiments (the scarcest, most valuable input) ------
    # Keep negative and inconclusive tests — they are often worth more than wins.
    - {name: "SearchPilot Resources", url: "https://www.searchpilot.com/resources/rss.xml",
       category: reproducible_experiment, weight: 0.95}

    # ---- Data research --------------------------------------------------
    - {name: "Ahrefs Blog", url: "https://ahrefs.com/blog/feed/",
       category: data_research, weight: 0.85}
    - {name: "SISTRIX Blog", url: "https://www.sistrix.com/blog/feed/",
       category: data_research, weight: 0.8}

    # ---- Technical / tooling --------------------------------------------
    - {name: "Screaming Frog Blog", url: "https://www.screamingfrog.co.uk/blog/feed/",
       category: expert_vendor, weight: 0.7, commercial_interest: true}

    # ---- AI search architecture (deep, but opinionated — demand citations) --
    - {name: "iPullRank Blog", url: "https://ipullrank.com/feed",
       category: expert_analysis, weight: 0.75, requires_citation: true}

    # ---- Trade news: fast event radar, low weight ------------------------
    - {name: "Search Engine Roundtable", url: "https://www.seroundtable.com/index.rss",
       category: trade_news, weight: 0.6}
    - {name: "Search Engine Land", url: "https://searchengineland.com/feed",
       category: trade_news, weight: 0.6}
    # Discovery tier only — rarely the reason a signal makes the digest.
    - {name: "Search Engine Journal", url: "https://www.searchenginejournal.com/feed/",
       category: trade_news, weight: 0.45}

# --------------------------------------------------------------------------
# GOOGLE SEARCH STATUS — official confirmation layer (drives Special Briefs)
# Uses affected_products[].id (service_key is deprecated per official schema).
# --------------------------------------------------------------------------
google_status:
  enabled: true
  incidents_url: "https://status.search.google.com/incidents.json"
  feed_url: "https://status.search.google.com/en/feed.atom"
  # Known product ids. Ranking is the primary one for SEO.
  products:
    ranking: "rGHU1u87FJnkP6W2GwMi"   # Ranking updates (Core/Spam/Reviews often land here)
  # A new/updated incident on these products triggers a Special Brief.
  special_brief_on: ["ranking"]

# --------------------------------------------------------------------------
# SERP VOLATILITY & CONSENSUS LAYER
# Does NOT average raw values. Stores raw for provenance, decides on the
# 180-day percentile. Two axes: Global Heat (whole market) vs Vertical Heat
# (per-industry — this is a UNIVERSAL product, not tied to any one site).
# Default sources are manual/watchlist until you wire APIs.
# --------------------------------------------------------------------------
serp_layer:
  enabled: true
  # Percentile buckets -> label.
  bands:
    - {max: 59, label: "Normal"}
    - {max: 79, label: "Elevated"}
    - {max: 94, label: "High"}
    - {max: 100, label: "Extreme"}
  # Rolling window used to compute percentile of today's raw value.
  percentile_window_days: 180
  # Event generation thresholds (see serp_layer.py).
  event_rules:
    global_sustained_days: 2       # Global Heat >= 90 for N days -> event
    global_sustained_min: 90
    global_spike_min: 97           # or Global Heat >= 97 for 1 day
    vertical_min: 95               # or a vertical's Heat >= 95 ...
    vertical_fraction: 0.25        # ... with >=25% of tracked verticals anomalous
    event_end_below: 70            # ends after N days Global Heat < this
    event_end_days: 3
  # Source adapters. "manual" = you record values; others need API keys/wiring.
  sources:
    sistrix:  {role: "global",       adapter: "manual"}  # macro sensor
    algoroo:  {role: "confirmation", adapter: "manual"}  # independent cross-check
    awr:      {role: "vertical",     adapter: "manual"}  # per-industry (has API/MCP)
  # Industry verticals tracked for Vertical Heat (universal, not own-site).
  verticals: ["ecommerce", "publisher", "SaaS", "local", "international"]

# --------------------------------------------------------------------------
# REPORTS — daily feeds weekly feeds monthly. Each has a distinct job.
#   daily:   what happened (24-72h)     -> signals & alerts
#   weekly:  what truly mattered (1-4w) -> judgments & experiments  [reduce noise]
#   monthly: structural trends (1-6mo)  -> strategy & allocation    [reduce misjudgment]
# --------------------------------------------------------------------------
reports:
  weekly:
    # Tuesday 09:30 local (cover previous Mon-Sun). Not Monday: EU weekend
    # research + GSC data still preliminary.
    cadence_cron: "30 9 * * 2"
    period: "prev_mon_sun"
    read_minutes: 10
    max_signals: 10
    max_themes: 3
    sections:
      - "This Week's 3 Core Judgments"     # conclusion first, w/ for/against evidence + confidence
      - "Algorithm & SERP Map (14-30d)"    # Confirmed/Correlated/Possibly Related/No Evidence
      - "Google & Search Platforms"
      - "AI Search / GEO"                  # report new signals only, no over-trending
      - "Technical SEO Lab"                # 1-3 testable experiments w/ hypothesis+cost+metric
      - "Noise Cancelled"                  # this week's non-actionable hype (product memory hook)
      - "Next Week's Action Items"         # <=3: P0 check / P1 test / P2 watch
  monthly:
    # 4th working day of the month, ~09:30 local. Cron approximates; code
    # verifies it is actually the 4th working day before running.
    cadence_cron: "30 9 4-6 * *"
    period: "prev_calendar_month"
    read_minutes: 25
    max_narratives: 5
    min_narratives: 3
    sections:
      - "Executive Summary"                # 3 changes / 2 risks / 2 opportunities / 1 stop
      - "Monthly Search Scoreboard"
      - "Structural Trends (3-5 narratives)"
      - "Algorithm Impact Review (90d view)"
      - "AI Search / GEO Index"            # stable metrics, 3-month direction — not single prompts
      - "Winners & Losers"                 # shared characteristics, not just up/down
      - "Experiment Results"               # Scale/Continue/Modify/Stop/Inconclusive
      - "Next Month's Resource Allocation" # Double Down / Test / Stop
  special_brief:
    # Event-driven, not scheduled. Two nodes for algorithm updates:
    #   Update Started      -> Update Alert (monitoring only, no diagnosis)
    #   Completed + 7 days  -> Post-update Analysis
    post_update_delay_days: 7
    triggers:
      - "Google confirms Core / Spam / Reviews / Discover update"
      - "Large-scale Search/crawl/index incident"
      - "Major AI Overview / AI Mode / search product change"
      - "Important Chrome / robots / structured-data rule change"
      - "SERP volatility crosses anomaly threshold (see serp_layer)"

# --------------------------------------------------------------------------
# LLM (provider-agnostic). Keys in .env.
# --------------------------------------------------------------------------
llm:
  # "auto" = use whichever API key you set in .env / GitHub secrets.
  # Force one explicitly with: scnet(glm) | moonshot(kimi) | anthropic | openai
  provider: "auto"
  # SCNet (超算互联网) — SCNet-Max (fast, non-reasoning) via OpenAI-compatible API
  scnet_model: "SCNet-Max"
  scnet_base_url: "https://api.scnet.cn/api/llm/v1"
  moonshot_model: "kimi-k2.5"
  moonshot_base_url: "https://api.moonshot.ai/v1"
  anthropic_model: "claude-opus-4-8"
  openai_model: "gpt-4o"
  max_output_tokens: 8000
  temperature: 0.3

# --------------------------------------------------------------------------
# OUTPUT & ARCHIVE
# --------------------------------------------------------------------------
output:
  dir: "reports"
  formats: ["md", "html"]
  # Structured daily archive that weekly/monthly + dashboard read from.
  archive_dir: "data/archive"

# --------------------------------------------------------------------------
# DASHBOARD — the "single source of truth" web product. One self-contained
# HTML file that reads the daily archive. Three views: Today / Algorithm Map /
# Source Library. Linear-style light UI.
# --------------------------------------------------------------------------
dashboard:
  enabled: true
  output_file: "dashboard/index.html"
  # How many days of archive to embed (Library + Map history).
  # Sizing, from real measurements: ~12 KB of archive per day, embedded inline,
  # so 365 days is a ~4.5 MB single page. That's fine on desktop. If you ever
  # push this past ~1000 days the page gets heavy on mobile — at that point
  # split the Library into a separate lazy-loaded JSON rather than raising this.
  history_days: 365
  # Source-coverage warning threshold. Below this fraction of reachable sources
  # the dashboard shows an amber strip; at zero reachable it turns red. Without
  # this, a dead Nitter produces a short digest that looks exactly like a quiet
  # news day — and you'd trust it for weeks.
  source_warn_ratio: 0.7
  # One-line thesis shown in the header.
  thesis: "What changed in Search, why it matters, and what to do next."
  thesis_zh: "搜索发生了什么，为什么重要，今天该做什么。"
  map_ranges: ["7D", "30D", "90D", "1Y"]

# --------------------------------------------------------------------------
# NOTIFY — compressed push. The web dashboard is the full product; the
# notification is only a cover: 3 signals + official status + <=2 actions +
# a link back. Webhook is generic; pick your channel's format.
# --------------------------------------------------------------------------
notify:
  enabled: true
  top_signals: 3
  max_actions: 2
  # Where "view full digest" points (your Pages URL or file path).
  dashboard_url: "https://zfselvia-ai.github.io/seo-signal-radar/"
  # channel format: "slack" | "discord" | "telegram" | "feishu" | "pushplus" | "plain"
  channel: "pushplus"
  # Webhook URL read from env NOTIFY_WEBHOOK_URL (keep secrets out of config).

