name: Daily Signal Radar

on:
  schedule:
    - cron: "0 1 * * *"     # 09:00 Asia/Shanghai
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt

      - name: Cache state
        uses: actions/cache@v4
        with:
          path: |
            data/seen.json
            data/serp_history.csv
          key: radar-state-v2-${{ github.run_id }}
          restore-keys: radar-state-v2-

      - name: Run daily
        env:
          SCNET_API_KEY: ${{ secrets.SCNET_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python main.py daily

      - name: Commit archive + reports
        run: |
          git config user.name "radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/archive reports/ || true
          git commit -m "daily: $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push || echo "push skipped"
