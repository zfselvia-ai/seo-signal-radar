<script>
const DATA = JSON.parse(document.getElementById("radar-data").textContent);
const HEATVAR = {Extreme:"--heat-extreme",High:"--heat-high",Elevated:"--heat-elevated",
  Normal:"--heat-normal",Unknown:"--heat-unknown"};
/* Escape untrusted text. Everything here comes from fetched third-party pages
   and tweets, and some of it lands inside href="…" attributes, so the double
   quote has to be covered — an unescaped one in a source URL would close the
   attribute and let the rest of the string become markup. (It was previously
   missing: the map had two ' keys and no ", which silently turned every
   double quote in a quoted excerpt into the string "undefined".) */
const ESCMAP = {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"};
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>ESCMAP[c]);
const heatColor = b => `var(${HEATVAR[b]||"--heat-unknown"})`;

document.getElementById("thesis").innerHTML =
  esc(DATA.thesis) + (DATA.thesis_zh?`<span class="zh">${esc(DATA.thesis_zh)}</span>`:"");
document.getElementById("footer").textContent =
  `${DATA.days_archived} days archived · ${DATA.library.length} signals · generated ${DATA.generated_at.slice(0,16).replace("T"," ")} UTC`;

/* ---------------- nav ---------------- */
document.querySelectorAll("nav button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    document.getElementById("view-"+b.dataset.view).classList.add("active");
  };
});

/* ---------------- date picker + range buttons ---------------- */
const ARCHIVE = DATA.archive || {};
const DATES = Object.keys(ARCHIVE).sort().reverse();
const picker = document.getElementById("date-picker");
let selectedDate = DATA.today?.date || (DATES[0] || "");
let selectedRange = 1; // 1, 3, or 7 days
DATES.forEach(d => {
  const opt = document.createElement("option");
  opt.value = d;
  opt.textContent = d;
  if (d === selectedDate) opt.selected = true;
  picker.appendChild(opt);
});
picker.onchange = () => { selectedDate = picker.value; renderToday(); };

// Range buttons
const rangeBtns = document.querySelectorAll(".range-btn");
rangeBtns.forEach(btn => {
  btn.onclick = () => {
    rangeBtns.forEach(b => {
      b.classList.remove("active");
      b.style.background = "var(--surface)";
      b.style.borderColor = "var(--line-strong)";
      b.style.color = "var(--ink)";
    });
    btn.classList.add("active");
    btn.style.background = "var(--ink)";
    btn.style.borderColor = "var(--ink)";
    btn.style.color = "#fff";
    selectedRange = parseInt(btn.dataset.range);
    renderToday();
  };
});
// Style the active button on load
(function(){
  const active = document.querySelector(".range-btn.active");
  if(active){active.style.background="var(--ink)";active.style.borderColor="var(--ink)";active.style.color="#fff";}
})();

/* Get the N most recent days ending at selectedDate */
function getRangeRecords(days) {
  const idx = DATES.indexOf(selectedDate);
  if (idx < 0) return [];
  return DATES.slice(idx, idx + days).reverse(); // chronological
}

/* Merge multiple days' records into one virtual record for display */
function mergeRecords(recs) {
  if (recs.length === 1) return recs[0];
  const merged = {date: `${recs[0].date} ~ ${recs[recs.length-1].date}`, sections: {}, headline: ""};
  let totalDropped = 0;
  recs.forEach(r => {
    totalDropped += r.dropped_count || 0;
    Object.entries(r.sections || {}).forEach(([sec, arr]) => {
      if (!merged.sections[sec]) merged.sections[sec] = [];
      // Tag each signal with its source date for multi-day view
      arr.forEach(s => {
        if (sec === "Today's Action Items") {
          merged.sections[sec].push(s);
        } else {
          merged.sections[sec].push({...s, _date: r.date});
        }
      });
    });
  });
  merged.dropped_count = totalDropped;
  // Use the latest day's headline
  merged.headline = recs[recs.length-1]?.headline || "";
  merged.serp = recs[recs.length-1]?.serp;
  merged.confirmed_updates = recs.flatMap(r => r.confirmed_updates || []);
  return merged;
}

/* ---------------- Today ---------------- */
function tag(imp){return imp?`<span class="tag ${esc(imp)}">${esc(imp)}</span>`:"";}
function confTag(c){return c?`<span class="tag conf">${esc(c)}</span>`:"";}
/* Shown when the pipeline could not verify a single source URL for a signal.
   Silence here would be worse than the warning: an unlinked card looks exactly
   like one we simply didn't bother to cite. */
function unverTag(s){return s.unverified?`<span class="tag unver" title="No source URL could be verified against the candidate pool">unverified</span>`:"";}

function morningBrief(rec){
  const sigs=[];
  Object.entries(rec.sections||{}).forEach(([sec,arr])=>{
    if(sec!=="Today's Action Items") arr.forEach(s=>{if(s.what_happened)sigs.push(s);});
  });
  const impacts=sigs.map(s=>s.impact||"");
  const top=["P0","P1","P2","P3"].find(p=>impacts.includes(p))||"—";
  const confirmed=(rec.sections?.["Confirmed Search Updates"]||[]).length>0;
  const band=(rec.serp||{}).global_band||"Unknown";
  const testable=impacts.filter(i=>i==="P0"||i==="P1"||i==="P2").length;
  return {n:sigs.length,top,confirmed,band,testable};
}

/* Source health strip. Silent-failure guard: a dead Nitter and a quiet news
   day produce the same short digest, so coverage has to be visible. */
function healthStrip(rec){
  const rm=rec.run_meta||{};
  const src=rm.sources||{};
  if(!src.x&&!src.rss) return "";
  const parts=[];let worst=0;  // 0 ok, 1 degraded, 2 down
  [["X",src.x],["RSS",src.rss]].forEach(([label,h])=>{
    if(!h||!h.total) return;
    const ratio=h.ok/h.total;
    if(h.ok===0) worst=2; else if(ratio<(DATA.source_warn_ratio??0.7)) worst=Math.max(worst,1);
    parts.push(`<span class="hitem">${label} ${h.ok}/${h.total}</span>`);
  });
  if(!parts.length) return "";
  const cls=worst===2?"down":(worst===1?"warn":"");
  let note="";
  if(worst===2) note="One source layer is completely unavailable — today's digest is NOT representative.";
  else if(worst===1) note="Reduced source coverage — today may be thinner than reality.";
  const failed=[...(src.x?.failed_names||[]),...(src.rss?.failed_names||[])];
  if(worst&&failed.length) note+=` Unreachable: ${failed.slice(0,6).join(", ")}`;
  return `<div class="health ${cls}"><span class="hdot"></span>
    <span class="hitem">Sources</span>${parts.join("")}
    ${note?`<span class="hnote">${esc(note)}</span>`:""}</div>`;
}

function renderToday(){
  const rangeRecs = getRangeRecords(selectedRange);
  const rec = selectedRange === 1 ? (ARCHIVE[selectedDate] || DATA.today || {}) : mergeRecords(rangeRecs);
  const el=document.getElementById("view-today");
  if(!rec.date){el.innerHTML=`<p class="lib-empty">No daily report yet. Run <code>python main.py daily</code> first.</p>`;return;}
  const b=morningBrief(rec);
  const isMultiDay = selectedRange > 1;
  const isLatest = rec.date === (DATA.today?.date || "");
  let h=`<div class="date-label">${esc(rec.date)}${isMultiDay?"":(isLatest?"":" (historical)")}</div>`;
  const urgent=(b.top==="P0");
  // SERP sources are manual adapters by default. Printing "Unknown" invited the
  // reading "calm"; when nothing is wired we say so instead.
  const serpLive=DATA.serp_connected&&b.band&&b.band!=="Unknown";
  const serpCell=serpLive
    ? `<span class="dot-heat" style="background:${heatColor(b.band)}"></span>${esc(b.band)}`
    : `<span style="color:var(--ink-3);font-size:12px;">未接入 / not connected</span>`;
  h+=`<div class="brief">
      <div class="stat lead${urgent?" urgent":""}"><span class="k">Top priority</span><span class="v">${esc(b.top)}</span></div>
      <div class="stat"><span class="k">Signals</span><span class="v">${b.n}</span></div>
      <div class="stat"><span class="k">To act / test</span><span class="v">${b.testable}</span></div>
      <div class="stat"><span class="k">Confirmed update</span><span class="v">${b.confirmed?"Yes":"No"}</span></div>
      <div class="stat"><span class="k">SERP heat</span><span class="v">${serpCell}</span></div>
    </div>`;
  h+=healthStrip(selectedRange===1?(ARCHIVE[selectedDate]||DATA.today||{}):(rangeRecs.length?ARCHIVE[rangeRecs[rangeRecs.length-1]]||{}:{}));
  if(rec.headline) h+=`<div class="headline">${esc(rec.headline)}</div>`;
  h+=serpWeather(rec.serp);

  /* Action Items first */
  const actions=rec.sections?.["Today's Action Items"];
  if(actions&&actions.length){
    h+=`<div class="actions-card"><h2>${isMultiDay?"Action Items":"Today's Action Items"}</h2><ul>`+
      actions.map(s=>`<li>${tag(s.impact)}<span>${esc(s.what_to_do)}</span></li>`).join("")+
      `</ul></div>`;
  }

  (DATA.sections||[]).forEach(sec=>{
    if(sec==="Today's Action Items") return;
    const arr=(rec.sections||{})[sec];
    if(!arr||!arr.length)return;
    h+=`<h2 class="section">${esc(sec)} <span class="count">${arr.length}</span></h2>`;
    arr.forEach(s=>{
      const imp=(s.impact||"").toUpperCase();
      h+=(imp==="P3") ? miniRow(s, isMultiDay) : signalCard(s, isMultiDay);
    });
  });
  if(rec.dropped_count) h+=`<p class="date-label" style="margin-top:20px">Filtered out ${rec.dropped_count} lower-value candidates.</p>`;
  el.innerHTML=h;
}

/* Evidence expansion: the LLM's longer write-up, then the verbatim source
   text. Excerpt-first in spirit — the quote is the part that cannot have been
   fabricated, since it's copied from the fetched item, so it's what settles
   any doubt about the summary above it. */
function evidencePanel(s){
  const detail=s.evidence_detail?`<div class="edetail">${esc(s.evidence_detail)}</div>`:"";
  const quotes=(s.sources||[]).filter(x=>x.excerpt).map(x=>{
    const bits=[];
    if(x.author) bits.push(esc(x.author));
    if(x.published) bits.push(esc(String(x.published).slice(0,10)));
    if(x.source_type) bits.push(`<span class="qtier">${esc(String(x.source_type).replace(/_/g," "))}</span>`);
    // A vendor benchmarking their own product is context the reader needs to
    // weigh the number, so it travels with the quote rather than being buried.
    if(x.commercial_interest) bits.push(`<span class="qci">commercial interest</span>`);
    return `<div class="quote">
      <div class="qhead">${bits.join("")}</div>
      <div class="qtext">${esc(x.excerpt)}</div>
      ${x.url?`<a class="qlink" href="${esc(x.url)}" target="_blank" rel="noopener">View original ↗</a>`:""}
    </div>`;
  }).join("");
  if(!detail&&!quotes) return "";
  const n=(s.sources||[]).filter(x=>x.excerpt).length;
  const label=n?`Evidence · ${n} source${n===1?"":"s"}`:"Evidence detail";
  return `<details class="eviexp"><summary>${label}</summary>
    <div class="evibody">${detail}${quotes}</div></details>`;
}

function signalCard(s, multiDay){
  const imp=s.impact||"";
  const row=(lab,key)=> s[key]?`<div class="row"><span class="lab">${lab}</span><span>${esc(s[key])}</span></div>`:"";
  const srcs=(s.sources||[]).map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name||"source")} ↗</a>`).join("");
  const recipe=[row("Test","how_to_test"),row("Measure","success_metric"),
                row("Effort","effort")].join("");
  const testbox=recipe.trim()?`<div class="testbox">${recipe}</div>`:"";
  const dateTag = (multiDay && s._date) ? `<span class="tag" style="color:var(--ink-3);background:var(--surface-strong);border:1px solid var(--line);font-family:var(--mono);">${esc(s._date)}</span>` : "";
  return `<div class="card ${esc(imp)}">
    <div class="what"><span class="wtext">${esc(s.what_happened)}</span>
      <span class="badges">${dateTag}${tag(s.impact)}${confTag(s.confidence)}${unverTag(s)}</span></div>
    ${row("Why","why_it_matters")}${row("Evidence","evidence")}
    ${row("Affects","who_it_affects")}${row("Action","what_to_do")}
    ${evidencePanel(s)}
    ${testbox}
    ${srcs?`<div class="srcs">${srcs}</div>`:""}
  </div>`;
}

/* Low-priority signals: one scannable line, not a full card. */
function miniRow(s, multiDay){
  const src=(s.sources||[])[0];
  const link=src?`<a class="msrc" href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.name||"source")} ↗</a>`:"";
  const why=s.why_it_matters?` — ${esc(s.why_it_matters)}`:"";
  const dateTag = (multiDay && s._date) ? `<span style="font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-right:6px;">${esc(s._date)}</span>` : "";
  return `<div class="mini">${tag(s.impact)}${dateTag}
    <span class="mtext"><b>${esc(s.what_happened)}</b>${why}</span>${link}</div>`;
}

function serpWeather(serp){
  if(!serp||!serp.global_band) return "";
  const cell=(k,band,v)=>`<div class="serp-cell ${esc(band||'')}"><div class="k">${k}</div>
    <div class="v">${band?`<span class="dot-heat" style="background:${heatColor(band)}"></span>`:""}${esc(v)}</div></div>`;
  const av=serp.anomalous_verticals&&serp.anomalous_verticals.length?serp.anomalous_verticals.join(", "):"none";
  let h=`<div class="serp-grid">
    ${cell("Global Heat",serp.global_band,`${serp.global_band} (${serp.global_heat??"?"})`)}
    ${cell("Vertical Heat",serp.vertical_band,`${serp.vertical_band??"?"} (${serp.vertical_heat??"?"})`)}
    ${cell("Source Agreement","",serp.source_agreement??"n/a")}
    ${cell("Affected Verticals","",av)}
    </div>`;
  if(serp.quadrant) h+=`<div class="serp-note">${esc(serp.quadrant)}. ${esc(serp.interpretation||"")}</div>`;
  return h;
}

/* ---------------- Algorithm Map ---------------- */
const TRACKS=[
  {key:"official",t:"Official",d:"Google confirms"},
  {key:"external",t:"External flux",d:"SERP volatility"},
  {key:"community",t:"Community",d:"expert signals"},
];
let mapRange=(DATA.map_ranges&&DATA.map_ranges[1])||"30D";

function rangeDays(r){return {"7D":7,"30D":30,"90D":90,"1Y":365}[r]||30;}

function renderMap(){
  const el=document.getElementById("view-map");
  const days=rangeDays(mapRange);
  const now=new Date();
  const start=new Date(now.getTime()-days*864e5);
  const ev=(DATA.map_events||[]).filter(e=>{
    const d=new Date(e.date+"T00:00:00Z"); return d>=start && d<=now;
  });
  let h=`<div class="map-controls">`+
    (DATA.map_ranges||[]).map(r=>`<button data-r="${r}" class="${r===mapRange?"active":""}">${r}</button>`).join("")+`</div>`;
  h+=`<div class="legend">
    <span><span class="dot-heat" style="background:var(--heat-extreme)"></span>Extreme</span>
    <span><span class="dot-heat" style="background:var(--heat-high)"></span>High</span>
    <span><span class="dot-heat" style="background:var(--heat-elevated)"></span>Elevated</span>
    <span><span class="dot-heat" style="background:var(--heat-normal)"></span>Normal</span></div>`;

  // Always draw the three lanes, even with no events: the lanes themselves
  // carry information (which layers exist, and which have no source wired).
  // Hiding them behind a single "no events" message was how the permanently
  // empty External-flux track stayed invisible.
  if(!ev.length){
    h+=`<div class="map-empty">No timeline events in the last ${esc(mapRange)}. Confirmed updates, SERP flux and community signals appear here as the archive fills in.</div>`;
  }
  {
    const span=Math.max(1,(now-start));
    const pos=d=>((new Date(d+"T00:00:00Z")-start)/span)*100;
    TRACKS.forEach(tr=>{
      const mine=ev.filter(e=>e.track===tr.key);
      // An empty lane silently asserts "nothing happened". For External flux
      // that's wrong: the SERP adapters are manual, so no pips usually means
      // no data source at all. Label it rather than implying calm.
      const noData=(tr.key==="external"&&!DATA.serp_connected);
      h+=`<div class="track${noData?" nodata":""}"><div class="name"><div class="t">${tr.t}</div><div class="d">${tr.d}</div></div><div class="lane">`;
      if(noData){
        h+=`<div class="nd">未接入 / no volatility source connected — add readings with <code>main.py serp-add</code></div>`;
      }
      mine.forEach(e=>{
        const left=Math.min(99,Math.max(1,pos(e.date)));
        h+=`<div class="ev" style="left:${left}%">
          <div class="pip" style="background:${heatColor(e.band)}"></div>
          <div class="tip">${esc(e.label)}<div class="td">${esc(e.date)} · ${esc(e.detail||e.band)}</div></div>
        </div>`;
      });
      h+=`</div></div>`;
    });
    h+=`<div class="axis"><div></div><div class="ticks">
      <span>${start.toISOString().slice(0,10)}</span><span>${now.toISOString().slice(0,10)}</span></div></div>`;
  }
  el.innerHTML=h;
  el.querySelectorAll(".map-controls button").forEach(b=>{
    b.onclick=()=>{mapRange=b.dataset.r;renderMap();};
  });
}

/* ---------------- Source Library ---------------- */
let libState={q:"",section:"",confidence:"",impact:"",vertical:""};
function renderLibrary(){
  const el=document.getElementById("view-library");
  const secs=[...new Set(DATA.library.map(s=>s.section))];
  const confs=["Confirmed","Data-backed","Observed","Speculative"];
  const imps=["P0","P1","P2","P3"];
  const opt=(v,cur)=>`<option value="${esc(v)}"${v===cur?" selected":""}>${esc(v||"")}</option>`;
  let h=`<div class="lib-filters">
    <input id="lq" placeholder="Search signals…" value="${esc(libState.q)}">
    <select id="lsec"><option value="">All sections</option>${secs.map(s=>opt(s,libState.section)).join("")}</select>
    <select id="lconf"><option value="">Any confidence</option>${confs.map(c=>opt(c,libState.confidence)).join("")}</select>
    <select id="limp"><option value="">Any priority</option>${imps.map(i=>opt(i,libState.impact)).join("")}</select>
    <select id="lvert"><option value="">Any vertical</option>${(DATA.verticals||[]).map(v=>opt(v,libState.vertical)).join("")}</select>
  </div><div id="lib-results"></div>`;
  el.innerHTML=h;
  const bind=(id,key)=>{const n=document.getElementById(id);
    n.oninput=n.onchange=()=>{libState[key]=n.value;drawLibResults();};};
  bind("lq","q");bind("lsec","section");bind("lconf","confidence");bind("limp","impact");bind("lvert","vertical");
  drawLibResults();
}
function drawLibResults(){
  const q=libState.q.toLowerCase();
  let rows=DATA.library.filter(s=>{
    if(libState.section&&s.section!==libState.section)return false;
    if(libState.confidence&&s.confidence!==libState.confidence)return false;
    if(libState.impact&&s.impact!==libState.impact)return false;
    if(libState.vertical&&!(s.who_it_affects||"").toLowerCase().includes(libState.vertical.toLowerCase()))return false;
    if(q){
      // Search the expanded detail and the verbatim excerpts too. This is what
      // makes the Library a real archive: months later you remember a phrase
      // from a study, not the headline we wrote about it.
      const hay=(s.what_happened+" "+s.why_it_matters+" "+s.evidence+" "+s.what_to_do
        +" "+(s.evidence_detail||"")
        +" "+(s.sources||[]).map(x=>(x.excerpt||"")+" "+(x.author||"")).join(" ")).toLowerCase();
      if(!hay.includes(q))return false;
    }
    return true;
  }).sort((a,b)=>b.date.localeCompare(a.date));
  let h=`<div class="lib-count">${rows.length} signal${rows.length===1?"":"s"}</div>`;
  if(!rows.length){h+=`<div class="lib-empty">No matching signals.</div>`;}
  rows.slice(0,400).forEach(s=>{
    const srcs=(s.sources||[]).map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name||"source")} ↗</a>`).join(" ");
    h+=`<div class="lib-row">
      <div class="ld">${esc(s.date)}</div>
      <div><div class="lw">${esc(s.what_happened)} <span class="badges">${tag(s.impact)}${confTag(s.confidence)}${unverTag(s)}</span></div>
        <div class="lmeta"><span>${esc(s.section)}</span>${s.who_it_affects?`<span>· ${esc(s.who_it_affects)}</span>`:""}${srcs?`<span>· ${srcs}</span>`:""}</div>
        ${evidencePanel(s)}
      </div></div>`;
  });
  document.getElementById("lib-results").innerHTML=h;
}

renderToday();renderMap();renderLibrary();
</script>
