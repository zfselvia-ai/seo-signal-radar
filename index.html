<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEO Signal Radar</title>
<style>
  :root{
    color-scheme: light;
    --bg:#f5f6f8; --surface:#ffffff; --surface-strong:#f1f2f5;
    --line:#e3e4e8; --line-strong:#d2d4db;
    --ink:#0d0d10; --ink-2:#3e3f45; --ink-3:#7a7b85;
    --accent:#3451b2;
    --p0:#b22222; --p0-bg:#fef2f2; --p0-accent:#dc2626;
    --p1:#c45f0a; --p1-bg:#fff7ed; --p1-accent:#ea580c;
    --p2:#7c6a16; --p2-bg:#fffbeb; --p2-accent:#ca8a04;
    --p3:#4b5563; --p3-bg:#f8fafc; --p3-accent:#64748b;
    --heat-extreme:#b22222; --heat-high:#d97706; --heat-elevated:#ca8a04;
    --heat-normal:#16a34a; --heat-unknown:#9ca3af;
    --action-bg:#eff6ff; --action-accent:#2563eb;
    --radius:10px;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
    --shadow-raised:0 4px 12px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.04);
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);
    font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;}
  a{color:var(--accent);text-decoration:none;}
  a:hover{text-decoration:underline;}

  /* ---- header ---- */
  header{background:var(--surface);border-bottom:1px solid var(--line);
    padding:0;position:sticky;top:0;z-index:10;
    box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .brandbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:16px 28px 0;background:var(--surface);}
  .logo{font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:-.02em;
    display:flex;align-items:center;gap:8px;}
  .logo .dot{color:var(--accent);}
  .thesis{color:var(--ink-2);font-size:13px;}
  .thesis .zh{color:var(--ink-3);margin-left:8px;}
  nav{display:flex;gap:0;margin:0;padding:0 28px;background:var(--surface);}
  nav button{font-family:var(--ui);font-size:13px;font-weight:600;color:var(--ink-3);
    background:none;border:none;border-bottom:2px solid transparent;
    padding:14px 18px 12px;cursor:pointer;transition:color .12s;}
  nav button:hover{color:var(--ink-2);}
  nav button.active{color:var(--accent);border-bottom-color:var(--accent);}

  main{max-width:960px;margin:0 auto;padding:28px;}
  .view{display:none;}
  .view.active{display:block;}

  /* ---- morning brief ----
     One dominant stat (top priority) + quiet supporting stats. */
  .brief{display:flex;flex-wrap:wrap;gap:0;align-items:stretch;
    padding:0;border-radius:var(--radius);background:var(--surface);
    margin-bottom:28px;box-shadow:var(--shadow);overflow:hidden;
    border:1px solid var(--line);}
  .brief .stat{display:flex;flex-direction:column;gap:3px;padding:14px 20px;
    border-right:1px solid var(--line);min-width:108px;justify-content:center;}
  .brief .stat:last-child{border-right:none;}
  .brief .k{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);
    text-transform:uppercase;letter-spacing:.07em;}
  .brief .v{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--ink-2);}
  /* the lead stat carries the day's urgency — the one place color shouts */
  .brief .stat.lead{background:var(--surface-strong);min-width:132px;}
  .brief .stat.lead .v{font-size:24px;font-weight:700;color:var(--ink);letter-spacing:-.02em;}
  .brief .stat.lead.urgent{background:var(--p0-bg);}
  .brief .stat.lead.urgent .v{color:var(--p0-accent);}
  .brief .stat.lead.urgent .k{color:var(--p0);}
  .brief .v .dot-heat{width:9px;height:9px;border-radius:50%;display:inline-block;
    margin-right:6px;vertical-align:middle;}

  .date-label{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-bottom:8px;}

  /* ---- source health strip ----
     Quiet by default; only speaks up when coverage is degraded, because "27/29
     sources" is reassurance, not news. Amber/red means today's digest is
     thinner than reality. */
  .health{display:flex;flex-wrap:wrap;gap:14px;align-items:center;
    font-family:var(--mono);font-size:11px;color:var(--ink-3);
    margin:-18px 0 24px;padding:8px 12px;background:var(--surface);
    border:1px solid var(--line);border-radius:8px;}
  .health.warn{background:var(--p1-bg);border-color:rgba(234,88,12,.28);color:var(--p1);}
  .health.down{background:var(--p0-bg);border-color:rgba(220,38,38,.3);color:var(--p0);
    font-weight:700;}
  .health .hitem{display:inline-flex;align-items:center;gap:6px;}
  .health .hdot{width:7px;height:7px;border-radius:50%;background:var(--heat-normal);}
  .health.warn .hdot{background:var(--heat-high);}
  .health.down .hdot{background:var(--heat-extreme);}
  .health .hnote{color:inherit;opacity:.85;}

  /* Track with no data at all: say so, don't imply calm. */
  .track.nodata .lane{background-image:none;background:var(--surface-strong);}
  .track.nodata .lane .nd{position:absolute;top:50%;left:16px;transform:translateY(-50%);
    font-family:var(--mono);font-size:11px;color:var(--ink-3);}
  .headline{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.3;
    margin:0 0 24px;color:var(--ink);max-width:44em;}

  /* ---- cards ----
     Hierarchy by weight, not by wall-to-wall colour:
       P0 = tinted + strong bar   (stop and read)
       P1 = white + accent bar    (act this week)
       P2 = white + amber bar     (worth testing — real work, gets a full card)
       P3 = compact single row    (awareness only)  */
  .card{border-radius:var(--radius);padding:16px 20px;margin-bottom:10px;
    background:var(--surface);box-shadow:var(--shadow);
    border:1px solid var(--line);position:relative;overflow:hidden;
    transition:box-shadow .15s,transform .1s;}
  .card:hover{box-shadow:var(--shadow-raised);transform:translateY(-1px);}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--line-strong);}

  .card.P0{background:var(--p0-bg);border-color:rgba(220,38,38,.22);}
  .card.P0::before{background:var(--p0-accent);width:4px;}
  .card.P1::before{background:var(--p1-accent);}
  .card.P2::before{background:var(--p2-accent);}
  .card.P3::before{background:var(--line-strong);}

  /* Playbook rows: the test recipe, visually distinct from news fields
     without adding another colour to the page. */
  .card .row.test .lab{color:var(--p2);}
  .card .testbox{margin-top:11px;padding:11px 13px;background:var(--surface-strong);
    border-radius:8px;border-left:2px solid var(--p2-accent);}
  .card .testbox .row{margin:3px 0;}
  .card .testbox .row:first-child{margin-top:0;}

  .card .what{font-weight:650;font-size:15.5px;line-height:1.45;margin-bottom:10px;
    display:flex;gap:10px;align-items:flex-start;justify-content:space-between;}
  .card .what .wtext{flex:1;min-width:0;}
  .card .row{display:flex;gap:10px;font-size:13px;color:var(--ink-2);margin:5px 0;}
  .card .row .lab{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);
    min-width:74px;text-transform:uppercase;letter-spacing:.05em;padding-top:3px;
    flex-shrink:0;}
  .card .srcs{margin-top:11px;padding-top:10px;border-top:1px solid var(--line);
    display:flex;flex-wrap:wrap;gap:12px;}
  .card .srcs a{font-family:var(--mono);font-size:11.5px;}

  /* ---- evidence expansion ----
     A <details> element, not a JS toggle: keyboard-accessible, works without
     script, and browsers handle the open/close state for free. Closed by
     default so scanning the day is unaffected — the whole point of the digest
     is density, and detail is opt-in. */
  .card .eviexp{margin-top:9px;}
  .lib-row .eviexp{margin-top:7px;}
  .eviexp>summary{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);
    cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:5px;
    padding:3px 8px;border:1px solid var(--line);border-radius:5px;
    text-transform:uppercase;letter-spacing:.05em;transition:all .12s;
    user-select:none;}
  .eviexp>summary::-webkit-details-marker{display:none;}
  .eviexp>summary:hover{border-color:var(--line-strong);color:var(--ink-2);}
  .eviexp>summary::before{content:"▸";font-size:9px;transition:transform .12s;}
  .eviexp[open]>summary::before{transform:rotate(90deg);}
  .eviexp[open]>summary{color:var(--ink-2);background:var(--surface-strong);}
  .evibody{margin-top:10px;padding:12px 14px;background:var(--surface-strong);
    border-radius:8px;border-left:2px solid var(--line-strong);}
  .evibody .edetail{font-size:13px;color:var(--ink-2);line-height:1.6;
    margin-bottom:12px;}
  /* Verbatim source text. Quoted and monospaced so it reads unmistakably as
     "their words", never as our summary. */
  .quote{margin:9px 0 0;padding-left:11px;border-left:2px solid var(--line-strong);}
  .quote .qhead{font-family:var(--mono);font-size:10px;color:var(--ink-3);
    display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:4px;}
  .quote .qtier{background:var(--surface);border:1px solid var(--line);
    border-radius:4px;padding:0 5px;}
  .quote .qci{color:var(--p1);background:var(--p1-bg);
    border:1px solid rgba(234,88,12,.25);border-radius:4px;padding:0 5px;}
  .quote .qtext{font-size:12.5px;color:var(--ink-2);line-height:1.6;
    white-space:pre-wrap;overflow-wrap:anywhere;}
  .quote .qlink{font-family:var(--mono);font-size:11px;}

  /* compact row for low-priority signals */
  .mini{display:flex;gap:12px;align-items:baseline;padding:10px 14px;
    background:var(--surface);border:1px solid var(--line);border-radius:8px;
    margin-bottom:6px;font-size:13.5px;transition:border-color .12s;}
  .mini:hover{border-color:var(--line-strong);}
  .mini .mtext{flex:1;min-width:0;color:var(--ink-2);}
  .mini .mtext b{font-weight:600;color:var(--ink);}
  .mini .msrc{font-family:var(--mono);font-size:11px;flex-shrink:0;}

  .badges{display:inline-flex;gap:5px;flex-shrink:0;}
  .tag{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:2px 7px;
    border-radius:4px;letter-spacing:.02em;white-space:nowrap;}
  /* only P0 is loud; the rest are legible but quiet */
  .tag.P0{color:#fff;background:var(--p0-accent);border:1px solid var(--p0-accent);}
  .tag.P1{color:var(--p1);background:rgba(234,88,12,.09);border:1px solid rgba(234,88,12,.22);}
  .tag.P2{color:var(--p2);background:rgba(202,138,4,.09);border:1px solid rgba(202,138,4,.22);}
  .tag.P3{color:var(--ink-3);background:var(--surface-strong);border:1px solid var(--line);}
  .tag.conf{color:var(--ink-3);background:transparent;border:1px solid var(--line-strong);font-weight:600;}
  /* Set when every citation the model produced failed URL verification. The
     claim may still be real, but the reader must know we could not link it. */
  .tag.unver{color:var(--p0);background:var(--p0-bg);border:1px solid rgba(220,38,38,.28);}

  /* ---- sections ---- */
  h2.section{font-size:10.5px;font-weight:700;text-transform:uppercase;
    letter-spacing:.09em;color:var(--ink-3);margin:34px 0 12px;
    display:flex;align-items:center;gap:9px;}
  h2.section::after{content:"";flex:1;height:1px;background:var(--line);}
  h2.section .count{font-family:var(--mono);color:var(--ink-3);font-weight:500;
    font-size:10.5px;}

  /* ---- action items — the one deliberately blue block ---- */
  .actions-card{background:var(--action-bg);border:1px solid rgba(37,99,235,.18);
    border-left:3px solid var(--action-accent);
    border-radius:var(--radius);padding:18px 20px;margin:0 0 24px;}
  .actions-card h2{margin:0 0 12px;font-size:10.5px;font-weight:700;
    color:var(--action-accent);text-transform:uppercase;letter-spacing:.09em;}
  .actions-card ul{margin:0;padding-left:0;list-style:none;}
  .actions-card li{margin:7px 0;font-size:13.5px;color:var(--ink-2);
    display:flex;gap:9px;align-items:baseline;}
  .actions-card li .tag{flex-shrink:0;}

  /* ---- SERP weather ---- */
  .serp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
    gap:10px;margin-bottom:12px;}
  .serp-cell{border-radius:8px;padding:14px 16px;background:var(--surface);
    border:1px solid var(--line);border-top:2px solid var(--heat-unknown);}
  .serp-cell.Extreme{border-top-color:var(--heat-extreme);}
  .serp-cell.High{border-top-color:var(--heat-high);}
  .serp-cell.Elevated{border-top-color:var(--heat-elevated);}
  .serp-cell.Normal{border-top-color:var(--heat-normal);}
  .serp-cell .k{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);
    text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;}
  .serp-cell .v{font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px;}
  .serp-cell .v .dot-heat{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .serp-note{background:var(--surface-strong);border-radius:8px;padding:13px 16px;
    font-size:12.5px;color:var(--ink-2);margin:0 0 26px;
    border-left:2px solid var(--line-strong);}

  /* ---- algorithm map ---- */
  .map-controls{display:flex;gap:6px;margin-bottom:20px;}
  .map-controls button{font-family:var(--mono);font-size:12px;border:1px solid var(--line-strong);
    background:var(--surface);color:var(--ink-2);padding:5px 14px;border-radius:6px;cursor:pointer;
    transition:all .12s;}
  .map-controls button:hover{border-color:var(--ink-3);}
  .map-controls button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .track{display:grid;grid-template-columns:142px 1fr;border-top:1px solid var(--line);
    min-height:84px;background:var(--surface);}
  .track:last-child{border-bottom:1px solid var(--line);}
  .track .name{padding:18px 16px;border-right:1px solid var(--line);background:var(--surface-strong);}
  .track .name .t{font-weight:650;font-size:13px;}
  .track .name .d{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);
    text-transform:uppercase;letter-spacing:.05em;margin-top:3px;}
  .lane{position:relative;padding:16px 0;
    background-image:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px 25%);
    background-position:0 0;background-size:100% 100%;}
  .lane .ev{position:absolute;top:22px;transform:translateX(-50%);cursor:default;}
  .lane .ev .pip{width:13px;height:13px;border-radius:50%;border:2.5px solid #fff;
    box-shadow:0 0 0 1.5px var(--line-strong),0 2px 5px rgba(0,0,0,.1);
    transition:transform .12s;}
  .lane .ev:hover .pip{transform:scale(1.25);}
  .lane .ev .tip{position:absolute;left:50%;transform:translateX(-50%);
    bottom:26px;background:var(--ink);color:#fff;font-size:12px;line-height:1.5;
    padding:10px 12px;border-radius:8px;width:240px;display:none;z-index:5;
    box-shadow:0 8px 24px rgba(0,0,0,.2);}
  .lane .ev:hover .tip{display:block;}
  .lane .ev .tip .td{font-family:var(--mono);font-size:10px;color:#c9c9d4;margin-top:6px;}
  .axis{display:grid;grid-template-columns:142px 1fr;border-top:1px solid var(--line);}
  .axis .ticks{display:flex;justify-content:space-between;padding:8px 10px;
    font-family:var(--mono);font-size:10px;color:var(--ink-3);}
  .map-empty,.lib-empty{color:var(--ink-3);font-size:13px;padding:32px 0;text-align:center;}
  .legend{display:flex;gap:16px;margin:16px 0 4px;font-size:12px;color:var(--ink-2);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}

  /* ---- library ---- */
  .lib-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .lib-filters input,.lib-filters select{font-family:var(--ui);font-size:13px;
    border:1px solid var(--line-strong);border-radius:6px;padding:7px 11px;background:var(--surface);}
  .lib-filters input:focus,.lib-filters select:focus{outline:none;border-color:var(--accent);}
  .lib-filters input{flex:1;min-width:200px;}
  .lib-row{display:grid;grid-template-columns:84px 1fr;gap:14px;
    padding:12px 14px;background:var(--surface);margin-bottom:4px;border-radius:8px;
    border:1px solid var(--line);transition:border-color .12s;}
  .lib-row:hover{border-color:var(--line-strong);}
  .lib-row .ld{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);}
  .lib-row .lw{font-weight:600;font-size:13.5px;}
  .lib-row .lmeta{font-size:11.5px;color:var(--ink-3);margin-top:5px;
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .lib-count{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-bottom:12px;}

  footer{max-width:960px;margin:0 auto;padding:20px 28px 40px;color:var(--ink-3);
    font-size:11.5px;font-family:var(--mono);border-top:1px solid var(--line);}
  @media(max-width:640px){
    .track,.axis{grid-template-columns:84px 1fr;}
    main{padding:18px;}
    .brief{flex-wrap:wrap;}
    .brief .stat{padding:11px 14px;min-width:auto;flex:1 0 44%;}
    .brief .stat.lead{flex-basis:100%;}
    .brief .v{font-size:15px;}
    .headline{font-size:21px;}
    .card .what{flex-direction:column;gap:8px;}
    .mini{flex-wrap:wrap;gap:8px;}
    .card .row{flex-direction:column;gap:1px;}
    .card .row .lab{min-width:auto;}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>

<header>
  <div class="brandbar">
    <span class="logo">SEO Signal Radar<span class="dot">.</span></span>
    <span class="thesis" id="thesis"></span>
  </div>
  <nav>
    <button data-view="today" class="active">Today</button>
    <button data-view="map">Algorithm Map</button>
    <button data-view="library">Source Library</button>
    <div class="range-group" style="margin-left:auto;display:flex;align-items:center;gap:6px;">
      <button class="range-btn active" data-range="1" style="font-family:var(--mono);font-size:11px;
        border:1.5px solid var(--line-strong);border-radius:8px;padding:5px 10px;cursor:pointer;
        background:var(--surface);color:var(--ink);outline:none;transition:all .15s;">1D</button>
      <button class="range-btn" data-range="3" style="font-family:var(--mono);font-size:11px;
        border:1.5px solid var(--line-strong);border-radius:8px;padding:5px 10px;cursor:pointer;
        background:var(--surface);color:var(--ink);outline:none;transition:all .15s;">3D</button>
      <button class="range-btn" data-range="7" style="font-family:var(--mono);font-size:11px;
        border:1.5px solid var(--line-strong);border-radius:8px;padding:5px 10px;cursor:pointer;
        background:var(--surface);color:var(--ink);outline:none;transition:all .15s;">7D</button>
      <select id="date-picker" style="font-family:var(--mono);font-size:12px;
        border:1.5px solid var(--line-strong);border-radius:8px;padding:6px 10px;
        background:var(--surface);color:var(--ink);cursor:pointer;outline:none;"></select>
    </div>
  </nav>
</header>

<main>
  <section id="view-today" class="view active"></section>
  <section id="view-map" class="view"></section>
  <section id="view-library" class="view"></section>

面，Google 将无法识别新日期，导致页面按旧日期被移出索引。", "evidence": "expert_analysis", "evidence_detail": "Highlighted in Aleyda Solis's SEOFOMO digest, the technical limitation of the `unavailable_after` tag is that Google cannot process an updated expiration date if it does not recrawl the page before the original expiration date passes.", "who_it_affects": "publisher / ecommerce / all", "what_to_do": "在更新 `unavailable_after` 日期后，必须通过 GSC 提交手动抓取请求，或通过 API/XML 网站地图强力引导 Googlebot 重新抓取该页面。", "confidence": "Observed", "impact": "P2", "section": "Technical SEO Experiments", "score": 74, "sources": [{"name": "aleyda", "url": "https://x.com/aleyda/status/2083971896128012464", "excerpt": "🏖️ The Latest in SEO & AI Search News, Updates & Guides [From today's #SEOFOMO - August 2nd, 2026] 👇 * ​Google rolls out platform properties globally, plus a new social and video performance guide: It's time to optimize all your brand presence consistently across the web * Google Review Snippets Prohibit Fake or Undisclosed Incentivized Reviews: Incentivized reviews must be disclosed and fake shouldn't be featured * ​The Problem With unavailable_after - Google Might Not See Updated Dates: Google can’t process an updated expiry date if it doesn’t recrawl the page * ​What 13 Billion Google Searches Reveal About Zero-Click Behavior: Learn which destinations win clicks, and which ones Google…", "author": "@aleyda", "published": "2026-08-02T17:43:13+00:00", "source_type": "expert_analysis"}]}], "AI Search / GEO": [{"what_happened": "Study: AI Search citations are 70-80% third-party domains across SaaS, finance, and ecommerce | 研究：SaaS、金融和电商领域的 AI 搜索引用中，70-80% 均来自第三方域名", "why_it_matters": "证实了 AI 搜索（如 Google AI Mode, Gemini, ChatGPT）主要是一个第三方引用（Digital PR 与社交媒体）的问题，品牌官网仅占少数。不同行业和平台的引用来源偏好差异显著（如 SaaS 偏向社交，金融偏向媒体/对比，AI Mode 最偏向社交）。", "evidence": "data_research", "evidence_detail": "Aleyda Solis analyzed Semrush Enterprise data for the top 10 cited source domains of 15 leading brands across SaaS, ecommerce, and finance. The study found external domain citation shares of 82.3% for SaaS, 79.4% for finance, and 69.6% for ecommerce. It also noted that Google's AI Mode is highly social-led, while ChatGPT is more evaluative/written, and Gemini is mixed.", "who_it_affects": "SaaS / ecommerce / publisher / all", "what_to_do": "针对目标 AI 平台和行业属性，协同 Digital PR、社交媒体与 On-page SEO，在第三方高权重引用源（如 Reddit、行业媒体、对比网站）中建立品牌提及与协同验证。", "confidence": "Data-backed", "impact": "P1", "section": "AI Search / GEO", "score": 85, "sources": [{"name": "aleyda", "url": "https://x.com/aleyda/status/2083901187447828484", "excerpt": "📊 AI Search Is a 3rd-Party Citation Problem With an On-Page Corroboration Base: The Data Across SaaS, Ecommerce and Finance 👇 But is this true across different verticals and AI platforms? How much weight should we give to digital PR vs social? To assess it, I analyzed the top 10 cited source domains for 15 leading brands across SaaS, ecommerce and finance in Google AI Mode, Gemini and ChatGPT, using @semrush Enterprise data: 1. AI search is primarily a 3rd-party citation problem The most consistent finding is that the brand's own website is a minority of the top cited source mix in every vertical. SaaS had the highest external share at 82.3%, followed by finance at 79.4% and ecommerce at…", "author": "@aleyda", "published": "2026-08-02T13:02:14+00:00", "source_type": "expert_analysis"}]}, {"what_happened": "Google surfaces \"Top Stories\" and \"Preferred Sources\" in AI Overviews | Google 在 AI Overviews 中展示“焦点新闻”与“首选来源”", "why_it_matters": "针对新闻和实时性查询，Google 正在 AI Overviews (AIO) 中更频繁地嵌入 Top Stories 模块，并突出显示“首选来源”（Preferred Sources）。这为新闻出版商在 AI 搜索时代保留流量提供了关键入口。", "evidence": "practitioner_observation", "evidence_detail": "SEO consultant Glenn Gabe observed the integration of Top Stories modules and 'Preferred Sources' within AI Overviews for news-related queries, advising publishers to actively monitor these placements.", "who_it_affects": "publisher", "what_to_do": "针对高流量的新闻和时效性关键词，监控 ember, Google pushes many other changes all the time, including what they call \"smaller core updates\" which is when they update a system, or several, outside of a core update. So for the August spam update, what you saw recently was not the spam update.. Lots of confusion about this. Google has said many times that what you saw BEFORE the update rolls out was NOT the update... Remember, Google pushes many other changes all the time, including what they call \"smaller core updates\" which is when they update a system, or several, outside of a core update. So for the…", "author": "@glenngabe", "published": "2026-08-19T12:06:45+00:00", "source_type": "data_research"}]}], "SERP & Algorithm Signals": [{"what_happened": "Google expands generative UI from AI Mode to AI Overviews | Google将生成式UI从AI Mode扩展至AI Overviews", "why_it_matters": "AI Overviews的视觉呈现正在从纯文本摘要转向交互式工具布局，影响传统搜索结果页的流量分配和点击率优化空间。", "evidence": "Search Engine Journal reports generative UI, which builds custom visual layouts and interactive tools, has started reaching AI Overviews after launching in AI Mode last year.", "evidence_detail": "Google's generative UI creates custom visual layouts and interactive tools rather than standard text snippets. The feature launched in AI Mode (the conversational search interface) and is now expanding to AI Overviews (the standard search result summaries). This represents a shift from text-based answers to richer, more interactive formats. No traffic impact data is yet available. The expansion appears gradual rather than universal.", "who_it_affects": "all", "what_to_do": "监控AI Overviews中你的品牌查询是否出现交互式元素；评估现有结构化数据是否支持富媒体展示", "confidence": "Confirmed", "impact": "P2", "section": "SERP & Algorithm Signals", "score": 72, "sources": [{"name": "Search Engine Journal", "url": "https://www.searchenginejournal.com/google-expands-generative-ui-beyond-ai-mode-into-ai-overviews/586452/", "excerpt": "Google Expands Generative UI Beyond AI Mode Into AI Overviews via @sejournal, @MattGSouthern. Google's generative UI, which builds custom visual layouts and interactive tools, has started reaching AI Overviews after launching in AI Mode last year. The post Google Expands Generative UI Beyond AI Mode Into AI Overviews appeared first on Search Engine Journal .", "author": "Search Engine Journal", "published": "2026-08-19T19:00:27+00:00", "source_type": "trade_news"}]}, {"what_happened": "Microsoft Advertising rolls out AI Max globally | Microsoft Advertising全球推出AI Max功能", "why_it_matters": "AI驱动的广告自动化进一步扩展，搜索广告竞争格局持续演变，需关注竞价策略调整。", "evidence": "Search Engine Journal reports Microsoft Advertising rolling out AI Max globally with expanded Search matching, text customization, URL expansion and new advertiser controls.", "evidence_detail": "Microsoft Advertising's AI Max, previously in limited testing, is now globally available. Features include: expanded Search matching (broader query coverage), text customization (AI-generated ad copy variations), URL expansion (dynamic landing pages), and new advertiser controls for brand safety and placement exclusions. This represents Microsoft's counter to Google's AI-powered campaign features. Impact on CPCs and competitive dynamics in Bing Ads ecosystem is yet unmeasured.", "who_it_affects": "ecommerce / SaaS", "what_to_do": "评估AI Max功能是否适合你的Bing Ads账户；测试自动文本生成与人工文案的CTR对比", "confidence": "Confirmed", "impact": "P2", "section": "SERP & Algorithm Signals", "score": 65, "sources": [{"name": "Search Engine Journal", "url": "https://www.searchenginejournal.com/microsoft-advertising-rolls-out-ai-max-globally/586459/", "excerpt": "Microsoft Advertising Rolls Out AI Max Globally via @sejournal, @brookeosmundson. Microsoft Advertising is rolling out AI Max globally, bringing expanded Search matching, text customization, URL expansion and new advertiser controls to Search campaigns. The post Microsoft Advertising Rolls Out AI Max Globally appeared first on Search Engine Journal .", "author": "Search Engine Journal", "published": "2026-08-19T19:41:53+00:00", "source_type": "trade_news"}]}], "AI Search / GEO": [{"what_happened": "ChatGPT Search massively adopted site: operator fan-outs on Aug 8; Reddit citations fell 86% | ChatGPT搜索8月8日起大规模使用site:限定查询，Reddit引用量暴跌86%", "why_it_matters": "OpenAI正在用'官方域名优先'的粗暴信任过滤替代开放网页检索，非官方站点在ChatGPT Search中的可见性急剧下降，GEO策略需重新校准。", "evidence": "Promptwatch data: site: searches jumped from 0.4% to ~17% of background queries on Aug 8; Reddit citations fell from 3.83% to 0.52% between Aug 14-17 per Search Engine Land/SEJ reporting on Promptwatch and Suganthan analysis.", "evidence_detail": "Promptwatch tracked the site: operator spike in real-time. The 0.4%→17% jump occurred in a single day (August 8). Reddit's citation share inside ChatGPT Search dropped from 3.83% to 0.52% between August 14-17 — an 86% decline. Multiple independent observers (Lily Ray, Suganthan, Search Engine Land) confirmed the correlation. The mechanism appears to be: ChatGPT first generates a search naming brands, then runs site: lookups on each brand's own domain for pricing/specs. This privileges .gov, .org, and established brand domains while excluding forums and lesser-known publishers. Caveat: the 'official domain' guess is sometimes wrong, hitting parked sites.", "who_it_affects": "publisher / ecommerce / SaaS", "what_to_do": "测试你的品牌是否出现在ChatGPT的品类查询中；确保官网在site:查询下能直接提供价格、规格等关键信息；监控第三方评测和媒体报道中的品牌提及", "confidence": "Data-backed", "impact": "P1", "section": "AI Search / GEO", "score": 85, "how_to_test": "Ask your core category question 5 times in ChatGPT Search, note which brands appear; then run site:yourdomain.com for key product pages and check if pricing/specs render in plain HTML without JS dependency", "success_metric": "Brand mention rate in ChatGPT Search responses for target category queries; site:yourdomain.com crawl success rate for key pages", "effort": "Medium effort (2-4 hours audit); low risk", "sources": [{"name": "Lily Ray / Promptwatch / Suganthan", "url": "https://x.com/lilyraynyc/status/2090193398766739641", "excerpt": "RT by @lilyraynyc: ChatGPT Search changed how it looks things up on 8 August. It started using site: at scale. Promptwatch saw those domain-scoped searches jump from about 0.4% of background queries to about 17% in a day. Same week, the queries started saying “official” more often. @suganthan has been reading the traffic: one search that already names the brands, then a site: look-up on each brand’s own website for pricing and specs. Reddit’s share of citations inside ChatGPT Search then fell from 3.83% to 0.52% between 14 and 17 August. The first slip was 8 August, the same day as the site: change. Google’s AI Overviews and AI Mode did not do this. So this is not “Reddit stopped working.”…", "author": "@lilyraynyc", "published": "2026-08-19T21:45:14+00:00", "source_type": "expert_analysis"}, {"name": "Search Engine Journal", "url": "https://www.searchenginejournal.com/why-reddits-chatgpt-citation-drop-isnt-fully-explained/586479/", "excerpt": "Why Reddit’s ChatGPT Citation Drop Isn’t Fully Explained via @sejournal, @MattGSouthern. New Promptwatch data shows a sharp drop in Reddit's ChatGPT Search citations this month. The post Why Reddit&#8217;s ChatGPT Citation Drop Isn&#8217;t Fully Explained appeared first on Search Engine Journal .", "author": "Search Engine Journal", "published": "2026-08-19T22:03:26+00:00", "source_type": "trade_news"}]}, {"what_happened": "ChatGPT 5.6 reduces fan-out queries and citations for listicles, comparisons | ChatGPT 5.6减少列表、对比类内容的fan-out查询和引用", "why_it_matters": "GEO优化的列表和对比内容可能正被OpenAI降权，需重新评估内容格式策略。", "evidence": "Peec AI data shared by Lily Ray: ChatGPT 5.6 reducing fan-out queries and citations for listicles and comparison content.", "evidence_detail": "Tomek Rudzki from Peec AI shared data with Lily Ray indicating ChatGPT 5.6 has reduced fan-out queries and citations specifically for listicles and comparison-type content. This follows the broader pattern of OpenAI reducing reliance on forum/reddit content and affiliate-style comparison pages. The data source (Peec AI) is a specialized monitoring tool, but specific methodology and sample size were not detailed in the social post. Treat as directional signal requiring independent verification.", "who_it_affects": "publisher / ecommerce / SaaS", "what_to_do": "监控你的列表/对比内容在ChatGPT中的引用情况；测试深度单主题内容替代列表格式的表现", "confidence": "Observed", "impact": "P2", "section": "AI Search / GEO", "score": 70, "sources": [{"name": "Lily Ray / Peec AI", "url": "https://x.com/lilyraynyc/status/2090256147441746150", "excerpt": "New Peec AI data from suggests ChatGPT 5.6 is reducing fan-out queries and citations for listicles, comparisons. Are they cracking down on GEO-focused articles? @tomekrudzki @peecAI. New Peec AI data from suggests ChatGPT 5.6 is reducing fan-out queries and citations for listicles, comparisons. Are they cracking down on GEO-focused articles? @tomekrudzki @peecAI Article ChatGPT is Changing Which Page Types it Cites in AI Responses (New Peec AI Data) Wow, I found this VERY interesting: Tomek Rudzki from Peec AI just shared some brand new data with me regarding ChatGPT&apos;s evolving search behavior with the launch of 5.6. Earlier this week, I", "author": "@lilyraynyc", "published": "2026-08-20T01:54:35+00:00", "source_type": "expert_analysis"}]}], "Research & Retrieval": [{"what_happened": "Study: Gemini cites same sources only 40% of the time for identical queries | 研究：Gemini对相同查询的引用一致性仅40%", "why_it_matters": "AI搜索引用具有高度不确定性，品牌无法依赖单一优化点；需建立多触点的AI可见性策略。", "evidence": "TheSocialDude study of 14,472 AI citations across 1,487 local search queries; Gemini source match rate ~40% for identical questions.", "evidence_detail": "Ben Fisher (TheSocialDude) analyzed 14,472 AI citations across 1,487 local search queries. Key finding: when asked the same question, Gemini's cited sources matched only 40% of the time — indicating high variability in AI search citations. Second finding: a business' idence_detail": "US District Judge Paul A. Engelmayer ruled that Reddit plausibly pleaded a conspiracy where SerpApi provided a product to circumvent Google's access controls and Perplexity AI paid for it. This decision allows the DMCA copyright violation lawsuit to proceed to the next stage, despite Google recently losing a separate DMCA case against SerpApi."}, {"date": "2026-08-02", "section": "SERP & Algorithm Signals", "what_happened": "Reddit tests text-to-speech and video formats for viral text posts | Reddit 测试文本转语音与视频格式，将热门贴文转化为“播客”", "why_it_matters": "Reddit 正在将平台上的高价值文本内容转化为音视频流，以迎合 TikTok 等平台的用户习惯。这可能会改变 Google 在视频/音频搜索结果中对 Reddit 内容的索引和呈现方式。", "evidence": "Reddit CEO Steve Huffman's statements during an earnings call regarding new content formats.", "who_it_affects": "publisher / UGC / international", "what_to_do": "monitor Z", "confidence": "Confirmed", "impact": "P2", "sources": [{"name": "glenngabe", "url": "https://x.com/glenngabe/status/2083533847573000650", "excerpt": "New format for Reddit coming -> Reddit is testing a new way to watch — and listen to — its viral posts “There is an emerging content type elsewhere on the internet of, basically, podcasts where people read Reddit content,” Huffman explained on the call.\" \"He’s right — on TikTok, for instance, there are 19.6 million posts labeled with the hashtag #reddit and another 9.9 million labeled #redditstories. Many of these feature a text-to-speech narration of a viral story published on Reddit paired with an unrelated video, like gameplay footage or cooking content.\" https://techcrunch.com/2026/07/31/reddit-is-testing-a-new-way-to-watch-and-listen-to-its-viral-posts/. New format for Reddit coming…", "author": "@glenngabe", "published": "2026-08-01T12:42:34+00:00", "source_type": "data_research"}], "evidence_detail": "Reddit is testing automated text-to-speech narration paired with video backgrounds to replicate the viral \"Reddit stories\" format popular on TikTok (which has over 19.6 million hashtag posts). This format allows users to watch and listen to viral text threads directly within Reddit's ecosystem."}, {"date": "2026-08-02", "section": "Technical SEO Experiments", "what_happened": "Model Context Protocol 2.0 stateless specification released for AI agent data access | Model Context Protocol 2.0 无状态规范发布，优化 AI Agent 数据接入", "why_it_matters": "MCP 正在成为 AI Agent 与外部数据源交互的标准协议。未来网站可能需要提供 MCP 接口，让 AI Agent 直接、无状态地查询结构化数据，改变传统的网页检索模式。", "evidence": "Release of the 2026-07-28 Model Context Protocol (MCP) specification and tools like mcp-explorer.", "who_it_affects": "SaaS / ecommerce / publisher / all", "what_to_do": "test Y", "confidence": "Data-backed", "impact": "P2", "sources": [{"name": "cyberandy", "url": "https://x.com/cyberandy/status/2083597404410921252", "excerpt": "Your MCP is going to be your new website.. Your MCP is going to be your new website. Simon Willison (@simonw) The new stateless MCP specification has rekindled my interest in MCP, and inspired some new projects, including mcp-explorer and datasette-mcp simonwillison.net/2026/Jul/3… Link Stateless MCP has recaptured my interest (and inspired mcp-explorer and datasette-mcp) Tuesday was Stateless MCP day—the rollout of MCP 2.0, or the 2026-07-28 Model Context Protocol specification to use the more formal but less memorable name. This is the", "author": "@cyberandy", "published": "2026-08-01T16:55:07+00:00", "source_type": "expert_vendor", "commercial_interest": true}], "evidence_detail": "The rollout of MCP 2.0 introduces a stateless specification designed to simplify how LLMs and AI agents connect to data sources. Simon Willison's release of mcp-explorer and datasette-mcp demonstrates how developers can now expose structured databases directly to AI agents using this standardized protocol."}, {"date": "2026-08-02", "section": "AI Search / GEO", "what_happened": "Google DeepMind launches Gemini Robotics ER 2 with native Google Search tool integration | Google 推出 Gemini Robotics ER 2，支持机器人原生调用 Google Search", "why_it_matters": "具身智能（Embodied AI）开始将 Google Search 作为其决策和规划的实时外部工具。这意味着未来的搜索流量将包含来自物理世界机器人（Agentic Traffic）的自动化查询。", "evidence": "Google DeepMind's official launch of the Gemini Robotics ER 2 \"embodied reasoning\" model.", "who_it_affects": "all", "what_to_do": "monitor Z", "confidence": "Confirmed", "impact": "P3", "sources": [{"name": "glenngabe", "url": "https://x.com/glenngabe/status/2083536416873545963", "excerpt": "So, we are running into problems with AI agents escaping containment, but we are also advancing AI models for robotics. I guess so the robots could go rogue at some point too? I think there was a movie about that in 1984... :) Don't get me wrong, I've been saying for a while that the convergence of AI and robotics will be HUGE... but it's still scary -> Introducing Gemini Robotics ER 2 \"That’s why today we’re launching Gemini Robotics ER 2, our most capable “embodied reasoning” model for robotics. Think of Gemini Robotics ER 2 as a high-level brain for robots. It allows robots to chat with humans, understand the physical world, and plan multi-step tasks. It then hands off motor execution to…", "author": "@glenngabe", "published": "2026-08-01T12:52:46+00:00", "source_type": "data_research"}], "evidence_detail": "Gemini Robotics ER 2 acts as a high-level brain for robots, handling multi-step task planning and handing off motor execution to lower-level VLA models. Crucially, the model can natively call tools like Google Search to retrieve real-time physical-world information during its reasoning process."}, {"date": "2026-08-02", "section": "AI Search / GEO", "what_happened": "OpenAI previews \"Astra\" AI model designed for long-running multi-agent tasks | OpenAI 向监管机构展示 “Astra” 模型，主打多 Agent 协同与长任务处理", "why_it_matters": "Astra 强调多 Agent 协同解决复杂、长期任务的能力。这类模型的大规模应用将大幅增加 Agent 自动在互联网上进行深度检索、比对和交互的频次，推动 Agentic SEO 的到来。", "evidence": "OpenAI CEO Sam Altman's demonstration of the \"Astra\" model family to policymakers in Washington, D.C.", "who_it_affects": "SaaS / publisher / all", "what_to_do": "monitor Z", "confidence": "Observed", "impact": "P3", "sources": [{"name": "glenngabe", "url": "https://x.com/glenngabe/status/2083534849134997857", "excerpt": "Multiple agents working together over a long period of time -> OpenAI Previews ‘Astra’ AI Model in DC \"OpenAI is preparing to release a new model family, tentatively using the name “Astra,” with improved abilities to complete long-running tasks, according to three people briefed on the plans.\" \"OpenAI CEO Sam Altman demonstrated Astra to policymakers and regulators in Washington, D.C., this week, according to the people. OpenAI touted its abilities to have multiple agents work together over a long period of time to solve particularly hard problems, which could be applied to a project or advanced math problem.\"…", "author": "@glenngabe", "published": "2026-08-01T12:46:32+00:00", "source_type": "data_research"}], "evidence_detail": "Briefings from three sources reveal that OpenAI is preparing to release \"Astra,\" a new model family optimized for completing long-running tasks. The model's core capability is orchestrating multiple AI agents to work together over extended periods to solve complex projects or advanced mathematical problems."}, {"date": "2026-08-02", "section": "Playbook: Worth Testing", "what_happened": "Use Link Density charts to audit editorial vs boilerplate inbound links | 使用链接密度图表审计编辑链接与样板链接", "why_it_matters": "区分高质量的“编辑内容内链接”（Editorial Links）与页眉/页脚/目录等“样板链接”（Boilerplate/Footer Links）对评估外链真实权重至关重要。", "evidence": "Majestic's Link Density charts in the Context and Pages reports.", "who_it_affects": "all", "what_to_do": "test Y", "confidence": "Data-backed", "impact": "P2", "sources": [{"name": "glenngabe", "url": "https://x.com/glenngabe/status/2083546425279848813", "excerpt": "If you're scanning inbound links for a site to determine editorial versus header/footer versus directory-like links, then Link Density charts in @Majestic can be very helpful -> Link Density Charts give you an immediate high-level view on how links are distributed across each web page in our index If you're using Majestic, you can find them in the Context report (for inbound links) and in the Pages report (for internal pages): https://blog.majestic.com/company/master-backlink-analysis-with-link-density-charts/. If you're scanning inbound links for a site to determine editorial versus header/footer versus directory-like links, then Link Density charts in @Majestic can be very helpful -&gt;…", "author": "@glenngabe", "published": "2026-08-01T13:32:32+00:00", "source_type": "data_research"}], "how_to_test": "1. 导出目标站点的前 100 个核心外链 URL。2. 导入 Majestic Context 报告，查看 Link Density 图表。3. 筛选出链接密度极高（>80%）的页面，这些通常是页脚或侧边栏群发链接。4. 重点保留链接密度低且位于内容核心区域的“编辑链接”，重新评估真实外链画像。", "success_metric": "识别并剔除低价值样板外链的比例，提升外链审计的精准度。", "effort": "低成本。需要 Majestic 账号，耗时约 1-2 小时。", "evidence_detail": "Majestic's Link Density charts visualize how links are distributed across the HTML structure of a page. This allows SEOs to instantly distinguish whether an inbound link is embedded within unique editorial content or grouped in high-density navigation blocks."}, {"date": "2026-08-03", "section": "Confirmed Search Updates", "what_happened": "Google resolves bug in Search and News \"Recent\" filter tools | Google 修复了搜索和新闻“最近”过滤工具的故障", "why_it_matters": "此前用户和 SEO 发现使用 Tools > Recent（如过去一小时）过滤时无法返回正确结果。Google 官方（Rajan Patel）已确认于 8 月 2 日上午部署了修复程序。", "evidence": "official_person", "who_it_affects": "publisher / all", "what_to_do": "无需操作，该 Bug 已由 Google 官方修复，可恢复正常的新闻与实时内容监控。", "confidence": "Confirmed", "impact": "P3", "sources": [{"name": "rustybrick", "url": "https://x.com/rustybrick/status/2083952489737453633", "excerpt": "Google Search fixed the Recent filter - thanks @rajanpatel story updated at https://www.seroundtable.com/google-search-filter-by-recent-bug-41807.html. Google Search fixed the Recent filter - thanks @rajanpatel story updated at seroundtable.com/google-sear… Link Google Search Filter By Recent Not Working If you try to filter you Google Search or Google News tab results by the recent search tools option, it simply won&apos;t work. If you try to select the &quot;Tools&quot; and then &quot;Recent&quot; options, including the... seroundtable.com Rajan Patel (@rajanpatel) The team shipped a fix this morning. Appreciate your patience. The weekend slo", "author": "@rustybrick", "published": "2026-08-02T16:26:06+00:00", "source_type": "trade_news"}], "evidence_detail": "Google's Rajan Patel confirmed on X that the team shipped a fix on the morning of August 2nd, resolving the issue where filtering Google Search or Google News results by recent time frames (e.g., past hour) failed to return expected results."}, {"date": "2026-08-03", "section": "SERP & Algorithm Signals", "what_happened": "Google Search Console updates link report data on August 1st | Google Search Console 于 8 月 1 日更新了链接报告数据", "why_it_matters": "GSC 的链接报告（Links Report）数据已更新。由于 Google 持续调整该报告的抽样和展示逻辑，SEO 可能会在后台看到外链总数或域名数的波动，这属于正常的数据刷新。", "evidence": "trade_news", "who_it_affects": "all", "what_to_do": "检查 GSC 链接报告，记录外链数据的变化，避免因数据刷新引起的外链暴跌误判。", "confidence": "Confirmed", "impact": "P3", "sources": [{"name": "rustybrick", "url": "https://x.com/rustybrick/status/2083897244961403117", "excerpt": "FYI, Google updated the link report data yesterday, August 1st - I keep a log now at https://www.seroundtable.com/google-search-console-links-report-fewer-links-40698.html. FYI, Google updated the link report data yesterday, August 1st - I keep a log now at seroundtable.com/google-sear…", "author": "@rustybrick", "published": "2026-08-02T12:46:34+00:00", "source_type": "trade_news"}], "evidence_detail": "Barry Schwartz documented that Google refreshed the Search Console links report data on August 1st, 2026. This is part of Google's periodic data updates for the legacy links report, which often results in visible fluctuations in reported backlink counts."}, {"date": "2026-08-03", "section": "Technical SEO Experiments", "what_happened": "Cloudflare launches \"Agents Week\" focusing on infrastructure for autonomous AI agents | Cloudflare 开启“Agent 周”，聚焦面向自主 AI Agent 的云基础设施", "why_it_matters": "标志着网络基础设施向“Agent 原生 Web”（Agent-native web）转型的开始。未来网站不仅需要服务人类浏览器，更需要提供适合 AI Agent 存储、执行和安全的底层接口，这将重塑技术 SEO 的边界。", "evidence": "official_api", "who_it_affects": "SaaS / all", "what_to_do": "保持关注 Cloudflare 本周发布的技术标准与安全产品，评估未来如何为 AI Agent 提供无障碍、结构化的数据读取接口。", "confidence": "Confirmed", "impact": "P3", "sources": [{"name": "Cloudflare", "url": "https://x.com/Cloudflare/status/2083947187457667276", "excerpt": "Welcome to Agents Week, when we explore how cloud infrastructure must evolve to serve autonomous agents rather than human browsers. Join us as we unpack the storage, execution, and security primitives needed for an agent-native web. https://cfl.re/4fLjHY7 #AgentsWeek. Welcome to Agents Week, when we explore how cloud infrastructure must evolve to serve autonomous agents rather than human browsers. Join us as we unpack the storage, execution, and security primitives needed for an agent-native web. cfl.re/4fLjHY7 #AgentsWeek Link Welcome to Agents Week Agents Week explores how cloud infrastructure must evolve to serve autonomous agents rather than human browsers. Join us as we unpack the…", "author": "@Cloudflare", "published": "2026-08-02T16:05:02+00:00", "source_type": "official_api"}], "evidence_detail": "Cloudflare officially announced 'Agents Week' to explore how cloud infrastructure must evolve (including storage, execution, and security primitives) to serve autonomous AI agents rather than traditional human browsers."}, {"date": "2026-08-03", "section": "Technical SEO Experiments", "what_happened": "Google may miss updated dates if pages with \"unavailable_after\" are not recrawled | 若页面未被重新抓取，Google 可能会忽略更新后的 unavailable_after 截止日期", "why_it_matters": "如果你使用 `unavailable_after` 元标记来控制过期内容的索引，一旦你更新了该日期，但 Googlebot 没有及时重新抓取该页面，Google 将无法识别新日期，导致页面按旧日期被移出索引。", "evidence": "expert_analysis", "who_it_affects": "publisher / ecommerce / all", "what_to_do": "在更新 `unavailable_after` 日期后，必须通过 GSC 提交手动抓取请求，或通过 API/XML 网站地图强力引导 Googlebot 重新抓取该页面。", "confidence": "Observed", "impact": "P2", "sources": [{"name": "aleyda", "url": "https://x.com/aleyda/status/2083971896128012464", "excerpt": "🏖️ The Latest in SEO & AI Search News, Updates & Guides [From today's #SEOFOMO - August 2nd, 2026] 👇 * ​Google rolls out platform properties globally, plus a new social and video performance guide: It's time to optimize all your brand presence consistently across the web * Google Review Snippets Prohibit Fake or Undisclosed Incentivized Reviews: Incentivized reviews must be disclosed and fake shouldn't be featured * ​The Problem With unavailable_after - Google Might Not See Updated Dates: Google can’t process an updated expiry date if it doesn’t recrawl the page * ​What 13 Billion Google Searches Reveal About Zero-Click Behavior: Learn which destinations win clicks, and which ones Google…", "author": "@aleyda", "published": "2026-08-02T17:43:13+00:00", "source_type": "expert_analysis"}], "evidence_detail": "Highlighted in Aleyda Solis's SEOFOMO digest, the technical limitation of the `unavailable_after` tag is that Google cannot process an updated expiration date if it does not recrawl the page before the original expiration date passes."}, {"date": "2026-08-03", "section": "AI Search / GEO", "what_happened": "Study: AI Search citations are 70-80% third-party domains across SaaS, finance, and ecommerce | 研究：SaaS、金融和电商领域的 AI 搜索引用中，70-80% 均来自第三方域名", "why_it_matters": "证实了 AI 搜索（如 Google AI Mode, Gemini, ChatGPT）主要是一个第三方引用（Digital PR 与社交媒体）的问题，品牌官网仅占少数。不同行业和平台的引用来源偏好差异显著（如 SaaS 偏向社交，金融偏向媒体/对比，AI Mode 最偏向社交）。", "evidence": "data_research", "who_it_affects": "SaaS / ecommerce / publisher / all", "what_to_do": "针对目标 AI 平台和行业属性，协同 Digital PR、社交媒体与 On-page SEO，在第三方高权重引用源（如 Reddit、行业媒体、对比网站）中建立品牌提及与协同验证。", "confidence": "Data-backed", "impact": "P1", "sources": [{"name": "aleyda", "url": "https://x.com/aleyda/status/2083901187447828484", "excerpt": "📊 AI Search Is a 3rd-Party Citation Problem With an On-Page Corroboration Base: The Data Across SaaS, Ecommerce and Finance 👇 But is this true across different verticals and AI platforms? How much weight should we give to digital PR vs social? To assess it, I analyzed the top 10 cited source domains for 15 leading brands across SaaS, ecommerce and finance in Google AI Mode, Gemini and ChatGPT, using @semrush Enterprise data: 1. AI search is primarily a 3rd-party citation problem The most consistent finding is that the brand's own website is a minority of the top cited source mix in every vertical. SaaS had the highest external share at 82.3%, followed by finance at 79.4% and ecommerce at…", "author": "@aleyda", "published": "2026-08-02T13:02:14+00:00", "source_type": "expert_analysis"}], "evidence_detail": "Aleyda Solis analyzed Semrush Enterprise data for the top 10 cited source domains of 15 leading brands across SaaS, ecommerce, and finance. The study found external domain citation shares of 82.3% for SaaS, 79.4% for finance, and 69.6% for ecommerce. It also noted that Google's AI Mode is highly social-led, while ChatGPT is more evaluative/written, and Gemini is mixed."}, {"date": "2026-08-03", "section": "AI Search / GEO", "what_happened": "Google surfaces \"Top Stories\" and \"Preferred Sources\" in AI Overviews | Google 在 AI Overviews 中展示“焦点新闻”与“首选来源”", "why_it_matters": "针对新闻和实时性查询，Google 正在 AI Overviews (AIO) 中更频繁地嵌入 Top Stories 模块，并突出显示“首选来源”（Preferred Sources）。这为新闻出版商在 AI 搜索时代保留流量提供了关键入口。", "evidence": "practitioner_observation", "who_it_affects": "publisher", "what_to_do": "针对高流量的新闻和时效性关键词，监控 AIO 中 Top Stories 模块的出现频率，并优化 Google News 准入与结构化数据以争取“首选来源”曝光。", "confidence": "Observed", "impact": "P2", "sources": [{"name": "glenngabe", "url": "https://x.com/glenngabe/status/2083895733007036832", "excerpt": "Great to y our systems, including BotBase and Precursor. cfl.re/4q08LL0 #AgentsWeek Link Unveiling good and bad behaviors on the Agentic Internet Cloudflare is shifting bot mitigation from point-in-time Risk assessment to continuous Trust evaluation. Learn how new good…", "author": "@Cloudflare", "published": "2026-08-07T13:05:01+00:00", "source_type": "official_api"}], "evidence_detail": "Cloudflare announced a shift from point-in-time bot risk scoring to continuous behavior-based trust evaluation using new systems called BotBase and Precursor to assess agentic internet behaviors."}, {"date": "2026-08-08", "section": "AI Search / GEO", "what_happened": "Cloudflare launches free AI visibility and AEO reporting beta | Cloudflare 推出免费 AI 可见性与 AEO 报告公测", "why_it_matters": "提供了首个免费的、系统化的AEO和AI可见性基准测试工具，改变了GEO效果无法量化的现状。", "evidence": "official_person", "who_it_affects": "all", "what_to_do": "test Cloudflare AEO beta", "confidence": "Confirmed", "impact": "P2", "sources": [{"name": "glenngabe", "url": "https://x.com/glenngabe/status/2085703866385928685", "excerpt": "Whoa, Cloudflare is launching AI visibility reporting (for free I believe). For companies providing those services and tracking, this is a huge heads-up. You can sign up for the beta today ('Register interest'). See below: \"To evaluate how an AI model perceives your market presence, we build a benchmark across each industry and category before scoring a specific site. We query AI assistants with likely prompts in that category — without specifying your brand — and record which sites are cited, where they appear, and how prominently they feature.\" \"Alongside the answers, an AI Operator Activity shows the real crawl and referral traffic on your site, per operator (OpenAI, Google, and so on):…", "author": "@glenngabe", "published": "2026-08-07T12:25:26+00:00", "source_type": "data_research"}, {"name": "screamingfrog", "url": "https://x.com/screamingfrog/status/2085671659713773617", "excerpt": "From ranking to recommended: get your site ready to thrive in the age of AI agents - https://blog.cloudflare.com/aeo/ from @Cloudflare. From ranking to recommended: get your site ready to thrive in the age of AI agents - blog.cloudflare.com/aeo/ from @Cloudflare Link From ranking to recommended: get your site ready to thrive in the age of AI agents More than half of requests now come from machines, not people. Agent Readiness shows how well agents can discover and read your site, while Answer Engine Optimization tracks how often AI assistants... blog.cloudflare.com", "author": "@screamingfrog", "published": "2026-08-07T10:17:28+00:00", "source_type": "expert_vendor", "commercial_interest": true}], "evidence_detail": "Cloudflare announced 'Agent Readiness' and 'Answer Engine Optimization' (AEO) reporting. The tool queries AI assistants with industry-specific prompts to benchmark which sites are cited, alongside tracking real crawl and referral traffic from AI operators."}, {"date": "2026-08-08", "section": "Playbook: Worth Testing", "what_happened": "The 'Cats.txt' experiment debunks llms.txt as 'GEO Astrology' | 'Cats.txt' 实验戳穿 llms.txt 的 GEO 伪科学面纱", "why_it_matters": "揭示了当前GEO领域对 `llms.txt` 的盲目崇拜，证明爬虫抓取并不等于LLM在实时生成中使用了该数据。", "evidence": "reproducible_experiment", "who_it_affects": "all", "what_to_do": "test LLM retrieval sources", "confidence": "Data-backed", "impact": "P2", "sources": [{"name": "aleyda", "url": "https://x.com/aleyda/status/2085825433552003424", "excerpt": "👀 A must-read in case you're being asked about \"What are we not using llmx.txt yet?: How cats.txt showed llms.txt evidence is GEO astrology by @thetafferboy 👇 Going through the existing faulty thinking: #1 “It’s definitely used, the LLM bots crawl it!” #2 “It was indexed by Google, so it must matter!” #3 “ChatGPT returned information that was only in my llms.txt file” #4 “ChatGPT itself says llms.txt helps!” More: https://markwilliamscook.substack.com/p/how-catstxt-showed-llmstxt-evidence. 👀 A must-read in case you're being asked about \"What are we not using llmx.txt yet?: How cats.txt showed llms.txt evidence is GEO astrology by @thetafferboy 👇 Going through the existing faulty thinking:…", "author": "@aleyda", "published": "2026-08-07T20:28:30+00:00", "source_type": "expert_analysis"}, {"name": "lilyraynyc", "url": "https://x.com/lilyraynyc/status/2085871069055811926", "excerpt": "This whole experiment is amazing. This whole experiment is amazing Aleyda Solis 🕊️ (@aleyda) 👀 A must-read in case you're being asked about \"What are we not using llmx.txt yet?: How cats.txt showed llms.txt evidence is GEO astrology by @thetafferboy 👇 Going through the existing faulty thinking: #1 “It’s definitely used, the LLM bots crawl it!” #2 “It was indexed by Google, so it must matter!” #3 “ChatGPT returned information that was only in my llms.txt file” #4 “ChatGPT itself says llms.txt helps!” More: markwilliamscook.substa", "author": "@lilyraynyc", "published": "2026-08-07T23:29:51+00:00", "source_type": "expert_analysis"}], "how_to_test": "在网站根目录部署一个包含高度独特、虚构事实的自定义文本文件（如 `seo_test.txt`）。监控服务器日志中LLM爬虫的抓取情况。随后在ChatGPT/Claude中，使用包含该独特词汇的提示词进行提问，测试其在开启和关闭联网搜索（Web Search）时的回答，验证其是否真正读取并利用了该文件内容，而非仅仅将其作为普通网页索引或产生幻觉。", "success_metric": "LLM在未联网搜索时，无法回答该虚构事实；仅在联网搜索并明确抓取该URL时才能正确回答，从而证实其并非通过特定txt协议直接读取。", "effort": "低成本：编写一个txt文件并部署需10分钟，使用LLM测试需10分钟。无技术风险。", "evidence_detail": "Mark Williams-Cook's experiment showed that creating a 'cats.txt' file with the same structure as 'llms.txt' passed all the same validation arguments (being crawled, indexed, and cited via hallucination), proving that LLMs do not use these files for real-time retrieval as claimed."}, {"date": "2026-08-09", "section": "Confirmed Search Updates", "what_happened": "OpenAI expands safety testing for Astra model over potential cyber risks | OpenAI 因潜在网络安全风险延迟 Astra 模型发布", "why_it_matters": "AI 搜索和 Agent 技术的演进正受到安全合规的严重制约。Astra 的延迟意味着高度自主的 AI Agent 时代（能代替用户在网页上执行复杂操作）普及时间将被推迟。", "evidence": "Official statement from OpenAI via Test e SERPs (which I shared about the other day). The redirects have been tested over the past few weeks. Viktor explains why this could be a very bad sign for third-parties scraping Google (including tools and AI companies).. Good thread about why Google might be testing those 'goto' links in the SERPs (which I shared about the other day). The redirects have been tested over the past few weeks. Viktor explains why this could be a very bad sign for third-parties scraping Google (including tools and AI companies). Viktor Lofgren | Marginalia Search Guy (@MarginaliaNu) If a 3rd party scrapes google via a residential proxy,…", "author": "@glenngabe", "published": "2026-08-08T14:50:41+00:00", "source_type": "data_research"}], "evidence_detail": "Viktor Lofgren (Marginalia Search) notes that Google's 'goto' redirects rely on JavaScript to detect clicks. If a scraper uses residential proxies without executing JS or simulating real user clicks, Google sees a search with zero clicks, potentially poisoning the scraper's data or blocking them."}, {"date": "2026-08-09", "section": "SERP & Algorithm Signals", "what_happened": "Overstock.com relaunch fails to recover organic visibility after 2023 shutdown | Overstock 关停后重新上线，有机能见度未能恢复", "why_it_matters": "关停高权重域名并试图在后期重新启用的代价是致命的。历史累积的信任和爬网预算一旦归零，即使重新上线原域名，也无法简单找回原有的排名。", "evidence": "Domain visibility tracking by Glenn Gabe", "who_it_affects": "ecommerce / publisher / SaaS / all", "what_to_do": "避免完全关闭高权重域名；若必须转型，应使用持续的 301 重定向保留路由，而非彻底下线。", "confidence": "Data-backed", "impact": "P2", "sources": [{"name": "glenngabe", "url": "https://x.com/glenngabe/status/2086083626072952906", "excerpt": "Quote from an article after they initially shut down http://overstock.com in 2023 -> Shutting down Overstock was ‘a fatal mistake’ The initial fall in visibility was huge (and expected), but the lack of visibility once it relaunched is not good. Not good at all. Checking trending for http://overstock.com now, it's not pretty. Here's the article :30+00:00", "source_type": "trade_news"}], "evidence_detail": "Kevin Indig's AI Halftime Report analyzed AI search citations across major engines, revealing that 91% of citations are exclusive to a single platform. This highlights the extreme fragmentation of LLM-based retrieval sources compared to traditional Google SERPs."}, {"date": "2026-08-09", "section": "AI Search / GEO", "what_happened": "KPMG report reveals 50% of executives delayed AI agent rollouts due to ROI | KPMG 报告显示近半数企业因 ROI 问题推迟 AI Agent 部署", "why_it_matters": "企业端对 AI Agent 的降温意味着 B2B 流量生态中，由 Agent 自动执行的“无头流量”（headless traffic）增长速度可能慢于预期。", "evidence": "KPMG Executive Survey via Polymarket", "who_it_affects": "SaaS / ecommerce / all", "what_to_do": "在规划 B2B 网站的 Agent 友好度（如 schema、API 暴露）时，保持理性预算，优先服务人类用户的传统搜索需求。", "confidence": "Data-backed", "impact": "P3", "sources": [{"name": "Kevin_Indig", "url": "https://x.com/Kevin_Indig/status/2086186668906938797", "excerpt": "Rough. Rough Polymarket (@Polymarket) JUST IN: Nearly half of executives have delayed or scaled back AI-agent deployments after costs exceeded benefits. — KPMG — https://nitter.net/Polymarket/status/2085799477021979095#m", "author": "@Kevin_Indig", "published": "2026-08-08T20:23:55+00:00", "source_type": "data_research"}], "evidence_detail": "A KPMG survey of corporate executives revealed that nearly half have delayed or scaled back their AI-agent deployments. The primary driver for the pullback was that implementation and operational costs exceeded the measured benefits."}, {"date": "2026-08-09", "section": "Playbook: Worth Testing", "what_happened": "Retailers optimize sites for ChatGPT citations while driving direct checkout | 零售商优化 ChatGPT 引用并引导直接交易以留存数据", "why_it_matters": "在 AI 搜索时代，品牌既需要获取 LLM 的推荐（Citations），又必须防止用户在 AI 平台内完成闭环交易导致品牌失去一手数据（First-party data）。", "evidence": "Reuters report on retail consumer AI search tactics", "who_it_affects": "ecommerce / local / SaaS", "what_to_do": "优化 Schema 标记以获取 AI 引用，但在落地页提供独家优惠或会员权益，吸引 AI 带来的流量直接在站内转化。", "confidence": "Observed", "impact": "P2", "sources": [{"name": "glenngabe", "url": "https://x.com/glenngabe/status/2086074416966881524", "excerpt": "I think retailers that are \"optimizing their sites for AI chat\" should be very careful with their tactics... -> Retailers are updating their websites to rank highly in chatbot results, while making sure purchases are done on their own sites to collect customer data \"The company is optimizing its website so its vendors appear in ChatGPT results, but it is trying to convince couples to book their wedding venues and invitations directly through the company's website.\" https://www.reuters.com/business/retail-consumer/retailers-tap-ai-shopping-traffic-fight-keep-customer-data-2026-08-07/. I think retailers that are \"optimizing their sites for AI chat\" should be very careful with their tactics...…", "author": "@glenngabe", "published": "2026-08-08T12:57:53+00:00", "source_type": "data_research"}], "how_to_test": "1. 针对高意向产品页，部署完整的 Product 和 Offer Schema 确保被 LLM 索引。2. 在这些落地页上部署“AI 读者专属”或“直接预订”的独家优惠/增值服务。3. 监控来自 ChatGPT/Perplexity 推荐流量的站内转化率。", "success_metric": "来自 AI 引擎引用的直接引流转化率（Direct Conversion Rate from AI Referrals）提升。", "effort": "中等。需要调整 Schema 标记和落地页的转化漏斗设计。", "evidence_detail": "Reuters reported on retailers optimizing their structured data and vendor listings specifically to appear in ChatGPT shopping results, while simultaneously designing user journeys that incentivize couples/users to book directly on their own sites to retain customer data."}, {"date": "2026-08-09", "section": "Playbook: Worth Testing", "what_happened": "Technical SEOs advocate replacing heavy JS with native HTML/CSS features | 技术 SEO 倡导使用原生浏览器特性替代重度 JS 以提升能见度", "why_it_matters": "尽管 Google 能够渲染 JS，但重度依赖 JS 仍会消耗大量爬网预算并延迟索引。使用原生 HTML/CSS 特性替代 JS，可以显著提升页面加载速度和搜索引擎的抓取效率。", "evidence": "Expert analysis by Jono Alderson and Sitebulb", "who_it_affects": "ecommerce / publisher / SaaS / UGC / all", "what_to_do": "审计网站上的 JS 依赖，将非 ial_documentation", "who_it_affects": "all", "what_to_do": "check X", "confidence": "Confirmed", "impact": "P1", "sources": [{"name": "aleyda", "url": "https://x.com/aleyda/status/2086473415418872235", "excerpt": "☀️ Not to Be Missed SEO + AI Search News Of the Week [#SEOFOMO - August 9, 2026] 👇 * ​Microsoft added Branded and Non-Branded AI Queries in the Clarity Citations Dashboard * ​OpenAI is improving GPT‑5.6 Sol in ChatGPT—and expanding access to GPT‑5.6 Luna for free users​ * Google’s Documentation Refresh Offers Ideas For SEO Content Updates * Does Google Use User Behavior, Website Design & Layouts in SEO Rank Assessments? * These SEO Strategies Drive 90% of Your AI Visibility * ​The Future of Discoverability * ​How I Use Knowledge Graphs on Content Sites * ​Content Prioritization in an AI Search Era: A Framework + Worksheet * ​What 50k Query Fan-Outs Reveal About Brands (+ Free Data!) * More!…", "author": "@aleyda", "published": "2026-08-09T15:23:21+00:00", "source_type": "expert_analysis"}], "evidence_detail": "Microsoft updated its Clarity Citations Dashboard to segment AI-driven search queries into branded and non-branded categories, allowing webmasters to track how users discover their site via AI search engines."}, {"date": "2026-08-10", "section": "AI Search / GEO", "what_happened": "OpenAI improves GPT-5.6 Sol in ChatGPT and expands free access to GPT-5.6 Luna | OpenAI 改进了 ChatGPT 中的 GPT-5.6 Sol，并向免费用户扩大了 GPT-5.6 Luna 的访问权限", "why_it_matters": "随着更先进的模型（Sol 和 Luna）在 ChatGPT 用户中普及，其检索和引用行为（AEO/GEO 展现形式）可能会发生变化。SEO 需要密切监控 ChatGPT 带来的引荐流量和引用特征。", "evidence": "official_person", "who_it_affects": "all", "what_to_do": "monitor Z", "confidence": "Confirmed", "impact": "P2", "sources": [{"name": "aleyda", "url": "https://x.com/aleyda/status/2086473415418872235", "excerpt": "☀️ Not to Be Missed SEO + AI Search News Of the Week [#SEOFOMO - August 9, 2026] 👇 * ​Microsoft added Branded and Non-Branded AI Queries in the Clarity Citations Dashboard * ​OpenAI is improving GPT‑5.6 Sol in ChatGPT—and expanding access to GPT‑5.6 Luna for free users​ * Google’s Documentation Refresh Offers Ideas For SEO Content Updates * Does Google Use User Behavior, Website Design & Layouts in SEO Rank Assessments? * These SEO Strategies Drive 90% of Your AI Visibility * ​The Future of Discoverability * ​How I Use Knowledge Graphs on Content Sites * ​Content Prioritization in an AI Search Era: A Framework + Worksheet * ​What 50k Query Fan-Outs Reveal About Brands (+ Free Data!) * More!…", "author": "@aleyda", "published": "2026-08-09T15:23:21+00:00", "source_type": "expert_analysis"}], "evidence_detail": "OpenAI is rolling out updates to its GPT-5.6 Sol model for paid ChatGPT users and expanding free tier access to GPT-5.6 Luna, altering the baseline model capabilities and citation generation patterns for millions of active users."}, {"date": "2026-08-10", "section": "Research & Retrieval", "what_happened": "Moz study of 50k query fan-outs reveals how Google maps brand associations | Moz 发布的 5 万个查询扇出研究揭示了 Google 如何映射品牌关联", "why_it_matters": "查询扇出（基于 Web Guide）展示了 Google 搜索引擎如何将特定品牌与实体、属性和相关查询进行关联。理解这些关联有助于优化品牌的实体图谱（Entity Graph）和 AEO/GEO 表现。", "evidence": "data_research", "who_it_affects": "all", "what_to_do": "check X", "confidence": "Data-backed", "impact": "P2", "sources": [{"name": "glenngabe", "url": "https://x.com/glenngabe/status/2086435326533247200", "excerpt": "50K query fan-outs (based on Web Guide) + you get the spreadsheet of data -> What 50k Query Fan-Outs Reveal About Brands https://moz.com/blog/50k-fan-outs-reveal-about-brands via @Moz. 50K query fan-outs (based on Web Guide) + you get the spreadsheet of data -&gt; What 50k Query Fan-Outs Reveal About Brands moz.com/blog/50k-fan-outs-re… via @Moz", "author": "@glenngabe", "published": "2026-08-09T12:52:00+00:00", "source_type": "data_research"}], "evidence_detail": "Moz analyzed a dataset of 50,000 query fan-outs to map how Google associates brands with specific entities, search intents, and related queries. The study includes a downloadable spreadsheet of the raw data for SEOs to analyze brand-entity relationships."}, {"date": "2026-08-10", "section": "Playbook: Worth Testing", "what_happened": "GBP 'Moved' feature recommended over direct address updates for cross-state relocations | 跨州迁移商家时，建议使用 Google 商家资料（GBP）的“已迁移”功能而非直接更新地址", "why_it_matters": "直接在现有 GBP 上更新跨州地址可能导致在新地区的排名丢失。使用“已迁移”功能（创建新 Profile 并联系支持标记旧 Profile 已迁移）可以保留历史权重并安全过渡。", "evidence": "expert_analysis", "who_it_affects": "local", "what_to_do": "test Y", "confidence": "Observed", "impact": "P2", "sources": [{"name": "glenngabe", "url": "https://x.com/glenngabe/status/2086436591476580384", "excerpt": "Focus on Local? Interesting -> How to Move a Google Business Profile Across State Lines \"The “Moved” feature for GBP is used when a business creates a new profile at the new address instead of updating the address on the existing GBP. You then contact support and ask them to mark the old profile as “moved” to the new one.\" \"Typically, the correct way to handle a move is to update the address directly on the GBP. However, in some cases you want to use the moved feature instead, including when a business moves across state lines. Why? Because if you update the address directly on the existing GBP, you run the risk of the profile not ranking in the new state at the new address.\"…", "author": "@glenngabe", "published": "2026-08-09T12:57:02+00:00", "source_type": "data_research"}], "how_to_test": "对于需要跨州迁移的 GBP 商家，不要直接在后台修改地址。在目标新地址创建一个全新的 GBP 商家资料并完成验证。随后，联系 Google GBP 支持团队，申请将旧的商家资料标记为“已迁移（Moved）”至新的商家资料。", "success_metric": "成功将旧 GBP 的评价和历史权重转移至新 GBP，且不会出现直接修改地址时常见的排名骤降或账号挂起问题。", "effort": "中等工作量（需要与 Google 支持团队人工沟通申诉）。相比直接修改地址导致封号或排名丢失的风险，此方案风险极低。", "evidence_detail": "Sterling Sky outlines a specific workflow for businesses moving across state lines: instead of updating the address on the existing GBP (which risks ranking loss in the new state), SEOs should create a new profile at the new address, then contact Google support to mark the old profile as 'moved' to the new one."}, {"date": "2026-08-10", "section": "Tools, Papers & Open Source", "what_happened": "Anthropic defaults Claude Code to auto mode for premium plans starting August 14 | Anthropic 将于 8 月 14 日起在 Claude Code 高级方案中默认启用自动模式", "why_it_matters": "自动模式（Auto Mode）允许 Claude Code 在无需人工逐一确认的情况下执行操作。Anthropic 声称其安全评估已能拦截 89% 的潜在风险（如提示词注入、数据泄露），但仍有 11% 的漏网率。使用该工具进行自动化技术 SEO 审计或代码修改时需注意安全边界。", "evidence": "official_person", "who_it_affects": "all", "what_to_do": "check X", "confidence": "Confirmed", "impact": "P2", "sources": [{"name": "glenngabe", "url": "https://x.com/glenngabe/status/2086426342556324338", "excerpt": "It is annoying approving actions, but there was a reason for that... Should be interesting to see how this goes. Sounds like they are catching a lot, but still 11% of cases slip through -> Anthropic says auto mode will be the default in Claude Code for Pro, Max, Team plans, starting on Aug. 14, claiming it's good enough at catching harmful actions \"We’re going to publish some evals in the coming weeks, but we’ve pretty much mitigated every attack for the main categories of risks that we’re concerned about, like prompt injection and data exfiltration, the risks are far lower than the average human reviewer.\" \"Of course, that still leaves 11% of cases where auto mode would not have prevented…", "author": "@glenngabe", "published": "2026-08-09T12:16:18+00:00", "source_type": "data_research"}], "evidence_detail": "Anthropic announced that starting August 14, 'auto mode' will be the default for Claude Code on Pro, Max, and Team plans. They claim to have mitigated major risks like prompt injection and data exfiltration to a level safer than human reviewers, though 11% of harmful actions may still bypass the automated safety checks."}, {"date": "2026-08-10", "section": "Tools, Papers & Open Source", "what_happened": "Ex-Google Chief Scientist Jeff Dean releases compreh
