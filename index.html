<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEO Signal Radar</title>
<style>
  :root{
    color-scheme: light;
    --bg:#f5f6f8; --surface:#ffffff; --surface-strong:#f1f2f5;
    --line:#e3e4e8; --line-strong:#d2d4db;
    --ink:#0d0d10; --ink-2:#3e3f45; --ink-3:#7a7b85;
    --accent:#3451b2;
    --p0:#b22222; --p0-bg:#fef2f2; --p0-accent:#dc2626;
    --p1:#c45f0a; --p1-bg:#fff7ed; --p1-accent:#ea580c;
    --p2:#7c6a16; --p2-bg:#fffbeb; --p2-accent:#ca8a04;
    --p3:#4b5563; --p3-bg:#f8fafc; --p3-accent:#64748b;
    --heat-extreme:#b22222; --heat-high:#d97706; --heat-elevated:#ca8a04;
    --heat-normal:#16a34a; --heat-unknown:#9ca3af;
    --action-bg:#eff6ff; --action-accent:#2563eb;
    --radius:10px;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
    --shadow-raised:0 4px 12px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.04);
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);
    font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;}
  a{color:var(--accent);text-decoration:none;}
  a:hover{text-decoration:underline;}

  /* ---- header ---- */
  header{background:var(--surface);border-bottom:1px solid var(--line);
    padding:0;position:sticky;top:0;z-index:10;
    box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .brandbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:16px 28px 0;background:var(--surface);}
  .logo{font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:-.02em;
    display:flex;align-items:center;gap:8px;}
  .logo .dot{color:var(--accent);}
  .thesis{color:var(--ink-2);font-size:13px;}
  .thesis .zh{color:var(--ink-3);margin-left:8px;}
  nav{display:flex;gap:0;margin:0;padding:0 28px;background:var(--surface);}
  nav button{font-family:var(--ui);font-size:13px;font-weight:600;color:var(--ink-3);
    background:none;border:none;border-bottom:2px solid transparent;
    padding:14px 18px 12px;cursor:pointer;transition:color .12s;}
  nav button:hover{color:var(--ink-2);}
  nav button.active{color:var(--accent);border-bottom-color:var(--accent);}

  main{max-width:960px;margin:0 auto;padding:28px;}
  .view{display:none;}
  .view.active{display:block;}

  /* ---- morning brief ----
     One dominant stat (top priority) + quiet supporting stats. */
  .brief{display:flex;flex-wrap:wrap;gap:0;align-items:stretch;
    padding:0;border-radius:var(--radius);background:var(--surface);
    margin-bottom:28px;box-shadow:var(--shadow);overflow:hidden;
    border:1px solid var(--line);}
  .brief .stat{display:flex;flex-direction:column;gap:3px;padding:14px 20px;
    border-right:1px solid var(--line);min-width:108px;justify-content:center;}
  .brief .stat:last-child{border-right:none;}
  .brief .k{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);
    text-transform:uppercase;letter-spacing:.07em;}
  .brief .v{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--ink-2);}
  /* the lead stat carries the day's urgency — the one place color shouts */
  .brief .stat.lead{background:var(--surface-strong);min-width:132px;}
  .brief .stat.lead .v{font-size:24px;font-weight:700;color:var(--ink);letter-spacing:-.02em;}
  .brief .stat.lead.urgent{background:var(--p0-bg);}
  .brief .stat.lead.urgent .v{color:var(--p0-accent);}
  .brief .stat.lead.urgent .k{color:var(--p0);}
  .brief .v .dot-heat{width:9px;height:9px;border-radius:50%;display:inline-block;
    margin-right:6px;vertical-align:middle;}

  .date-label{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-bottom:8px;}

  /* ---- source health strip ----
     Quiet by default; only speaks up when coverage is degraded, because "27/29
     sources" is reassurance, not news. Amber/red means today's digest is
     thinner than reality. */
  .health{display:flex;flex-wrap:wrap;gap:14px;align-items:center;
    font-family:var(--mono);font-size:11px;color:var(--ink-3);
    margin:-18px 0 24px;padding:8px 12px;background:var(--surface);
    border:1px solid var(--line);border-radius:8px;}
  .health.warn{background:var(--p1-bg);border-color:rgba(234,88,12,.28);color:var(--p1);}
  .health.down{background:var(--p0-bg);border-color:rgba(220,38,38,.3);color:var(--p0);
    font-weight:700;}
  .health .hitem{display:inline-flex;align-items:center;gap:6px;}
  .health .hdot{width:7px;height:7px;border-radius:50%;background:var(--heat-normal);}
  .health.warn .hdot{background:var(--heat-high);}
  .health.down .hdot{background:var(--heat-extreme);}
  .health .hnote{color:inherit;opacity:.85;}

  /* Track with no data at all: say so, don't imply calm. */
  .track.nodata .lane{background-image:none;background:var(--surface-strong);}
  .track.nodata .lane .nd{position:absolute;top:50%;left:16px;transform:translateY(-50%);
    font-family:var(--mono);font-size:11px;color:var(--ink-3);}
  .headline{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.3;
    margin:0 0 24px;color:var(--ink);max-width:44em;}

  /* ---- cards ----
     Hierarchy by weight, not by wall-to-wall colour:
       P0 = tinted + strong bar   (stop and read)
       P1 = white + accent bar    (act this week)
       P2 = white + amber bar     (worth testing — real work, gets a full card)
       P3 = compact single row    (awareness only)  */
  .card{border-radius:var(--radius);padding:16px 20px;margin-bottom:10px;
    background:var(--surface);box-shadow:var(--shadow);
    border:1px solid var(--line);position:relative;overflow:hidden;
    transition:box-shadow .15s,transform .1s;}
  .card:hover{box-shadow:var(--shadow-raised);transform:translateY(-1px);}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--line-strong);}

  .card.P0{background:var(--p0-bg);border-color:rgba(220,38,38,.22);}
  .card.P0::before{background:var(--p0-accent);width:4px;}
  .card.P1::before{background:var(--p1-accent);}
  .card.P2::before{background:var(--p2-accent);}
  .card.P3::before{background:var(--line-strong);}

  /* Playbook rows: the test recipe, visually distinct from news fields
     without adding another colour to the page. */
  .card .row.test .lab{color:var(--p2);}
  .card .testbox{margin-top:11px;padding:11px 13px;background:var(--surface-strong);
    border-radius:8px;border-left:2px solid var(--p2-accent);}
  .card .testbox .row{margin:3px 0;}
  .card .testbox .row:first-child{margin-top:0;}

  .card .what{font-weight:650;font-size:15.5px;line-height:1.45;margin-bottom:10px;
    display:flex;gap:10px;align-items:flex-start;justify-content:space-between;}
  .card .what .wtext{flex:1;min-width:0;}
  .card .row{display:flex;gap:10px;font-size:13px;color:var(--ink-2);margin:5px 0;}
  .card .row .lab{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);
    min-width:74px;text-transform:uppercase;letter-spacing:.05em;padding-top:3px;
    flex-shrink:0;}
  .card .srcs{margin-top:11px;padding-top:10px;border-top:1px solid var(--line);
    display:flex;flex-wrap:wrap;gap:12px;}
  .card .srcs a{font-family:var(--mono);font-size:11.5px;}

  /* ---- evidence expansion ----
     A <details> element, not a JS toggle: keyboard-accessible, works without
     script, and browsers handle the open/close state for free. Closed by
     default so scanning the day is unaffected — the whole point of the digest
     is density, and detail is opt-in. */
  .card .eviexp{margin-top:9px;}
  .lib-row .eviexp{margin-top:7px;}
  .eviexp>summary{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);
    cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:5px;
    padding:3px 8px;border:1px solid var(--line);border-radius:5px;
    text-transform:uppercase;letter-spacing:.05em;transition:all .12s;
    user-select:none;}
  .eviexp>summary::-webkit-details-marker{display:none;}
  .eviexp>summary:hover{border-color:var(--line-strong);color:var(--ink-2);}
  .eviexp>summary::before{content:"▸";font-size:9px;transition:transform .12s;}
  .eviexp[open]>summary::before{transform:rotate(90deg);}
  .eviexp[open]>summary{color:var(--ink-2);background:var(--surface-strong);}
  .evibody{margin-top:10px;padding:12px 14px;background:var(--surface-strong);
    border-radius:8px;border-left:2px solid var(--line-strong);}
  .evibody .edetail{font-size:13px;color:var(--ink-2);line-height:1.6;
    margin-bottom:12px;}
  /* Verbatim source text. Quoted and monospaced so it reads unmistakably as
     "their words", never as our summary. */
  .quote{margin:9px 0 0;padding-left:11px;border-left:2px solid var(--line-strong);}
  .quote .qhead{font-family:var(--mono);font-size:10px;color:var(--ink-3);
    display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:4px;}
  .quote .qtier{background:var(--surface);border:1px solid var(--line);
    border-radius:4px;padding:0 5px;}
  .quote .qci{color:var(--p1);background:var(--p1-bg);
    border:1px solid rgba(234,88,12,.25);border-radius:4px;padding:0 5px;}
  .quote .qtext{font-size:12.5px;color:var(--ink-2);line-height:1.6;
    white-space:pre-wrap;overflow-wrap:anywhere;}
  .quote .qlink{font-family:var(--mono);font-size:11px;}

  /* compact row for low-priority signals */
  .mini{display:flex;gap:12px;align-items:baseline;padding:10px 14px;
    background:var(--surface);border:1px solid var(--line);border-radius:8px;
    margin-bottom:6px;font-size:13.5px;transition:border-color .12s;}
  .mini:hover{border-color:var(--line-strong);}
  .mini .mtext{flex:1;min-width:0;color:var(--ink-2);}
  .mini .mtext b{font-weight:600;color:var(--ink);}
  .mini .msrc{font-family:var(--mono);font-size:11px;flex-shrink:0;}

  .badges{display:inline-flex;gap:5px;flex-shrink:0;}
  .tag{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:2px 7px;
    border-radius:4px;letter-spacing:.02em;white-space:nowrap;}
  /* only P0 is loud; the rest are legible but quiet */
  .tag.P0{color:#fff;background:var(--p0-accent);border:1px solid var(--p0-accent);}
  .tag.P1{color:var(--p1);background:rgba(234,88,12,.09);border:1px solid rgba(234,88,12,.22);}
  .tag.P2{color:var(--p2);background:rgba(202,138,4,.09);border:1px solid rgba(202,138,4,.22);}
  .tag.P3{color:var(--ink-3);background:var(--surface-strong);border:1px solid var(--line);}
  .tag.conf{color:var(--ink-3);background:transparent;border:1px solid var(--line-strong);font-weight:600;}
  /* Set when every citation the model produced failed URL verification. The
     claim may still be real, but the reader must know we could not link it. */
  .tag.unver{color:var(--p0);background:var(--p0-bg);border:1px solid rgba(220,38,38,.28);}

  /* ---- sections ---- */
  h2.section{font-size:10.5px;font-weight:700;text-transform:uppercase;
    letter-spacing:.09em;color:var(--ink-3);margin:34px 0 12px;
    display:flex;align-items:center;gap:9px;}
  h2.section::after{content:"";flex:1;height:1px;background:var(--line);}
  h2.section .count{font-family:var(--mono);color:var(--ink-3);font-weight:500;
    font-size:10.5px;}

  /* ---- action items — the one deliberately blue block ---- */
  .actions-card{background:var(--action-bg);border:1px solid rgba(37,99,235,.18);
    border-left:3px solid var(--action-accent);
    border-radius:var(--radius);padding:18px 20px;margin:0 0 24px;}
  .actions-card h2{margin:0 0 12px;font-size:10.5px;font-weight:700;
    color:var(--action-accent);text-transform:uppercase;letter-spacing:.09em;}
  .actions-card ul{margin:0;padding-left:0;list-style:none;}
  .actions-card li{margin:7px 0;font-size:13.5px;color:var(--ink-2);
    display:flex;gap:9px;align-items:baseline;}
  .actions-card li .tag{flex-shrink:0;}

  /* ---- SERP weather ---- */
  .serp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
    gap:10px;margin-bottom:12px;}
  .serp-cell{border-radius:8px;padding:14px 16px;background:var(--surface);
    border:1px solid var(--line);border-top:2px solid var(--heat-unknown);}
  .serp-cell.Extreme{border-top-color:var(--heat-extreme);}
  .serp-cell.High{border-top-color:var(--heat-high);}
  .serp-cell.Elevated{border-top-color:var(--heat-elevated);}
  .serp-cell.Normal{border-top-color:var(--heat-normal);}
  .serp-cell .k{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);
    text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;}
  .serp-cell .v{font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px;}
  .serp-cell .v .dot-heat{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .serp-note{background:var(--surface-strong);border-radius:8px;padding:13px 16px;
    font-size:12.5px;color:var(--ink-2);margin:0 0 26px;
    border-left:2px solid var(--line-strong);}

  /* ---- algorithm map ---- */
  .map-controls{display:flex;gap:6px;margin-bottom:20px;}
  .map-controls button{font-family:var(--mono);font-size:12px;border:1px solid var(--line-strong);
    background:var(--surface);color:var(--ink-2);padding:5px 14px;border-radius:6px;cursor:pointer;
    transition:all .12s;}
  .map-controls button:hover{border-color:var(--ink-3);}
  .map-controls button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .track{display:grid;grid-template-columns:142px 1fr;border-top:1px solid var(--line);
    min-height:84px;background:var(--surface);}
  .track:last-child{border-bottom:1px solid var(--line);}
  .track .name{padding:18px 16px;border-right:1px solid var(--line);background:var(--surface-strong);}
  .track .name .t{font-weight:650;font-size:13px;}
  .track .name .d{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);
    text-transform:uppercase;letter-spacing:.05em;margin-top:3px;}
  .lane{position:relative;padding:16px 0;
    background-image:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px 25%);
    background-position:0 0;background-size:100% 100%;}
  .lane .ev{position:absolute;top:22px;transform:translateX(-50%);cursor:default;}
  .lane .ev .pip{width:13px;height:13px;border-radius:50%;border:2.5px solid #fff;
    box-shadow:0 0 0 1.5px var(--line-strong),0 2px 5px rgba(0,0,0,.1);
    transition:transform .12s;}
  .lane .ev:hover .pip{transform:scale(1.25);}
  .lane .ev .tip{position:absolute;left:50%;transform:translateX(-50%);
    bottom:26px;background:var(--ink);color:#fff;font-size:12px;line-height:1.5;
    padding:10px 12px;border-radius:8px;width:240px;display:none;z-index:5;
    box-shadow:0 8px 24px rgba(0,0,0,.2);}
  .lane .ev:hover .tip{display:block;}
  .lane .ev .tip .td{font-family:var(--mono);font-size:10px;color:#c9c9d4;margin-top:6px;}
  .axis{display:grid;grid-template-columns:142px 1fr;border-top:1px solid var(--line);}
  .axis .ticks{display:flex;justify-content:space-between;padding:8px 10px;
    font-family:var(--mono);font-size:10px;color:var(--ink-3);}
  .map-empty,.lib-empty{color:var(--ink-3);font-size:13px;padding:32px 0;text-align:center;}
  .legend{display:flex;gap:16px;margin:16px 0 4px;font-size:12px;color:var(--ink-2);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}

  /* ---- library ---- */
  .lib-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .lib-filters input,.lib-filters select{font-family:var(--ui);font-size:13px;
    border:1px solid var(--line-strong);border-radius:6px;padding:7px 11px;background:var(--surface);}
  .lib-filters input:focus,.lib-filters select:focus{outline:none;border-color:var(--accent);}
  .lib-filters input{flex:1;min-width:200px;}
  .lib-row{display:grid;grid-template-columns:84px 1fr;gap:14px;
    padding:12px 14px;background:var(--surface);margin-bottom:4px;border-radius:8px;
    border:1px solid var(--line);transition:border-color .12s;}
  .lib-row:hover{border-color:var(--line-strong);}
  .lib-row .ld{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);}
  .lib-row .lw{font-weight:600;font-size:13.5px;}
  .lib-row .lmeta{font-size:11.5px;color:var(--ink-3);margin-top:5px;
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .lib-count{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-bottom:12px;}

  footer{max-width:960px;margin:0 auto;padding:20px 28px 40px;color:var(--ink-3);
    font-size:11.5px;font-family:var(--mono);border-top:1px solid var(--line);}
  @media(max-width:640px){
    .track,.axis{grid-template-columns:84px 1fr;}
    main{padding:18px;}
    .brief{flex-wrap:wrap;}
    .brief .stat{padding:11px 14px;min-width:auto;flex:1 0 44%;}
    .brief .stat.lead{flex-basis:100%;}
    .brief .v{font-size:15px;}
    .headline{font-size:21px;}
    .card .what{flex-direction:column;gap:8px;}
    .mini{flex-wrap:wrap;gap:8px;}
    .card .row{flex-direction:column;gap:1px;}
    .card .row .lab{min-width:auto;}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>

<header>
  <div class="brandbar">
    <span class="logo">SEO Signal Radar<span class="dot">.</span></span>
    <span class="thesis" id="thesis"></span>
  </div>
  <nav>
    <button data-view="today" class="active">Today</button>
    <button data-view="map">Algorithm Map</button>
    <button data-view="library">Source Library</button>
    <div class="range-group" style="margin-left:auto;display:flex;align-items:center;gap:6px;">
      <button class="range-btn active" data-range="1" style="font-family:var(--mono);font-size:11px;
        border:1.5px solid var(--line-strong);border-radius:8px;padding:5px 10px;cursor:pointer;
        background:var(--surface);color:var(--ink);outline:none;transition:all .15s;">1D</button>
      <button class="range-btn" data-range="3" style="font-family:var(--mono);font-size:11px;
        border:1.5px solid var(--line-strong);border-radius:8px;padding:5px 10px;cursor:pointer;
        background:var(--surface);color:var(--ink);outline:none;transition:all .15s;">3D</button>
      <button class="range-btn" data-range="7" style="font-family:var(--mono);font-size:11px;
        border:1.5px solid var(--line-strong);border-radius:8px;padding:5px 10px;cursor:pointer;
        background:var(--surface);color:var(--ink);outline:none;transition:all .15s;">7D</button>
      <select id="date-picker" style="font-family:var(--mono);font-size:12px;
        border:1.5px solid var(--line-strong);border-radius:8px;padding:6px 10px;
        background:var(--surface);color:var(--ink);cursor:pointer;outline:none;"></select>
    </div>
  </nav>
</header>

<main>
  <section id="view-today" class="view active"></section>
  <section id="view-map" class="view"></section>
  <section id="view-library" class="view"></section>

nfidence": "Confirmed", "impact": "P2", "section": "SERP & Algorithm Signals", "score": 75, "sources": [{"name": "glenngabe", "url": "https://x.com/glenngabe/status/2083533847573000650", "excerpt": "New format for Reddit coming -> Reddit is testing a new way to watch — and listen to — its viral posts “There is an emerging content type elsewhere on the internet of, basically, podcasts where people read Reddit content,” Huffman explained on the call.\" \"He’s right — on TikTok, for instance, there are 19.6 million posts labeled with the hashtag #reddit and another 9.9 million labeled #redditstories. Many of these feature a text-to-speech narration of a viral story published on Reddit paired with an unrelated video, like gameplay footage or cooking content.\" https://techcrunch.com/2026/07/31/reddit-is-testing-a-new-way-to-watch-and-listen-to-its-viral-posts/. New format for Reddit coming…", "author": "@glenngabe", "published": "2026-08-01T12:42:34+00:00", "source_type": "data_research"}]}], "Technical SEO Experiments": [{"what_happened": "Model Context Protocol 2.0 stateless specification released for AI agent data access | Model Context Protocol 2.0 无状态规范发布，优化 AI Agent 数据接入", "why_it_matters": "MCP 正在成为 AI Agent 与外部数据源交互的标准协议。未来网站可能需要提供 MCP 接口，让 AI Agent 直接、无状态地查询结构化数据，改变传统的网页检索模式。", "evidence": "Release of the 2026-07-28 Model Context Protocol (MCP) specification and tools like mcp-explorer.", "evidence_detail": "The rollout of MCP 2.0 introduces a stateless specification designed to simplify how LLMs and AI agents connect to data sources. Simon Willison's release of mcp-explorer and datasette-mcp demonstrates how developers can now expose structured databases directly to AI agents using this standardized protocol.", "who_it_affects": "SaaS / ecommerce / publisher / all", "what_to_do": "test Y", "confidence": "Data-backed", "impact": "P2", "section": "Technical SEO Experiments", "score": 80, "sources": [{"name": "cyberandy", "url": "https://x.com/cyberandy/status/20 chnical SEO Experiments", "score": 74, "sources": [{"name": "aleyda", "url": "https://x.com/aleyda/status/2083971896128012464", "excerpt": "🏖️ The Latest in SEO & AI Search News, Updates & Guides [From today's #SEOFOMO - August 2nd, 2026] 👇 * ​Google rolls out platform properties globally, plus a new social and video performance guide: It's time to optimize all your brand presence consistently across the web * Google Review Snippets Prohibit Fake or Undisclosed Incentivized Reviews: Incentivized reviews must be disclosed and fake shouldn't be featured * ​The Problem With unavailable_after - Google Might Not See Updated Dates: Google can’t process an updated expiry date if it doesn’t recrawl the page * ​What 13 Billion Google Searches Reveal About Zero-Click Behavior: Learn which destinations win clicks, and which ones Google…", "author": "@aleyda", "published": "2026-08-02T17:43:13+00:00", "source_type": "expert_analysis"}]}], "AI Search / GEO": [{"what_happened": "Study: AI Search citations are 70-80% third-party domains across SaaS, finance, and ecommerce | 研究：SaaS、金融和电商领域的 AI 搜索引用中，70-80% 均来自第三方域名", "why_it_matters": "证实了 AI 搜索（如 Google AI Mode, Gemini, ChatGPT）主要是一个第三方引用（Digital PR 与社交媒体）的问题，品牌官网仅占少数。不同行业和平台的引用来源偏好差异显著（如 SaaS 偏向社交，金融偏向媒体/对比，AI Mode 最偏向社交）。", "evidence": "data_research", "evidence_detail": "Aleyda Solis analyzed Semrush Enterprise data for the top 10 cited source domains of 15 leading brands across SaaS, ecommerce, and finance. The study found external domain citation shares of 82.3% for SaaS, 79.4% for finance, and 69.6% for ecommerce. It also noted that Google's AI Mode is highly social-led, while ChatGPT is more evaluative/written, and Gemini is mixed.", "who_it_affects": "SaaS / ecommerce / publisher / all", "what_to_do": "针对目标 AI 平台和行业属性，协同 Digital PR、社交媒体与 On-page SEO，在第三方高权重引用源（如 Reddit、行业媒体、对比网站）中建立品牌提及与协同验证。", "confidence": "Data-backed", "impact": "P1", "section": "AI Search / GEO", "score": 85, "sources": [{"name": "aleyda", "url": "ht w. And 'Preferred Sources' bubbling up my top publishers. If you work for a news or media publisher, take some time to review AIOs with Top Stories modules.", "author": "@glenngabe", "published": "2026-08-02T12:40:34+00:00", "source_type": "data_research"}]}], "Playbook: Worth Testing": [{"what_happened": "Playbook: Leverage Bing Merchant Center product feeds to capture free listings in Bing AI and ChatGPT | 玩法：利用 Bing Merchant Center 商品 Feed 捕获 Bing AI 和 ChatGPT 的免费商品列表流量", "why_it_matters": "随着 ChatGPT 和 Bing AI 深度整合商品 Feed，电商 AI SEO 的未来在于结构化商品数据。通过优化 Bing Merchant Center，可以直接影响 AI 搜索中的商品推荐和免费展示。", "evidence": "expert_analysis", "evidence_detail": "Brodie Clark conducted testing and compared Google and Bing Merchant Centers, highlighting a case study with significant results for free product listings on Bing. The analysis emphasizes ChatGPT's integration of product feeds, suggesting a transition toward relying solely on direct feed integrations for free product listings.", "who_it_affects": "ecommerce", "what_to_do": "导入并优化 Bing Merchant Center 的商品 Feed，确保数据完整性，并监控 Bing Webmaster Tools 中的免费商品列表表现。", "confidence": "Data-backed", "impact": "P2", "section": "Playbook: Worth Testing", "score": 80, "how_to_test": "将现有的 Google Merchant Center 商品 Feed 导入 Bing Merchant Center，启用 Free Product Listings，并优化商品属性（如品牌、价格、GTIN）。", "success_metric": "Bing Webmaster Tools 中 Free Listings 的曝光量/点击量，以及来自 ChatGPT/Bing AI 的引流。", "effort": "中等。需要配置 Feed 同步与属性映射，无技术风险。", "sources": [{"name": "brodieseo", "url": "https://x.com/brodieseo/status/2084110478008316307", "excerpt": "The future of Ecommerce AI SEO is in product feeds. This is the article to read to stay ahead of the trend. I spent many hours learning about and testing in Microsoft's Merchant Center so you don’t have to. There’s a case study in here that has some eye-opening results for free product listings on Bing. Within the article, I compare and contrast Google to Bing’s Merchant Center, showing steps for accessing key repor arch"}], "evidence_detail": "US District Judge Paul A. Engelmayer ruled that Reddit plausibly pleaded a conspiracy where SerpApi provided a product to circumvent Google's access controls and Perplexity AI paid for it. This decision allows the DMCA copyright violation lawsuit to proceed to the next stage, despite Google recently losing a separate DMCA case against SerpApi."}, {"date": "2026-08-02", "section": "SERP & Algorithm Signals", "what_happened": "Reddit tests text-to-speech and video formats for viral text posts | Reddit 测试文本转语音与视频格式，将热门贴文转化为“播客”", "why_it_matters": "Reddit 正在将平台上的高价值文本内容转化为音视频流，以迎合 TikTok 等平台的用户习惯。这可能会改变 Google 在视频/音频搜索结果中对 Reddit 内容的索引和呈现方式。", "evidence": "Reddit CEO Steve Huffman's statements during an earnings call regarding new content formats.", "who_it_affects": "publisher / UGC / international", "what_to_do": "monitor Z", "confidence": "Confirmed", "impact": "P2", "sources": [{"name": "glenngabe", "url": "https://x.com/glenngabe/status/2083533847573000650", "excerpt": "New format for Reddit coming -> Reddit is testing a new way to watch — and listen to — its viral posts “There is an emerging content type elsewhere on the internet of, basically, podcasts where people read Reddit content,” Huffman explained on the call.\" \"He’s right — on TikTok, for instance, there are 19.6 million posts labeled with the hashtag #reddit and another 9.9 million labeled #redditstories. Many of these feature a text-to-speech narration of a viral story published on Reddit paired with an unrelated video, like gameplay footage or cooking content.\" https://techcrunch.com/2026/07/31/reddit-is-testing-a-new-way-to-watch-and-listen-to-its-viral-posts/. New format for Reddit coming…", "author": "@glenngabe", "published": "2026-08-01T12:42:34+00:00", "source_type": "data_research"}], "evidence_detail": "Reddit is testing automated text-to-speech narration paired with video backgrounds to replicate the viral \"Reddit stories\" format popular on TikTok (which has over 19.6 million hashtag posts). This format allows users to watch and listen to viral text threads directly within Reddit's ecosystem."}, {"date": "2026-08-02", "section": "Technical SEO Experiments", "what_happened": "Model Context Protocol 2.0 stateless specification released for AI agent data access | Model Context Protocol 2.0 无状态规范发布，优化 AI Agent 数据接入", "why_it_matters": "MCP 正在成为 AI Agent 与外部数据源交互的标准协议。未来网站可能需要提供 MCP 接口，让 AI Agent 直接、无状态地查询结构化数据，改变传统的网页检索模式。", "evidence": "Release of the 2026-07-28 Model Context Protocol (MCP) specification and tools like mcp-explorer.", "who_it_affects": "SaaS / ecommerce / publisher / all", "what_to_do": "test Y", "confidence": "Data-backed", "impact": "P2", "sources": [{"name": "cyberandy", "url": "https://x.com/cyberandy/status/2083597404410921252", "excerpt": "Your MCP is going to be your new website.. Your MCP is going to be your new website. Simon Willison (@simonw) The new stateless MCP specification has rekindled my interest in MCP, and inspired some new projects, including mcp-explorer and datasette-mcp simonwillison.net/2026/Jul/3… Link Stateless MCP has recaptured my interest (and inspired mcp-explorer and datasette-mcp) Tuesday was Stateless MCP day—the rollout of MCP 2.0, or the 2026-07-28 Model Context Protocol specification to use the more formal but less memorable name. This is the", "author": "@cyberandy", "published": "2026-08-01T16:55:07+00:00", "source_type": "expert_vendor", "commercial_interest": true}], "evidence_detail": "The rollout of MCP 2.0 introduces a stateless specification designed to simplify how LLMs and AI agents connect to data sources. Simon Willison's release of mcp-explorer and datasette-mcp demonstrates how developers can now expose structured databases directly to AI agents using this standardized protocol."}, {"date": "2026-08-02", "section": "AI Search / GEO", "what_happened": "Google DeepMind launches Gemini Robotics ER 2 with native Google Search tool integration | Google 推出 Gemini Robotics ER 2，支持机器人原生调用 Google Search", "why_it_matters": "具身智能（Embodied AI）开始将 Google Search 作为其决策和规划的实时外部工具。这意味着未来的搜索流量将包含来自物理世界机器人（Agentic Traffic）的自动化查询。", "evidence": "Google DeepMind's official launch of the Gemini Robotics ER 2 \"embodied reasoning\" model.", "who_it_affects": "all", "what_to_do": "monitor Z", "confidence": "Confirmed", "impact": "P3", "sources": [{"name": "glenngabe", "url": "https://x.com/glenngabe/status/2083536416873545963", "excerpt": "So, we are running into problems with AI agents escaping containment, but we are also advancing AI models for robotics. I guess so the robots could go rogue at some point too? I think there was a movie about that in 1984... :) Don't get me wrong, I've been saying for a while that the convergence of AI and robotics will be HUGE... but it's still scary -> Introducing Gemini Robotics ER 2 \"That’s why today we’re launching Gemini Robotics ER 2, our most capable “embodied reasoning” model for robotics. Think of Gemini Robotics ER 2 as a high-level brain for robots. It allows robots to chat with humans, understand the physical world, and plan multi-step tasks. It then hands off motor execution to…", "author": "@glenngabe", "published": "2026-08-01T12:52:46+00:00", "source_type": "data_research"}], "evidence_detail": "Gemini Robotics ER 2 acts as a high-level brain for robots, handling multi-step task planning and handing off motor execution to lower-level VLA models. Crucially, the model can natively call tools like Google Search to retrieve real-time physical-world information during its reasoning process."}, {"date": "2026-08-02", "section": "AI Search / GEO", "what_happened": "OpenAI previews \"Astra\" AI model designed for long-running multi-agent tasks | OpenAI 向监管机构展示 “Astra” 模型，主打多 Agent 协同与长任务处理", "why_it_matters": "Astra 强调多 Agent 协同解决复杂、长期任务的能力。这类模型的大规模应用将大幅增加 Agent 自动在互联网上进行深度检索、比对和交互的频次，推动 Agentic SEO 的到来。", "evidence": "OpenAI CEO Sam Altman's demonstration of the \"Astra\" model family to policymakers in Washington, D.C.", "who_it_affects": "SaaS / publisher / all", "what_to_do": "monitor Z", "confidence": "Observed", "impact": "P3", "sources": [{"name": "glenngabe", "url": "https://x.com/glenngabe/status/2083534849134997857", "excerpt": "Multiple agents working together over a long period of time -> OpenAI Previews ‘Astra’ AI Model in DC \"OpenAI is preparing to release a new model family, tentatively using the name “Astra,” with improved abilities to complete long-running tasks, according to three people briefed on the plans.\" \"OpenAI CEO Sam Altman demonstrated Astra to policymakers and regulators in Washington, D.C., this week, according to the people. OpenAI touted its abilities to have multiple agents work together over a long period of time to solve particularly hard problems, which could be applied to a project or advanced math problem.\"…", "author": "@glenngabe", "published": "2026-08-01T12:46:32+00:00", "source_type": "data_research"}], "evidence_detail": "Briefings from three sources reveal that OpenAI is preparing to release \"Astra,\" a new model family optimized for completing long-running tasks. The model's core capability is orchestrating multiple AI agents to work together over extended periods to solve complex projects or advanced mathematical problems."}, {"date": "2026-08-02", "section": "Playbook: Worth Testing", "what_happened": "Use Link Density charts to audit editorial vs boilerplate inbound links | 使用链接密度图表审计编辑链接与样板链接", "why_it_matters": "区分高质量的“编辑内容内链接”（Editorial Links）与页眉/页脚/目录等“样板链接”（Boilerplate/Footer Links）对评估外链真实权重至关重要。", "evidence": "Majestic's Link Density charts in the Context and Pages reports.", "who_it_affects": "all", "what_to_do": "test Y", "confidence": "Data-backed", "impact": "P2", "sources": [{"name": "glenngabe", "url": "https://x.com/glenngabe/status/2083546425279848813", "excerpt": "If you're scanning inbound links for a site to determine editorial versus header/footer versus directory-like links, then Link "label": "December 2025 core update", "band": "High", "detail": "Core Update"}, {"date": "2026-08-04", "track": "official", "label": "August 2025 spam update", "band": "High", "detail": "Spam Update"}], "days_archived": 9, "run_meta": {"ran_at": "2026-08-04T08:41:46.417363+00:00", "sources": {"x": {"ok": 27, "total": 29, "failed_names": ["BingWMC", "JohnMu"], "items": 59}, "rss": {"ok": 7, "total": 11, "failed_names": ["Google Search Docs Updates", "SearchPilot Resources", "Search Engine Roundtable", "Search Engine Land"], "items": 11}, "google_status": {"items": 0}}, "candidates_fetched": 70, "candidates_fresh": 4, "llm_provider": ""}, "serp_connected": true, "source_warn_ratio": 0.7}</script>
<script>
const DATA = JSON.parse(document.getElementById("radar-data").textContent);
const HEATVAR = {Extreme:"--heat-extreme",High:"--heat-high",Elevated:"--heat-elevated",
  Normal:"--heat-normal",Unknown:"--heat-unknown"};
/* Escape untrusted text. Everything here comes from fetched third-party pages
   and tweets, and some of it lands inside href="…" attributes, so the double
   quote has to be covered — an unescaped one in a source URL would close the
   attribute and let the rest of the string become markup. (It was previously
   missing: the map had two ' keys and no ", which silently turned every
   double quote in a quoted excerpt into the string "undefined".) */
const ESCMAP = {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"};
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>ESCMAP[c]);
const heatColor = b => `var(${HEATVAR[b]||"--heat-unknown"})`;

document.getElementById("thesis").innerHTML =
  esc(DATA.thesis) + (DATA.thesis_zh?`<span class="zh">${esc(DATA.thesis_zh)}</span>`:"");
document.getElementById("footer").textContent =
  `${DATA.days_archived} days archived · ${DATA.library.length} signals · generated ${DATA.generated_at.slice(0,16).replace("T"," ")} UTC`;

/* ---------------- nav ---------------- */
document.querySelectorAll("nav button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    document.getElementById("view-"+b.dataset.view).classList.add("active");
  };
});

/* ---------------- date picker + range buttons ---------------- */
const ARCHIVE = DATA.archive || {};
const DATES = Object.keys(ARCHIVE).sort().reverse();
const picker = document.getElementById("date-picker");
let selectedDate = DATA.today?.date || (DATES[0] || "");
let selectedRange = 1; // 1, 3, or 7 days
DATES.forEach(d => {
  const opt = document.createElement("option");
  opt.value = d;
  opt.textContent = d;
  if (d === selectedDate) opt.selected = true;
  picker.appendChild(opt);
});
picker.onchange = () => { selectedDate = picker.value; renderToday(); };

// Range buttons
const rangeBtns = document.querySelectorAll(".range-btn");
rangeBtns.forEach(btn => {
  btn.onclick = () => {
    rangeBtns.forEach(b => {
      b.classList.remove("active");
      b.style.background = "var(--surface)";
      b.style.borderColor = "var(--line-strong)";
      b.style.color = "var(--ink)";
    });
    btn.classList.add("active");
    btn.style.background = "var(--ink)";
    btn.style.borderColor = "var(--ink)";
    btn.style.color = "#fff";
    selectedRange = parseInt(btn.dataset.range);
    renderToday();
  };
});
// Style the active button on load
(function(){
  const active = document.querySelector(".range-btn.active");
  if(active){active.style.background="var(--ink)";active.style.borderColor="var(--ink)";active.style.color="#fff";}
})();

/* Get the N most recent days ending at selectedDate */
function getRangeRecords(days) {
  const idx = DATES.indexOf(selectedDate);
  if (idx < 0) return [];
  return DATES.slice(idx, idx + days).reverse(); // chronological
}

/* Merge multiple days' records into one virtual record for display */
function mergeRecords(recs) {
  if (recs.length === 1) return recs[0];
  const merged = {date: `${recs[0].date} ~ ${recs[recs.length-1].date}`, sections: {}, headline: ""};
  let totalDropped = 0;
  recs.forEach(r => {
    totalDropped += r.dropped_count || 0;
    Object.entries(r.sections || {}).forEach(([sec, arr]) => {
      if (!merged.sections[sec]) merged.sections[sec] = [];
      // Tag each signal with its source date for multi-day view
      arr.forEach(s => {
        if (sec === "Today's Action Items") {
          merged.sections[sec].push(s);
        } else {
          merged.sections[sec].push({...s, _date: r.date});
        }
      });
    });
  });
  merged.dropped_count = totalDropped;
  // Use the latest day's headline
  merged.headline = recs[recs.length-1]?.headline || "";
  merged.serp = recs[recs.length-1]?.serp;
  merged.confirmed_updates = recs.flatMap(r => r.confirmed_updates || []);
  return merged;
}

/* ---------------- Today ---------------- */
function tag(imp){return imp?`<span class="tag ${esc(imp)}">${esc(imp)}</span>`:"";}
function confTag(c){return c?`<span class="tag conf">${esc(c)}</span>`:"";}
/* Shown when the pipeline could not verify a single source URL for a signal.
   Silence here would be worse than the warning: an unlinked card looks exactly
   like one we simply didn't bother to cite. */
function unverTag(s){return s.unverified?`<span class="tag unver" title="No source URL could be verified against the candidate pool">unverified</span>`:"";}

function morningBrief(rec){
  const sigs=[];
  Object.entries(rec.sections||{}).forEach(([sec,arr])=>{
    if(sec!=="Today's Action Items") arr.forEach(s=>{if(s.what_happened)sigs.push(s);});
  });
  const impacts=sigs.map(s=>s.impact||"");
  const top=["P0","P1","P2","P3"].find(p=>impacts.includes(p))||"—";
  const confirmed=(rec.sections?.["Confirmed Search Updates"]||[]).length>0;
  const band=(rec.serp||{}).global_band||"Unknown";
  const testable=impacts.filter(i=>i==="P0"||i==="P1"||i==="P2").length;
  return {n:sigs.length,top,confirmed,band,testable};
}

/* Source health strip. Silent-failure guard: a dead Nitter and a quiet news
   day produce the same short digest, so coverage has to be visible. */
function healthStrip(rec){
  const rm=rec.run_meta||{};
  const src=rm.sources||{};
  if(!src.x&&!src.rss) return "";
  const parts=[];let worst=0;  // 0 ok, 1 degraded, 2 down
  [["X",src.x],["RSS",src.rss]].forEach(([label,h])=>{
    if(!h||!h.total) return;
    const ratio=h.ok/h.total;
    if(h.ok===0) worst=2; else if(ratio<(DATA.source_warn_ratio??0.7)) worst=Math.max(worst,1);
    parts.push(`<span class="hitem">${label} ${h.ok}/${h.total}</span>`);
  });
  if(!parts.length) return "";
  const cls=worst===2?"down":(worst===1?"warn":"");
  let note="";
  if(worst===2) note="One source layer is completely unavailable — today's digest is NOT representative.";
  else if(worst===1) note="Reduced source coverage — today may be thinner than reality.";
  const failed=[...(src.x?.failed_names||[]),...(src.rss?.failed_names||[])];
  if(worst&&failed.length) note+=` Unreachable: ${failed.slice(0,6).join(", ")}`;
  return `<div class="health ${cls}"><span class="hdot"></span>
    <span class="hitem">Sources</span>${parts.join("")}
    ${note?`<span class="hnote">${esc(note)}</span>`:""}</div>`;
}

function renderToday(){
  const rangeRecs = getRangeRecords(selectedRange);
  const rec = selectedRange === 1 ? (ARCHIVE[selectedDate] || DATA.today || {}) : mergeRecords(rangeRecs);
  const el=document.getElementById("view-today");
  if(!rec.date){el.innerHTML=`<p class="lib-empty">No daily report yet. Run <code>python main.py daily</code> first.</p>`;return;}
  const b=morningBrief(rec);
  const isMultiDay = selectedRange > 1;
  const isLatest = rec.date === (DATA.today?.date || "");
  let h=`<div class="date-label">${esc(rec.date)}${isMultiDay?"":(isLatest?"":" (historical)")}</div>`;
  const urgent=(b.top==="P0");
  // SERP sources are manual adapters by default. Printing "Unknown" invited the
  // reading "calm"; when nothing is wired we say so instead.
  const serpLive=DATA.serp_connected&&b.band&&b.band!=="Unknown";
  const serpCell=serpLive
    ? `<span class="dot-heat" style="background:${heatColor(b.band)}"></span>${esc(b.band)}`
    : `<span style="color:var(--ink-3);font-size:12px;">未接入 / not connected</span>`;
  h+=`<div class="brief">
      <div class="stat lead${urgent?" urgent":""}"><span class="k">Top priority</span><span class="v">${esc(b.top)}</span></div>
      <div class="stat"><span class="k">Signals</span><span class="v">${b.n}</span></div>
      <div class="stat"><span class="k">To act / test</span><span class="v">${b.testable}</span></div>
      <div class="stat"><span class="k">Confirmed update</span><span class="v">${b.confirmed?"Yes":"No"}</span></div>
      <div class="stat"><span class="k">SERP heat</span><span class="v">${serpCell}</span></div>
    </div>`;
  h+=healthStrip(selectedRange===1?(ARCHIVE[selectedDate]||DATA.today||{}):(rangeRecs.length?ARCHIVE[rangeRecs[rangeRecs.length-1]]||{}:{}));
  if(rec.headline) h+=`<div class="headline">${esc(rec.headline)}</div>`;
  h+=serpWeather(rec.serp);

  /* Action Items first */
  const actions=rec.sections?.["Today's Action Items"];
  if(actions&&actions.length){
    h+=`<div class="actions-card"><h2>${isMultiDay?"Action Items":"Today's Action Items"}</h2><ul>`+
      actions.map(s=>`<li>${tag(s.impact)}<span>${esc(s.what_to_do)}</span></li>`).join("")+
      `</ul></div>`;
  }

  (DATA.sections||[]).forEach(sec=>{
    if(sec==="Today's Action Items") return;
    const arr=(rec.sections||{})[sec];
    if(!arr||!arr.length)return;
    h+=`<h2 class="section">${esc(sec)} <span class="count">${arr.length}</span></h2>`;
    arr.forEach(s=>{
      const imp=(s.impact||"").toUpperCase();
      h+=(imp==="P3") ? miniRow(s, isMultiDay) : signalCard(s, isMultiDay);
    });
  });
  if(rec.dropped_count) h+=`<p class="date-label" style="margin-top:20px">Filtered out ${rec.dropped_count} lower-value candidates.</p>`;
  el.innerHTML=h;
}

/* Evidence expansion: the LLM's longer write-up, then the verbatim source
   text. Excerpt-first in spirit — the quote is the part that cannot have been
   fabricated, since it's copied from the fetched item, so it's what settles
   any doubt about the summary above it. */
function evidencePanel(s){
  const detail=s.evidence_detail?`<div class="edetail">${esc(s.evidence_detail)}</div>`:"";
  const quotes=(s.sources||[]).filter(x=>x.excerpt).map(x=>{
    const bits=[];
    if(x.author) bits.push(esc(x.author));
    if(x.published) bits.push(esc(String(x.published).slice(0,10)));
    if(x.source_type) bits.push(`<span class="qtier">${esc(String(x.source_type).replace(/_/g," "))}</span>`);
    // A vendor benchmarking their own product is context the reader needs to
    // weigh the number, so it travels with the quote rather than being buried.
    if(x.commercial_interest) bits.push(`<span class="qci">commercial interest</span>`);
    return `<div class="quote">
      <div class="qhead">${bits.join("")}</div>
      <div class="qtext">${esc(x.excerpt)}</div>
      ${x.url?`<a class="qlink" href="${esc(x.url)}" target="_blank" rel="noopener">View original ↗</a>`:""}
    </div>`;
  }).join("");
  if(!detail&&!quotes) return "";
  const n=(s.sources||[]).filter(x=>x.excerpt).length;
  const label=n?`Evidence · ${n} source${n===1?"":"s"}`:"Evidence detail";
  return `<details class="eviexp"><summary>${label}</summary>
    <div class="evibody">${detail}${quotes}</div></details>`;
}

function signalCard(s, multiDay){
  const imp=s.impact||"";
  const row=(lab,key)=> s[key]?`<div class="row"><span class="lab">${lab}</span><span>${esc(s[key])}</span></div>`:"";
  const srcs=(s.sources||[]).map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name||"source")} ↗</a>`).join("");
  const recipe=[row("Test","how_to_test"),row("Measure","success_metric"),
                row("Effort","effort")].join("");
  const testbox=recipe.trim()?`<div class="testbox">${recipe}</div>`:"";
  const dateTag = (multiDay && s._date) ? `<span class="tag" style="color:var(--ink-3);background:var(--surface-strong);border:1px solid var(--line);font-family:var(--mono);">${esc(s._date)}</span>` : "";
  return `<div class="card ${esc(imp)}">
    <div class="what"><span class="wtext">${esc(s.what_happened)}</span>
      <span class="badges">${dateTag}${tag(s.impact)}${confTag(s.confidence)}${unverTag(s)}</span></div>
    ${row("Why","why_it_matters")}${row("Evidence","evidence")}
    ${row("Affects","who_it_affects")}${row("Action","what_to_do")}
    ${evidencePanel(s)}
    ${testbox}
    ${srcs?`<div class="srcs">${srcs}</div>`:""}
  </div>`;
}

/* Low-priority signals: one scannable line, not a full card. */
function miniRow(s, multiDay){
  const src=(s.sources||[])[0];
  const link=src?`<a class="msrc" href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.name||"source")} ↗</a>`:"";
  const why=s.why_it_matters?` — ${esc(s.why_it_matters)}`:"";
  const dateTag = (multiDay && s._date) ? `<span style="font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-right:6px;">${esc(s._date)}</span>` : "";
  return `<div class="mini">${tag(s.impact)}${dateTag}
    <span class="mtext"><b>${esc(s.what_happened)}</b>${why}</span>${link}</div>`;
}

function serpWeather(serp){
  if(!serp||!serp.global_band) return "";
  const cell=(k,band,v)=>`<div class="serp-cell ${esc(band||'')}"><div class="k">${k}</div>
    <div class="v">${band?`<span class="dot-heat" style="background:${heatColor(band)}"></span>`:""}${esc(v)}</div></div>`;
  const av=serp.anomalous_verticals&&serp.anomalous_verticals.length?serp.anomalous_verticals.join(", "):"none";
  let h=`<div class="serp-grid">
    ${cell("Global Heat",serp.global_band,`${serp.global_band} (${serp.global_heat??"?"})`)}
    ${cell("Vertical Heat",serp.vertical_band,`${serp.vertical_band??"?"} (${serp.vertical_heat??"?"})`)}
    ${cell("Source Agreement","",serp.source_agreement??"n/a")}
    ${cell("Affected Verticals","",av)}
    </div>`;
  if(serp.quadrant) h+=`<div class="serp-note">${esc(serp.quadrant)}. ${esc(serp.interpretation||"")}</div>`;
  return h;
}

/* ---------------- Algorithm Map ---------------- */
const TRACKS=[
  {key:"official",t:"Official",d:"Google confirms"},
  {key:"external",t:"External flux",d:"SERP volatility"},
  {key:"community",t:"Community",d:"expert signals"},
];
let mapRange=(DATA.map_ranges&&DATA.map_ranges[1])||"30D";

function rangeDays(r){return {"7D":7,"30D":30,"90D":90,"1Y":365}[r]||30;}

function renderMap(){
  const el=document.getElementById("view-map");
  const days=rangeDays(mapRange);
  const now=new Date();
  const start=new Date(now.getTime()-days*864e5);
  const ev=(DATA.map_events||[]).filter(e=>{
    const d=new Date(e.date+"T00:00:00Z"); return d>=start && d<=now;
  });
  let h=`<div class="map-controls">`+
    (DATA.map_ranges||[]).map(r=>`<button data-r="${r}" class="${r===mapRange?"active":""}">${r}</button>`).join("")+`</div>`;
  h+=`<div class="legend">
    <span><span class="dot-heat" style="background:var(--heat-extreme)"></span>Extreme</span>
    <span><span class="dot-heat" style="background:var(--heat-high)"></span>High</span>
    <span><span class="dot-heat" style="background:var(--heat-elevated)"></span>Elevated</span>
    <span><span class="dot-heat" style="background:var(--heat-normal)"></span>Normal</span></div>`;

  // Always draw the three lanes, even with no events: the lanes themselves
  // carry information (which layers exist, and which have no source wired).
  // Hiding them behind a single "no events" message was how the permanently
  // empty External-flux track stayed invisible.
  if(!ev.length){
    h+=`<div class="map-empty">No timeline events in the last ${esc(mapRange)}. Confirmed updates, SERP flux and community signals appear here as the archive fills in.</div>`;
  }
  {
    const span=Math.max(1,(now-start));
    const pos=d=>((new Date(d+"T00:00:00Z")-start)/span)*100;
    TRACKS.forEach(tr=>{
      const mine=ev.filter(e=>e.track===tr.key);
      // An empty lane silently asserts "nothing happened". For External flux
      // that's wrong: the SERP adapters are manual, so no pips usually means
      // no data source at all. Label it rather than implying calm.
      const noData=(tr.key==="external"&&!DATA.serp_connected);
      h+=`<div class="track${noData?" nodata":""}"><div class="name"><div class="t">${tr.t}</div><div class="d">${tr.d}</div></div><div class="lane">`;
      if(noData){
        h+=`<div class="nd">未接入 / no volatility source connected — add readings with <code>main.py serp-add</code></div>`;
      }
      mine.forEach(e=>{
        const left=Math.min(99,Math.max(1,pos(e.date)));
        h+=`<div class="ev" style="left:${left}%">
          <div class="pip" style="background:${heatColor(e.band)}"></div>
          <div class="tip">${esc(e.label)}<div class="td">${esc(e.date)} · ${esc(e.detail||e.band)}</div></div>
        </div>`;
      });
      h+=`</div></div>`;
    });
    h+=`<div class="axis"><div></div><div class="ticks">
      <span>${start.toISOString().slice(0,10)}</span><span>${now.toISOString().slice(0,10)}</span></div></div>`;
  }
  el.innerHTML=h;
  el.querySelectorAll(".map-controls button").forEach(b=>{
    b.onclick=()=>{mapRange=b.dataset.r;renderMap();};
  });
}

/* ---------------- Source Library ---------------- */
let libState={q:"",section:"",confidence:"",impact:"",vertical:""};
function renderLibrary(){
  const el=document.getElementById("view-library");
  const secs=[...new Set(DATA.library.map(s=>s.section))];
  const confs=["Confirmed","Data-backed","Observed","Speculative"];
  const imps=["P0","P1","P2","P3"];
  const opt=(v,cur)=>`<option value="${esc(v)}"${v===cur?" selected":""}>${esc(v||"")}</option>`;
  let h=`<div class="lib-filters">
    <input id="lq" placeholder="Search signals…" value="${esc(libState.q)}">
    <select id="lsec"><option value="">All sections</option>${secs.map(s=>opt(s,libState.section)).join("")}</select>
    <select id="lconf"><option value="">Any confidence</option>${confs.map(c=>opt(c,libState.confidence)).join("")}</select>
    <select id="limp"><option value="">Any priority</option>${imps.map(i=>opt(i,libState.impact)).join("")}</select>
    <select id="lvert"><option value="">Any vertical</option>${(DATA.verticals||[]).map(v=>opt(v,libState.vertical)).join("")}</select>
  </div><div id="lib-results"></div>`;
  el.innerHTML=h;
  const bind=(id,key)=>{const n=document.getElementById(id);
    n.oninput=n.onchange=()=>{libState[key]=n.value;drawLibResults();};};
  bind("lq","q");bind("lsec","section");bind("lconf","confidence");bind("limp","impact");bind("lvert","vertical");
  drawLibResults();
}
function drawLibResults(){
  const q=libState.q.toLowerCase();
  let rows=DATA.library.filter(s=>{
    if(libState.section&&s.section!==libState.section)return false;
    if(libState.confidence&&s.confidence!==libState.confidence)return false;
    if(libState.impact&&s.impact!==libState.impact)return false;
    if(libState.vertical&&!(s.who_it_affects||"").toLowerCase().includes(libState.vertical.toLowerCase()))return false;
    if(q){
      // Search the expanded detail and the verbatim excerpts too. This is what
      // makes the Library a real archive: months later you remember a phrase
      // from a study, not the headline we wrote about it.
      const hay=(s.what_happened+" "+s.why_it_matters+" "+s.evidence+" "+s.what_to_do
        +" "+(s.evidence_detail||"")
        +" "+(s.sources||[]).map(x=>(x.excerpt||"")+" "+(x.author||"")).join(" ")).toLowerCase();
      if(!hay.includes(q))return false;
    }
    return true;
  }).sort((a,b)=>b.date.localeCompare(a.date));
  let h=`<div class="lib-count">${rows.length} signal${rows.length===1?"":"s"}</div>`;
  if(!rows.length){h+=`<div class="lib-empty">No matching signals.</div>`;}
  rows.slice(0,400).forEach(s=>{
    const srcs=(s.sources||[]).map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name||"source")} ↗</a>`).join(" ");
    h+=`<div class="lib-row">
      <div class="ld">${esc(s.date)}</div>
      <div><div class="lw">${esc(s.what_happened)} <span class="badges">${tag(s.impact)}${confTag(s.confidence)}${unverTag(s)}</span></div>
        <div class="lmeta"><span>${esc(s.section)}</span>${s.who_it_affects?`<span>· ${esc(s.who_it_affects)}</span>`:""}${srcs?`<span>· ${srcs}</span>`:""}</div>
        ${evidencePanel(s)}
      </div></div>`;
  });
  document.getElementById("lib-results").innerHTML=h;
}

renderToday();renderMap();renderLibrary();
</script>
