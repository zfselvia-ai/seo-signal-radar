 Cloudflare Dashboard 启用 Monetization Gateway，为特定 API 端点或内容路径设置 x402 定价，对比启用前后 agent 流量与直接收入", "success_metric": "agent 请求转化率 × 平均请求收入；对比免费抓取 vs 付费 agent 的引用频次", "effort": "中 — 需配置 x402 合约与定价策略；风险是早期 agent 生态渗透率有限", "evidence_detail": "Cloudflare's Monetization Gateway uses the x402 payment protocol to let content owners and MCP servers charge AI agents per request. AWS AgentCore Payments is now generally available, meaning enterprises building agents on Bedrock can transact with that supply from launch. This is infrastructure-level: it doesn't change rankings but creates a new economic layer for agentic access."}, {"date": "2026-08-19", "section": "AI Search / GEO", "what_happened": "ChatGPT fan-out queries still use site:old-domain for brands 6+ months post-migration | ChatGPT 域名迁移半年后仍引用旧域名", "why_it_matters": "AI search 的记忆滞后于传统 SEO 迁移周期，旧域名持续获得 brand mention 而新域名被排除在 fan-out 结果外", "evidence": "Practitioner observation by Lily Ray with specific case (URL withheld)", "who_it_affects": "all", "what_to_do": "迁移后持续监控 ChatGPT/Perplexity 的引用域名；在旧域名保留 301 + 强化新域名 brand signals", "confidence": "Observed", "impact": "P1", "sources": [{"name": "@lilyraynyc", "url": "https://x.com/lilyraynyc/status/2089821023877345459", "excerpt": "I can't share the URL, but I just found an example of ChatGPT using fan-out queries that contained site: for the *old domain* for a well-known brand that migrated its domain over 6 months ago. 👀 The migration was handled well from an SEO perspective, but the old domain name must be stored in ChatGPT's memory. The worst part? When you use Google or Bing to do a site: search that is limited to the old version of the domain, the new domain's URLs don't show up in the search results. So your shiny new URLs likely won't be part of the response unless they are discovered through another fan-out query or another part of the search 🫠. I can't share the URL, but I just found an example of ChatGPT…", "author": "@lilyraynyc", "published": "2026-08-18T21:05:33+00:00", "source_type": "expert_analysis"}], "how_to_test": "定期在 ChatGPT/Perplexity 查询品牌相关问题时检查引用来源域名；使用 site:old-domain 和 site:new-domain 对比 fan-out 覆盖度", "success_metric": "新域名在 AI 引用中的占比提升；旧域名引用占比下降", "effort": "低 — 主要是监控与报告；风险是平台侧记忆更新不可控", "evidence_detail": "A well-known brand that migrated domains over 6 months ago was found in ChatGPT's fan-out queries using site:old-domain. The migration followed SEO best practices, but ChatGPT's memory retains the old domain. Critical limitation: when the fan-out uses site:old-domain, new domain URLs do not appear in those search results, so they are excluded from the AI response unless discovered through other queries."}, {"date": "2026-08-19", "section": "Playbook: Worth Testing", "what_happened": "Aleyda Solis publishes citation study: AI search as 3rd-party citation + on-page corroboration problem across SaaS, ecommerce, finance | Aleyda Solis 发布 AI 搜索引用模式跨行业研究", "why_it_matters": "提供可复制的 GEO 策略框架：social/digital PR 与 on-page 证据需协同，且 playbook 因垂直而异", "evidence": "Data research across three verticals by established SEO expert", "who_it_affects": "SaaS / ecommerce / publisher", "what_to_do": "按垂直行业审计引用来源组合；将 trade pubs 和工具品牌纳入 digital PR 目标", "confidence": "Speculative", "impact": "P2", "sources": [], "how_to_test": "选取 20-30 个核心关键词，记录 ChatGPT/Perplexity/Claude 的引用来源类型（trade pub, social, brand site, review site 等），对比自身 on-page 内容是否 corroborate 这些来源的 claims", "success_metric": "目标关键词的 AI 引用率提升；引用来源多样性指数变化", "effort": "中高 — 需跨平台手动审计或开发监控工具；风险是平台引用机制变化快", "evidence_detail": "The study analyzes how AI search citations work across SaaS, ecommerce, and finance, finding that third-party citations require on-page corroboration to maximize visibility. The source mix varies by vertical and platform, making social media and digital PR essential workstreams. Published on aleydasolis.com with methodology implied but not fully detailed in the candidate text.", "unverified": true}, {"date": "2026-08-20", "section": "Official Explanations", "what_happened": "John Mueller: Google does not roll out updates prior to announcement | John Mueller确认：Google不会在正式宣布前推出更新", "why_it_matters": "澄清了近期关于8月垃圾内容更新提前推出的误解，避免SEO对排名波动的错误归因。", "evidence": "John Mueller via Search Engine Roundtable/Search Engine Journal: Google does not release updates prior to announcing them; pre-announcement volatility is from other system changes.", "who_it_affects": "all", "what_to_do": "不要将8月19日前的排名波动归因于本次垃圾内容更新；继续监控但避免错误诊断", "confidence": "Confirmed", "impact": "P1", "sources": [{"name": "Glenn Gabe", "url": "https://x.com/glenngabe/status/2090047816106221716", "excerpt": "Lots of confusion about this. Google has said many times that what you saw BEFORE the update rolls out was NOT the update... Remember, Google pushes many other changes all the time, including what they call \"smaller core updates\" which is when they update a system, or several, outside of a core update. So for the August spam update, what you saw recently was not the spam update.. Lots of confusion about this. Google has said many times that what you saw BEFORE the update rolls out was NOT the update... Remember, Google pushes many other changes all the time, including what they call \"smaller core updates\" which is when they update a system, or several, outside of a core update. So for the…", "author": "@glenngabe", "published": "2026-08-19T12:06:45+00:00", "source_type": "data_research"}], "evidence_detail": "John Mueller explicitly stated that Google does not release updates like the spam update before their official announcement. This clarifies that ranking volatility observed before the August 2026 spam update announcement was due to other system changes (including 'smaller core updates'), not the spam update itself. Glenn Gabe and Barry Schwartz both amplified this clarification. This is a recurring Google communication pattern but important for correct diagnosis of ranking changes."}, {"date": "2026-08-20", "section": "SERP & Algorithm Signals", "what_happened": "Google expands generative UI from AI Mode to AI Overviews | Google将生成式UI从AI Mode扩展至AI Overviews", "why_it_matters": "AI Overviews的视觉呈现正在从纯文本摘要转向交互式工具布局，影响传统搜索结果页的流量分配和点击率优化空间。", "evidence": "Search Engine Journal reports generative UI, which builds custom visual layouts and interactive tools, has started reaching AI Overviews after launching in AI Mode last year.", "who_it_affects": "all", "what_to_do": "监控AI Overviews中你的品牌查询是否出现交互式元素；评估现有结构化数据是否支持富媒体展示", "confidence": "Confirmed", "impact": "P2", "sources": [{"name": "Search Engine Journal", "url": "https://www.searchenginejournal.com/google-expands-generative-ui-beyond-ai-mode-into-ai-overviews/586452/", "excerpt": "Google Expands Generative UI Beyond AI Mode Into AI Overviews via @sejournal, @MattGSouthern. Google's generative UI, which builds custom visual layouts and interactive tools, has started reaching AI Overviews after launching in AI Mode last year. The post Google Expands Generative UI Beyond AI Mode Into AI Overviews appeared first on Search Engine Journal .", "author": "Search Engine Journal", "published": "2026-08-19T19:00:27+00:00", "source_type": "trade_news"}], "evidence_detail": "Google's generative UI creates custom visual layouts and interactive tools rather than standard text snippets. The feature launched in AI Mode (the conversational search interface) and is now expanding to AI Overviews (the standard search result summaries). This represents a shift from text-based answers to richer, more interactive formats. No traffic impact data is yet available. The expansion appears gradual rather than universal."}, {"date": "2026-08-20", "section": "SERP & Algorithm Signals", "what_happened": "Microsoft Advertising rolls out AI Max globally | Microsoft Advertising全球推出AI Max功能", "why_it_matters": "AI驱动的广告自动化进一步扩展，搜索广告竞争格局持续演变，需关注竞价策略调整。", "evidence": "Search Engine Journal reports Microsoft Advertising rolling out AI Max globally with expanded Search matching, text customization, URL expansion and new advertiser controls.", "who_it_affects": "ecommerce / SaaS", "what_to_do": "评估AI Max功能是否适合你的Bing Ads账户；测试自动文本生成与人工文案的CTR对比", "confidence": "Confirmed", "impact": "P2", "sources": [{"name": "Search Engine Journal", "url": "https://www.searchenginejournal.com/microsoft-advertising-rolls-out-ai-max-globally/586459/", "excerpt": "Microsoft Advertising Rolls Out AI Max Globally via @sejournal, @brookeosmundson. Microsoft Advertising is rolling out AI Max globally, bringing expanded Search matching, text customization, URL expansion and new advertiser controls to Search campaigns. The post Microsoft Advertising Rolls Out AI Max Globally appeared first on Search Engine Journal .", "author": "Search Engine Journal", "published": "2026-08-19T19:41:53+00:00", "source_type": "trade_news"}], "evidence_detail": "Microsoft Advertising's AI Max, previously in limited testing, is now globally available. Features include: expanded Search matching (broader query coverage), text customization (AI-generated ad copy variations), URL expansion (dynamic landing pages), and new advertiser controls for brand safety and placement exclusions. This represents Microsoft's counter to Google's AI-powered campaign features. Impact on CPCs and competitive dynamics in Bing Ads ecosystem is yet unmeasured."}, {"date": "2026-08-20", "section": "AI Search / GEO", "what_happened": "ChatGPT Search massively adopted site: operator fan-outs on Aug 8; Reddit citations fell 86% | ChatGPT搜索8月8日起大规模使用site:限定查询，Reddit引用量暴跌86%", "why_it_matters": "OpenAI正在用'官方域名优先'的粗暴信任过滤替代开放网页检索，非官方站点在ChatGPT Search中的可见性急剧下降，GEO策略需重新校准。", "evidence": "Promptwatch data: site: searches jumped from 0.4% to ~17% of background queries on Aug 8; Reddit citations fell from 3.83% to 0.52% between Aug 14-17 per Search Engine Land/SEJ reporting on Promptwatch and Suganthan analysis.", "who_it_affects": "publisher / ecommerce / SaaS", "what_to_do": "测试你的品牌是否出现在ChatGPT的品类查询中；确保官网在site:查询下能直接提供价格、规格等关键信息；监控第三方评测和媒体报道中的品牌提及", "confidence": "Data-backed", "impact": "P1", "sources": [{"name": "Lily Ray / Promptwatch / Suganthan", "url": "https://x.com/lilyraynyc/status/2090193398766739641", "excerpt": "RT by @lilyraynyc: ChatGPT Search changed how it looks things up on 8 August. It started using site: at scale. Promptwatch saw those domain-scoped searches jump from about 0.4% of background queries to about 17% in a day. Same week, the queries started saying “official” more often. @suganthan has been reading the traffic: one search that already names the brands, then a site: look-up on each brand’s own website for pricing and specs. Reddit’s share of citations inside ChatGPT Search then fell from 3.83% to 0.52% between 14 and 17 August. The first slip was 8 August, the same day as the site: change. Google’s AI Overviews and AI Mode did not do this. So this is not “Reddit stopped working.”…", "author": "@lilyraynyc", "published": "2026-08-19T21:45:14+00:00", "source_type": "expert_analysis"}, {"name": "Search Engine Journal", "url": "https://www.searchenginejournal.com/why-reddits-chatgpt-citation-drop-isnt-fully-explained/586479/", "excerpt": "Why Reddit’s ChatGPT Citation Drop Isn’t Fully Explained via @sejournal, @MattGSouthern. New Promptwatch data shows a sharp drop in Reddit's ChatGPT Search citations this month. The post Why Reddit&#8217;s ChatGPT Citation Drop Isn&#8217;t Fully Explained appeared first on Search Engine Journal .", "author": "Search Engine Journal", "published": "2026-08-19T22:03:26+00:00", "source_type": "trade_news"}], "how_to_test": "Ask your core category question 5 times in ChatGPT Search, note which brands appear; then run site:yourdomain.com for key product pages and check if pricing/specs render in plain HTML without JS dependency", "success_metric": "Brand mention rate in ChatGPT Search responses for target category queries; site:yourdomain.com crawl success rate for key pages", "effort": "Medium effort (2-4 hours audit); low risk", "evidence_detail": "Promptwatch tracked the site: operator spike in real-time. The 0.4%→17% jump occurred in a single day (August 8). Reddit's citation share inside ChatGPT Search dropped from 3.83% to 0.52% between August 14-17 — an 86% decline. Multiple independent observers (Lily Ray, Suganthan, Search Engine Land) confirmed the correlation. The mechanism appears to be: ChatGPT first generates a search naming brands, then runs site: lookups on each brand's own domain for pricing/specs. This privileges .gov, .org, and established brand domains while excluding forums and lesser-known publishers. Caveat: the 'official domain' guess is sometimes wrong, hitting parked sites."}, {"date": "2026-08-20", "section": "AI Search / GEO", "what_happened": "ChatGPT 5.6 reduces fan-out queries and citations for listicles, comparisons | ChatGPT 5.6减少列表、对比类内容的fan-out查询和引用", "why_it_matters": "GEO优化的列表和对比内容可能正被OpenAI降权，需重新评估内容格式策略。", "evidence": "Peec AI data shared by Lily Ray: ChatGPT 5.6 reducing fan-out queries and citations for listicles and comparison content.", "who_it_affects": "publisher / ecommerce / SaaS", "what_to_do": "监控你的列表/对比内容在ChatGPT中的引用情况；测试深度单主题内容替代列表格式的表现", "confidence": "Observed", "impact": "P2", "sources": [{"name": "Lily Ray / Peec AI", "url": "https://x.com/lilyraynyc/status/2090256147441746150", "excerpt": "New Peec AI data from suggests ChatGPT 5.6 is reducing fan-out queries and citations for listicles, comparisons. Are they cracking down on GEO-focused articles? @tomekrudzki @peecAI. New Peec AI data from suggests ChatGPT 5.6 is reducing fan-out queries and citations for listicles, comparisons. Are they cracking down on GEO-focused articles? @tomekrudzki @peecAI Article ChatGPT is Changing Which Page Types it Cites in AI Responses (New Peec AI Data) Wow, I found this VERY interesting: Tomek Rudzki from Peec AI just shared some brand new data with me regarding ChatGPT&apos;s evolving search behavior with the launch of 5.6. Earlier this week, I", "author": "@lilyraynyc", "published": "2026-08-20T01:54:35+00:00", "source_type": "expert_analysis"}], "evidence_detail": "Tomek Rudzki from Peec AI shared data with Lily Ray indicating ChatGPT 5.6 has reduced fan-out queries and citations specifically for listicles and comparison-type content. This follows the broader pattern of OpenAI reducing reliance on forum/reddit content and affiliate-style comparison pages. The data source (Peec AI) is a specialized monitoring tool, but specific methodology and sample size were not detailed in the social post. Treat as directional signal requiring independent verification."}, {"date": "2026-08-20", "section": "Research & Retrieval", "what_happened": "Study: Gemini cites same sources only 40% of the time for identical queries | 研究：Gemini对相同查询的引用一致性仅40%", "why_it_matters": "AI搜索引用具有高度不确定性，品牌无法依赖单一优化点；需建立多触点的AI可见性策略。", "evidence": "TheSocialDude study of 14,472 AI citations across 1,487 local search queries; Gemini source match rate ~40% for identical questions.", "who_it_affects": "local / all", "what_to_do": "对同一查询多次测试AI引用结果；确保官网信息完整准确以最大化被引用概率；不依赖单一引用来源", "confidence": "Data-backed", "impact": "P2", "sources": [{"name": "Marie Haynes / TheSocialDude", "url": "https://x.com/Marie_Haynes/status/2090126912651690174", "excerpt": "Fascinating study by @TheSocialDude on 14,000+ AI search citations: ▪️ When asked the same question, Gemini's cited sources matched only 40% of the time. ▪️ Your own website is the most often cited source - you control much of what AI models say about you. Happy to have contributed a quote!. Fascinating study by @TheSocialDude on 14,000+ AI search citations: ▪️ When asked the same question, Gemini's cited sources matched only 40% of the time. ▪️ Your own website is the most often cited source - you control much of what AI models say about you. Happy to have contributed a quote! Ben Fisher (@TheSocialDude) We analyzed 14,472 AI citations across 1,487 local search queries to see what Gemini…", "author": "@Marie_Haynes", "published": "2026 king relevant information more comprehensive, easier to retrieve…", "author": "@aleyda", "published": "2026-08-19T14:51:04+00:00", "source_type": "expert_analysis"}], "how_to_test": "Pick 10 underperforming pages; expand each with 3-5 directly-answered sub-questions in H2/H3 format; compare impressions at 30/60 days", "success_metric": "Impressions from AI Mode / AI Overviews queries; average position for question-keywords", "effort": "Low-medium (content team dependent); low risk", "evidence_detail": "Survey of 80 SEO practitioners conducted by Aleyda Solis/SEOFOMO community. Self-reported activities with 'meaningful positive impact' on AI Search visibility. Top response: expanding content to cover questions/topics/intents (38/80 = 48%). Restructuring content for retrievability followed at 43%. Technical crawlability/accessibility at 40%. Structured data lagged at 26%. Self-reported data with potential selection bias toward active practitioners; no control group or causal claim. Still useful as directional signal of what's working in the field."}, {"date": "2026-08-20", "section": "Tools, Papers & Open Source", "what_happened": "Google Trends adds explore maps and regional breakdown | Google Trends新增探索地图和区域细分功能", "why_it_matters": "为国际SEO和本地SEO提供更精细的地理需求洞察，支持更精准的内容本地化决策。", "evidence": "Search Engine Roundtable reports Google Trends added interactive explore maps and regional breakdown features for clearer data storytelling.", "who_it_affects": "international / local", "what_to_do": "利用新功能识别区域需求差异，指导本地化内容策略", "confidence": "Speculative", "impact": "P3", "sources": [], "evidence_detail": "Google announced two new features: interactive 'explore maps' for visualizing trend data geographically, and 'regional breakdown' for comparing interest across sub-regions. Designed for clearer data storytelling. The feature appears to be rolling out globally. No impact on search rankings; this is a research tool enhancement.", "unverified": true}, {"date": "2026-09-09", "section": <script>
const DATA = JSON.parse(document.getElementById("radar-data").textContent);
const HEATVAR = {Extreme:"--heat-extreme",High:"--heat-high",Elevated:"--heat-elevated",
  Normal:"--heat-normal",Unknown:"--heat-unknown"};
/* Escape untrusted text. Everything here comes from fetched third-party pages
   and tweets, and some of it lands inside href="…" attributes, so the double
   quote has to be covered — an unescaped one in a source URL would close the
   attribute and let the rest of the string become markup. (It was previously
   missing: the map had two ' keys and no ", which silently turned every
   double quote in a quoted excerpt into the string "undefined".) */
const ESCMAP = {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"};
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>ESCMAP[c]);
const heatColor = b => `var(${HEATVAR[b]||"--heat-unknown"})`;

document.getElementById("thesis").innerHTML =
  esc(DATA.thesis) + (DATA.thesis_zh?`<span class="zh">${esc(DATA.thesis_zh)}</span>`:"");
document.getElementById("footer").textContent =
  `${DATA.days_archived} days archived · ${DATA.library.length} signals · generated ${DATA.generated_at.slice(0,16).replace("T"," ")} UTC`;

/* ---------------- nav ---------------- */
document.querySelectorAll("nav button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    document.getElementById("view-"+b.dataset.view).classList.add("active");
  };
});

/* ---------------- date picker + range buttons ---------------- */
const ARCHIVE = DATA.archive || {};
const DATES = Object.keys(ARCHIVE).sort().reverse();
const picker = document.getElementById("date-picker");
let selectedDate = DATA.today?.date || (DATES[0] || "");
let selectedRange = 1; // 1, 3, or 7 days
DATES.forEach(d => {
  const opt = document.createElement("option");
  opt.value = d;
  opt.textContent = d;
  if (d === selectedDate) opt.selected = true;
  picker.appendChild(opt);
});
picker.onchange = () => { selectedDate = picker.value; renderToday(); };

// Range buttons
const rangeBtns = document.querySelectorAll(".range-btn");
rangeBtns.forEach(btn => {
  btn.onclick = () => {
    rangeBtns.forEach(b => {
      b.classList.remove("active");
      b.style.background = "var(--surface)";
      b.style.borderColor = "var(--line-strong)";
      b.style.color = "var(--ink)";
    });
    btn.classList.add("active");
    btn.style.background = "var(--ink)";
    btn.style.borderColor = "var(--ink)";
    btn.style.color = "#fff";
    selectedRange = parseInt(btn.dataset.range);
    renderToday();
  };
});
// Style the active button on load
(function(){
  const active = document.querySelector(".range-btn.active");
  if(active){active.style.background="var(--ink)";active.style.borderColor="var(--ink)";active.style.color="#fff";}
})();

/* Get the N most recent days ending at selectedDate */
function getRangeRecords(days) {
  const idx = DATES.indexOf(selectedDate);
  if (idx < 0) return [];
  return DATES.slice(idx, idx + days).reverse(); // chronological
}

/* Merge multiple days' records into one virtual record for display */
function mergeRecords(recs) {
  if (recs.length === 1) return recs[0];
  const merged = {date: `${recs[0].date} ~ ${recs[recs.length-1].date}`, sections: {}, headline: ""};
  let totalDropped = 0;
  recs.forEach(r => {
    totalDropped += r.dropped_count || 0;
    Object.entries(r.sections || {}).forEach(([sec, arr]) => {
      if (!merged.sections[sec]) merged.sections[sec] = [];
      // Tag each signal with its source date for multi-day view
      arr.forEach(s => {
        if (sec === "Today's Action Items") {
          merged.sections[sec].push(s);
        } else {
          merged.sections[sec].push({...s, _date: r.date});
        }
      });
    });
  });
  merged.dropped_count = totalDropped;
  // Use the latest day's headline
  merged.headline = recs[recs.length-1]?.headline || "";
  merged.serp = recs[recs.length-1]?.serp;
  merged.confirmed_updates = recs.flatMap(r => r.confirmed_updates || []);
  return merged;
}

/* ---------------- Today ---------------- */
function tag(imp){return imp?`<span class="tag ${esc(imp)}">${esc(imp)}</span>`:"";}
function confTag(c){return c?`<span class="tag conf">${esc(c)}</span>`:"";}
/* Shown when the pipeline could not verify a single source URL for a signal.
   Silence here would be worse than the warning: an unlinked card looks exactly
   like one we simply didn't bother to cite. */
function unverTag(s){return s.unverified?`<span class="tag unver" title="No source URL could be verified against the candidate pool">unverified</span>`:"";}

function morningBrief(rec){
  const sigs=[];
  Object.entries(rec.sections||{}).forEach(([sec,arr])=>{
    if(sec!=="Today's Action Items") arr.forEach(s=>{if(s.what_happened)sigs.push(s);});
  });
  const impacts=sigs.map(s=>s.impact||"");
  const top=["P0","P1","P2","P3"].find(p=>impacts.includes(p))||"—";
  const confirmed=(rec.sections?.["Confirmed Search Updates"]||[]).length>0;
  const band=(rec.serp||{}).global_band||"Unknown";
  const testable=impacts.filter(i=>i==="P0"||i==="P1"||i==="P2").length;
  return {n:sigs.length,top,confirmed,band,testable};
}

/* Source health strip. Silent-failure guard: a dead Nitter and a quiet news
   day produce the same short digest, so coverage has to be visible. */
function healthStrip(rec){
  const rm=rec.run_meta||{};
  const src=rm.sources||{};
  if(!src.x&&!src.rss) return "";
  const parts=[];let worst=0;  // 0 ok, 1 degraded, 2 down
  [["X",src.x],["RSS",src.rss]].forEach(([label,h])=>{
    if(!h||!h.total) return;
    const ratio=h.ok/h.total;
    if(h.ok===0) worst=2; else if(ratio<(DATA.source_warn_ratio??0.7)) worst=Math.max(worst,1);
    parts.push(`<span class="hitem">${label} ${h.ok}/${h.total}</span>`);
  });
  if(!parts.length) return "";
  const cls=worst===2?"down":(worst===1?"warn":"");
  let note="";
  if(worst===2) note="One source layer is completely unavailable — today's digest is NOT representative.";
  else if(worst===1) note="Reduced source coverage — today may be thinner than reality.";
  const failed=[...(src.x?.failed_names||[]),...(src.rss?.failed_names||[])];
  if(worst&&failed.length) note+=` Unreachable: ${failed.slice(0,6).join(", ")}`;
  return `<div class="health ${cls}"><span class="hdot"></span>
    <span class="hitem">Sources</span>${parts.join("")}
    ${note?`<span class="hnote">${esc(note)}</span>`:""}</div>`;
}

function renderToday(){
  const rangeRecs = getRangeRecords(selectedRange);
  const rec = selectedRange === 1 ? (ARCHIVE[selectedDate] || DATA.today || {}) : mergeRecords(rangeRecs);
  const el=document.getElementById("view-today");
  if(!rec.date){el.innerHTML=`<p class="lib-empty">No daily report yet. Run <code>python main.py daily</code> first.</p>`;return;}
  const b=morningBrief(rec);
  const isMultiDay = selectedRange > 1;
  const isLatest = rec.date === (DATA.today?.date || "");
  let h=`<div class="date-label">${esc(rec.date)}${isMultiDay?"":(isLatest?"":" (historical)")}</div>`;
  const urgent=(b.top==="P0");
  // SERP sources are manual adapters by default. Printing "Unknown" invited the
  // reading "calm"; when nothing is wired we say so instead.
  const serpLive=DATA.serp_connected&&b.band&&b.band!=="Unknown";
  const serpCell=serpLive
    ? `<span class="dot-heat" style="background:${heatColor(b.band)}"></span>${esc(b.band)}`
    : `<span style="color:var(--ink-3);font-size:12px;">未接入 / not connected</span>`;
  h+=`<div class="brief">
      <div class="stat lead${urgent?" urgent":""}"><span class="k">Top priority</span><span class="v">${esc(b.top)}</span></div>
      <div class="stat"><span class="k">Signals</span><span class="v">${b.n}</span></div>
      <div class="stat"><span class="k">To act / test</span><span class="v">${b.testable}</span></div>
      <div class="stat"><span class="k">Confirmed update</span><span class="v">${b.confirmed?"Yes":"No"}</span></div>
      <div class="stat"><span class="k">SERP heat</span><span class="v">${serpCell}</span></div>
    </div>`;
  h+=healthStrip(selectedRange===1?(ARCHIVE[selectedDate]||DATA.today||{}):(rangeRecs.length?ARCHIVE[rangeRecs[rangeRecs.length-1]]||{}:{}));
  if(rec.headline) h+=`<div class="headline">${esc(rec.headline)}</div>`;
  h+=serpWeather(rec.serp);

  /* Action Items first */
  const actions=rec.sections?.["Today's Action Items"];
  if(actions&&actions.length){
    h+=`<div class="actions-card"><h2>${isMultiDay?"Action Items":"Today's Action Items"}</h2><ul>`+
      actions.map(s=>`<li>${tag(s.impact)}<span>${esc(s.what_to_do)}</span></li>`).join("")+
      `</ul></div>`;
  }

  (DATA.sections||[]).forEach(sec=>{
    if(sec==="Today's Action Items") return;
    const arr=(rec.sections||{})[sec];
    if(!arr||!arr.length)return;
    h+=`<h2 class="section">${esc(sec)} <span class="count">${arr.length}</span></h2>`;
    arr.forEach(s=>{
      const imp=(s.impact||"").toUpperCase();
      h+=(imp==="P3") ? miniRow(s, isMultiDay) : signalCard(s, isMultiDay);
    });
  });
  if(rec.dropped_count) h+=`<p class="date-label" style="margin-top:20px">Filtered out ${rec.dropped_count} lower-value candidates.</p>`;
  el.innerHTML=h;
}

/* Evidence expansion: the LLM's longer write-up, then the verbatim source
   text. Excerpt-first in spirit — the quote is the part that cannot have been
   fabricated, since it's copied from the fetched item, so it's what settles
   any doubt about the summary above it. */
function evidencePanel(s){
  const detail=s.evidence_detail?`<div class="edetail">${esc(s.evidence_detail)}</div>`:"";
  const quotes=(s.sources||[]).filter(x=>x.excerpt).map(x=>{
    const bits=[];
    if(x.author) bits.push(esc(x.author));
    if(x.published) bits.push(esc(String(x.published).slice(0,10)));
    if(x.source_type) bits.push(`<span class="qtier">${esc(String(x.source_type).replace(/_/g," "))}</span>`);
    // A vendor benchmarking their own product is context the reader needs to
    // weigh the number, so it travels with the quote rather than being buried.
    if(x.commercial_interest) bits.push(`<span class="qci">commercial interest</span>`);
    return `<div class="quote">
      <div class="qhead">${bits.join("")}</div>
      <div class="qtext">${esc(x.excerpt)}</div>
      ${x.url?`<a class="qlink" href="${esc(x.url)}" target="_blank" rel="noopener">View original ↗</a>`:""}
    </div>`;
  }).join("");
  if(!detail&&!quotes) return "";
  const n=(s.sources||[]).filter(x=>x.excerpt).length;
  const label=n?`Evidence · ${n} source${n===1?"":"s"}`:"Evidence detail";
  return `<details class="eviexp"><summary>${label}</summary>
    <div class="evibody">${detail}${quotes}</div></details>`;
}

function signalCard(s, multiDay){
  const imp=s.impact||"";
  const row=(lab,key)=> s[key]?`<div class="row"><span class="lab">${lab}</span><span>${esc(s[key])}</span></div>`:"";
  const srcs=(s.sources||[]).map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name||"source")} ↗</a>`).join("");
  const recipe=[row("Test","how_to_test"),row("Measure","success_metric"),
                row("Effort","effort")].join("");
  const testbox=recipe.trim()?`<div class="testbox">${recipe}</div>`:"";
  const dateTag = (multiDay && s._date) ? `<span class="tag" style="color:var(--ink-3);background:var(--surface-strong);border:1px solid var(--line);font-family:var(--mono);">${esc(s._date)}</span>` : "";
  return `<div class="card ${esc(imp)}">
    <div class="what"><span class="wtext">${esc(s.what_happened)}</span>
      <span class="badges">${dateTag}${tag(s.impact)}${confTag(s.confidence)}${unverTag(s)}</span></div>
    ${row("Why","why_it_matters")}${row("Evidence","evidence")}
    ${row("Affects","who_it_affects")}${row("Action","what_to_do")}
    ${evidencePanel(s)}
    ${testbox}
    ${srcs?`<div class="srcs">${srcs}</div>`:""}
  </div>`;
}

/* Low-priority signals: one scannable line, not a full card. */
function miniRow(s, multiDay){
  const src=(s.sources||[])[0];
  const link=src?`<a class="msrc" href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.name||"source")} ↗</a>`:"";
  const why=s.why_it_matters?` — ${esc(s.why_it_matters)}`:"";
  const dateTag = (multiDay && s._date) ? `<span style="font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-right:6px;">${esc(s._date)}</span>` : "";
  return `<div class="mini">${tag(s.impact)}${dateTag}
    <span class="mtext"><b>${esc(s.what_happened)}</b>${why}</span>${link}</div>`;
}

function serpWeather(serp){
  if(!serp||!serp.global_band) return "";
  const cell=(k,band,v)=>`<div class="serp-cell ${esc(band||'')}"><div class="k">${k}</div>
    <div class="v">${band?`<span class="dot-heat" style="background:${heatColor(band)}"></span>`:""}${esc(v)}</div></div>`;
  const av=serp.anomalous_verticals&&serp.anomalous_verticals.length?serp.anomalous_verticals.join(", "):"none";
  let h=`<div class="serp-grid">
    ${cell("Global Heat",serp.global_band,`${serp.global_band} (${serp.global_heat??"?"})`)}
    ${cell("Vertical Heat",serp.vertical_band,`${serp.vertical_band??"?"} (${serp.vertical_heat??"?"})`)}
    ${cell("Source Agreement","",serp.source_agreement??"n/a")}
    ${cell("Affected Verticals","",av)}
    </div>`;
  if(serp.quadrant) h+=`<div class="serp-note">${esc(serp.quadrant)}. ${esc(serp.interpretation||"")}</div>`;
  return h;
}

/* ---------------- Algorithm Map ---------------- */
const TRACKS=[
  {key:"official",t:"Official",d:"Google confirms"},
  {key:"external",t:"External flux",d:"SERP volatility"},
  {key:"community",t:"Community",d:"expert signals"},
];
let mapRange=(DATA.map_ranges&&DATA.map_ranges[1])||"30D";

function rangeDays(r){return {"7D":7,"30D":30,"90D":90,"1Y":365}[r]||30;}

function renderMap(){
  const el=document.getElementById("view-map");
  const days=rangeDays(mapRange);
  const now=new Date();
  const start=new Date(now.getTime()-days*864e5);
  const ev=(DATA.map_events||[]).filter(e=>{
    const d=new Date(e.date+"T00:00:00Z"); return d>=start && d<=now;
  });
  let h=`<div class="map-controls">`+
    (DATA.map_ranges||[]).map(r=>`<button data-r="${r}" class="${r===mapRange?"active":""}">${r}</button>`).join("")+`</div>`;
  h+=`<div class="legend">
    <span><span class="dot-heat" style="background:var(--heat-extreme)"></span>Extreme</span>
    <span><span class="dot-heat" style="background:var(--heat-high)"></span>High</span>
    <span><span class="dot-heat" style="background:var(--heat-elevated)"></span>Elevated</span>
    <span><span class="dot-heat" style="background:var(--heat-normal)"></span>Normal</span></div>`;

  // Always draw the three lanes, even with no events: the lanes themselves
  // carry information (which layers exist, and which have no source wired).
  // Hiding them behind a single "no events" message was how the permanently
  // empty External-flux track stayed invisible.
  if(!ev.length){
    h+=`<div class="map-empty">No timeline events in the last ${esc(mapRange)}. Confirmed updates, SERP flux and community signals appear here as the archive fills in.</div>`;
  }
  {
    const span=Math.max(1,(now-start));
    const pos=d=>((new Date(d+"T00:00:00Z")-start)/span)*100;
    TRACKS.forEach(tr=>{
      const mine=ev.filter(e=>e.track===tr.key);
      // An empty lane silently asserts "nothing happened". For External flux
      // that's wrong: the SERP adapters are manual, so no pips usually means
      // no data source at all. Label it rather than implying calm.
      const noData=(tr.key==="external"&&!DATA.serp_connected);
      h+=`<div class="track${noData?" nodata":""}"><div class="name"><div class="t">${tr.t}</div><div class="d">${tr.d}</div></div><div class="lane">`;
      if(noData){
        h+=`<div class="nd">未接入 / no volatility source connected — add readings with <code>main.py serp-add</code></div>`;
      }
      mine.forEach(e=>{
        const left=Math.min(99,Math.max(1,pos(e.date)));
        h+=`<div class="ev" style="left:${left}%">
          <div class="pip" style="background:${heatColor(e.band)}"></div>
          <div class="tip">${esc(e.label)}<div class="td">${esc(e.date)} · ${esc(e.detail||e.band)}</div></div>
        </div>`;
      });
      h+=`</div></div>`;
    });
    h+=`<div class="axis"><div></div><div class="ticks">
      <span>${start.toISOString().slice(0,10)}</span><span>${now.toISOString().slice(0,10)}</span></div></div>`;
  }
  el.innerHTML=h;
  el.querySelectorAll(".map-controls button").forEach(b=>{
    b.onclick=()=>{mapRange=b.dataset.r;renderMap();};
  });
}

/* ---------------- Source Library ---------------- */
let libState={q:"",section:"",confidence:"",impact:"",vertical:""};
function renderLibrary(){
  const el=document.getElementById("view-library");
  const secs=[...new Set(DATA.library.map(s=>s.section))];
  const confs=["Confirmed","Data-backed","Observed","Speculative"];
  const imps=["P0","P1","P2","P3"];
  const opt=(v,cur)=>`<option value="${esc(v)}"${v===cur?" selected":""}>${esc(v||"")}</option>`;
  let h=`<div class="lib-filters">
    <input id="lq" placeholder="Search signals…" value="${esc(libState.q)}">
    <select id="lsec"><option value="">All sections</option>${secs.map(s=>opt(s,libState.section)).join("")}</select>
    <select id="lconf"><option value="">Any confidence</option>${confs.map(c=>opt(c,libState.confidence)).join("")}</select>
    <select id="limp"><option value="">Any priority</option>${imps.map(i=>opt(i,libState.impact)).join("")}</select>
    <select id="lvert"><option value="">Any vertical</option>${(DATA.verticals||[]).map(v=>opt(v,libState.vertical)).join("")}</select>
  </div><div id="lib-results"></div>`;
  el.innerHTML=h;
  const bind=(id,key)=>{const n=document.getElementById(id);
    n.oninput=n.onchange=()=>{libState[key]=n.value;drawLibResults();};};
  bind("lq","q");bind("lsec","section");bind("lconf","confidence");bind("limp","impact");bind("lvert","vertical");
  drawLibResults();
}
function drawLibResults(){
  const q=libState.q.toLowerCase();
  let rows=DATA.library.filter(s=>{
    if(libState.section&&s.section!==libState.section)return false;
    if(libState.confidence&&s.confidence!==libState.confidence)return false;
    if(libState.impact&&s.impact!==libState.impact)return false;
    if(libState.vertical&&!(s.who_it_affects||"").toLowerCase().includes(libState.vertical.toLowerCase()))return false;
    if(q){
      // Search the expanded detail and the verbatim excerpts too. This is what
      // makes the Library a real archive: months later you remember a phrase
      // from a study, not the headline we wrote about it.
      const hay=(s.what_happened+" "+s.why_it_matters+" "+s.evidence+" "+s.what_to_do
        +" "+(s.evidence_detail||"")
        +" "+(s.sources||[]).map(x=>(x.excerpt||"")+" "+(x.author||"")).join(" ")).toLowerCase();
      if(!hay.includes(q))return false;
    }
    return true;
  }).sort((a,b)=>b.date.localeCompare(a.date));
  let h=`<div class="lib-count">${rows.length} signal${rows.length===1?"":"s"}</div>`;
  if(!rows.length){h+=`<div class="lib-empty">No matching signals.</div>`;}
  rows.slice(0,400).forEach(s=>{
    const srcs=(s.sources||[]).map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name||"source")} ↗</a>`).join(" ");
    h+=`<div class="lib-row">
      <div class="ld">${esc(s.date)}</div>
      <div><div class="lw">${esc(s.what_happened)} <span class="badges">${tag(s.impact)}${confTag(s.confidence)}${unverTag(s)}</span></div>
        <div class="lmeta"><span>${esc(s.section)}</span>${s.who_it_affects?`<span>· ${esc(s.who_it_affects)}</span>`:""}${srcs?`<span>· ${srcs}</span>`:""}</div>
        ${evidencePanel(s)}
      </div></div>`;
  });
  document.getElementById("lib-results").innerHTML=h;
}

renderToday();renderMap();renderLibrary();
</script>
